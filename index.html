<tbody>
<tr>
<td><strong>Syslog source</strong></td>
<td>Tout appareil ou serveur qui sait envoyer du Syslog</td>
</tr>
<tr>
<td><strong>Linux server (syslog)</strong></td>
<td>Un serveur Linux via <code>rsyslog</code></td>
</tr>
<tr>
<td><strong>Network device</strong></td>
<td>Routeurs, commutateurs, appliances</td>
</tr>
</tbody>
</table>
<aside class="callout c-note">
<p><strong>Note</strong> Pour un serveur Linux ou Windows, l'<strong>agent Controlix</strong> est préférable : il ajoute l'inventaire, l'intégrité des fichiers et une file locale sans perte. Utilisez Syslog quand l'agent n'est pas possible.</p>
</aside>
<h2 id="int-syslog--serveur-linux-avec-rsyslog">Serveur Linux avec rsyslog</h2>
<pre><code class="language-text"># /etc/rsyslog.d/controlix.conf
*.* @@IP_DE_CONTROLIX:514        # TCP ; un seul @ pour UDP
</code></pre>
<pre><code class="language-bash">sudo systemctl restart rsyslog
</code></pre>
<h2 id="int-syslog--equipement-reseau">Équipement réseau</h2>
<p>Dans sa configuration, ajoutez un « serveur Syslog distant » : adresse <code>IP_DE_CONTROLIX</code>, port <code>514</code>, UDP ou TCP, niveau « informational » ou plus.</p>
<h2 id="int-syslog--declarer-dans-controlix">Déclarer dans Controlix</h2>
<table>
<thead>
<tr>
<th>Champ</th>
<th>Valeur</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Solution</code></td>
<td>Syslog source, Linux server ou Network device</td>
</tr>
<tr>
<td><code>Connection</code></td>
<td>Syslog</td>
</tr>
<tr>
<td><code>Name</code></td>
<td>« Routeur agence », « Serveur web 1 »…</td>
</tr>
<tr>
<td><code>IP address of the device (its source address)</code></td>
<td>L'adresse <strong>d'émission</strong> de l'appareil</td>
</tr>
<tr>
<td><code>Port</code> / <code>Protocol</code></td>
<td><code>514</code> / <code>udp</code> ou <code>tcp</code></td>
</tr>
<tr>
<td><code>Device name</code></td>
<td>Affiché quand le message n'en contient pas</td>
</tr>
</tbody>
</table>
<h2 id="int-syslog--tester-sans-equipement">Tester sans équipement</h2>
<p>Depuis une machine du réseau (adresse déclarée comme source) :</p>
<pre><code class="language-bash">for i in $(seq 1 12); do
  echo &quot;&lt;38&gt;sshd[812]: Failed password for root from 192.168.1.45 port 4000$i ssh2&quot; \
    | nc -u -w1 IP_DE_CONTROLIX 514
done
</code></pre>
<p>12 échecs SSH en quelques secondes déclenchent la règle <code>SSH_BRUTE_FORCE</code> : une alerte apparaît dans <strong>Alerts</strong>.</p>
<h2 id="int-syslog--regles-a-retenir">Règles à retenir</h2>
<ul>
<li>Seuls les réseaux de <code>SYSLOG_ALLOWED_NETS</code> et les appareils déclarés sont acceptés.</li>
<li>Derrière un NAT ou un relais, déclarez l'adresse du relais.</li>
<li>Pas d'authentification ni de TLS : filtrez le port 514 par le pare-feu.</li>
</ul><div class="pn"><a href="#docs-int-fortigate"><small>Précédent</small>FortiGate</a><a class="next" href="#docs-int-custom"><small>Suivant</small>Source JSON personnalisée</a></div></article><article class="doc" id="doc-int-custom" data-slug="int-custom" data-title="Source JSON personnalisée" hidden><div class="crumb">Intégrations</div><h1>Source JSON personnalisée</h1><p style="margin-top:0">Interroger une API HTTP(S) qui renvoie du JSON, ou lire un fichier JSON-lines, sans écrire de code.</p>
<p>Pour une application qui expose ses événements en JSON, ou un fichier de lignes JSON.</p>
<h2 id="int-custom--interroger-une-api-http-s">Interroger une API HTTP(S)</h2>
<p><code>Solution</code> Custom, <code>Connection</code> <strong>HTTP(S) JSON polling</strong> (requête <code>GET</code>).</p>
<table>
<thead>
<tr>
<th>Champ</th>
<th>Rôle</th>
<th>Exemple</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Host or IP address</code>, <code>Port</code>, <code>Protocol</code></td>
<td>Où interroger</td>
<td><code>api.mon-appli.local</code>, <code>443</code>, <code>https</code></td>
</tr>
<tr>
<td><code>Path</code></td>
<td>Chemin de l'URL</td>
<td><code>/api/v1/audit</code></td>
</tr>
<tr>
<td><code>Events array (dotted path)</code></td>
<td>Où se trouve la liste d'événements dans la réponse ; vide si la réponse est la liste</td>
<td><code>data.items</code></td>
</tr>
<tr>
<td><code>Unique id field</code></td>
<td>Champ unique pour ne pas relire les mêmes événements</td>
<td><code>id</code></td>
</tr>
<tr>
<td><code>Query parameter for 'since'</code></td>
<td>Nom du paramètre pour ne demander que les nouveautés</td>
<td><code>since</code></td>
</tr>
<tr>
<td><code>Timestamp field</code></td>
<td>Champ d'horodatage</td>
<td><code>timestamp</code></td>
</tr>
<tr>
<td><code>Poll interval (s)</code></td>
<td>Fréquence d'interrogation</td>
<td><code>30</code></td>
</tr>
</tbody>
</table>
<h3 id="int-custom--authentification-un-seul-mode-suffit">Authentification (un seul mode suffit)</h3>
<table>
<thead>
<tr>
<th>Champ</th>
<th>Mode</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Bearer token</code></td>
<td><code>Authorization: Bearer …</code></td>
</tr>
<tr>
<td><code>Basic user</code> + <code>Basic password</code></td>
<td>Authentification basique</td>
</tr>
<tr>
<td><code>Custom header name</code> + <code>Custom header value</code></td>
<td>Un en-tête sur mesure (clé d'API)</td>
</tr>
</tbody>
</table>
<p>Les champs TLS (vérification, empreinte SHA-256, CA) se règlent comme pour les autres solutions.</p>
<h3 id="int-custom--exemple">Exemple</h3>
<p>L'API renvoie :</p>
<pre><code class="language-json">{ &quot;data&quot;: { &quot;items&quot;: [
  { &quot;id&quot;: &quot;a1&quot;, &quot;timestamp&quot;: &quot;2026-11-07T10:02:11Z&quot;, &quot;user&quot;: &quot;alice&quot;, &quot;action&quot;: &quot;login_failed&quot;, &quot;src&quot;: &quot;10.0.0.8&quot; }
] } }
</code></pre>
<p>Réglages : <code>Path</code> <code>/api/v1/audit</code>, <code>Events array</code> <code>data.items</code>, <code>Unique id field</code> <code>id</code>, <code>Timestamp field</code> <code>timestamp</code>.</p>
<h2 id="int-custom--lire-un-fichier-json-lines">Lire un fichier JSON-lines</h2>
<p><code>Connection</code> <strong>JSON-lines file</strong>, <code>Path of the file</code> : un chemin absolu <strong>dans un dossier monté</strong> (<code>/data/suricata/…</code> ou <code>/data/wazuh/…</code>, voir <a href="#docs-int-snort">Snort</a> pour la méthode). Chaque ligne du fichier est un objet JSON.</p>
<h2 id="int-custom--ce-que-devient-chaque-evenement">Ce que devient chaque événement</h2>
<p>L'événement est normalisé dans le schéma commun, avec le JSON d'origine conservé dans le journal brut : retrouvez-le dans <strong>Log Management</strong>. Pour des règles précises sur vos champs, ajoutez un analyseur ou une règle : <a href="#docs-collecte-normalisation">Collecte et normalisation</a>.</p>
<h2 id="int-custom--problemes-frequents">Problèmes fréquents</h2>
<table>
<thead>
<tr>
<th>Symptôme</th>
<th>Cause</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>Statut <code>error</code>, 401/403</td>
<td>Identifiants</td>
<td>Vérifiez le jeton ou le compte</td>
</tr>
<tr>
<td>Aucun événement, statut <code>waiting</code></td>
<td><code>Events array</code> incorrect</td>
<td>Testez avec <code>curl</code> et comparez le chemin pointé</td>
</tr>
<tr>
<td>Les mêmes événements reviennent</td>
<td>Pas de <code>Unique id field</code></td>
<td>Indiquez un champ unique</td>
</tr>
<tr>
<td>Certificat refusé</td>
<td>Auto-signé</td>
<td>Empreinte SHA-256 ou CA</td>
</tr>
</tbody>
</table><div class="pn"><a href="#docs-int-syslog"><small>Précédent</small>Syslog et équipements réseau</a><a class="next" href="#docs-alertes-incidents"><small>Suivant</small>Alertes et incidents</a></div></article><article class="doc" id="doc-alertes-incidents" data-slug="alertes-incidents" data-title="Alertes et incidents" hidden><div class="crumb">Exploitation</div><h1>Alertes et incidents</h1><p style="margin-top:0">Cycle de vie d&#x27;une alerte et d&#x27;un incident, statuts et bonnes pratiques d&#x27;investigation.</p>
<p>Une <strong>alerte</strong> est une détection (règle ou IA). Un <strong>incident</strong> regroupe les alertes liées par la même source, la même cible ou le même utilisateur dans une fenêtre de 30 minutes. Un attaquant ne déclenche pas une alerte, il en déclenche plusieurs : Controlix les relie et dit pourquoi c'est grave.</p>
<h2 id="alertes-incidents--statuts-d-une-alerte">Statuts d'une alerte</h2>
<p><code>NEW</code> → <code>OPEN</code> → <code>REVIEW</code> → <code>CLOSED</code>, ou <code>FALSE_POSITIVE</code>. Fermer une alerte fait retomber le risque de l'actif concerné.</p>
<h2 id="alertes-incidents--statuts-d-un-incident">Statuts d'un incident</h2>
<p><code>NEW</code>, <code>INVESTIGATING</code>, <code>CONTAINED</code>, <code>RESOLVED</code>, <code>FALSE_POSITIVE</code>. Un incident résolu ne reçoit plus de nouvelles alertes : une nouvelle attaque ouvre un nouvel incident.</p>
<h2 id="alertes-incidents--quand-un-incident-s-ouvre-t-il">Quand un incident s'ouvre-t-il ?</h2>
<p>Seulement pour un risque <strong>HIGH ou CRITICAL</strong>, ou pour une détection de gravité critique. Une alerte isolée de faible risque reste une alerte : c'est voulu, pour ne pas noyer l'analyste.</p>
<table>
<thead>
<tr>
<th>Niveau de risque</th>
<th>Score</th>
</tr>
</thead>
<tbody>
<tr>
<td>LOW</td>
<td>0 – 20</td>
</tr>
<tr>
<td>MEDIUM</td>
<td>21 – 40</td>
</tr>
<tr>
<td>HIGH</td>
<td>41 – 70</td>
</tr>
<tr>
<td>CRITICAL</td>
<td>71 – 100</td>
</tr>
</tbody>
</table>
<h2 id="alertes-incidents--lire-une-alerte">Lire une alerte</h2>
<ul>
<li><strong>Description</strong> et nombre d'événements.</li>
<li><strong>Why this risk score</strong> : gravité, confiance, criticité de l'actif, zone, alertes voisines, bonus de motif, anomalie IA.</li>
<li><strong>Événements source</strong> : un clic mène au journal original.</li>
<li><strong>Technique MITRE</strong> et recommandations de la règle.</li>
</ul>
<h2 id="alertes-incidents--lire-un-incident">Lire un incident</h2>
<ul>
<li><strong>Summary</strong> : actifs touchés, IP sources et destinations, sources de détection, techniques MITRE.</li>
<li><strong>Correlated alerts</strong> : les alertes qui le composent, de plusieurs sources possibles.</li>
<li><strong>Timeline and analyst notes</strong> : chronologie (alertes rattachées, changements de statut, motif d'attaque reconnu) et vos notes. Écrivez ce que vous avez fait : c'est la mémoire de l'investigation.</li>
</ul>
<h2 id="alertes-incidents--bonnes-pratiques">Bonnes pratiques</h2>
<ul>
<li>Traitez d'abord les incidents CRITICAL sur actifs critiques.</li>
<li>Notez chaque action ; changez le statut au fil de l'eau.</li>
<li>Si une règle produit surtout des faux positifs, ajustez-la plutôt que de fermer en boucle (<a href="#docs-detection-correlation">Détection et corrélation</a>).</li>
<li>Si un poste est compromis : <strong>Agents › Revoke</strong> coupe sa clé immédiatement.</li>
</ul>
<aside class="callout c-note">
<p><strong>Note</strong> Controlix <strong>détecte et alerte</strong> ; il ne bloque rien. Le blocage (pare-feu, IPS) reste de votre ressort.</p>
</aside><div class="pn"><a href="#docs-int-custom"><small>Précédent</small>Source JSON personnalisée</a><a class="next" href="#docs-sauvegarde-mise-a-jour"><small>Suivant</small>Sauvegarde et mise à jour</a></div></article><article class="doc" id="doc-sauvegarde-mise-a-jour" data-slug="sauvegarde-mise-a-jour" data-title="Sauvegarde et mise à jour" hidden><div class="crumb">Exploitation</div><h1>Sauvegarde et mise à jour</h1><p style="margin-top:0">Sauvegarder, restaurer, mettre à jour le serveur et les agents sans perdre de données.</p>
<h2 id="sauvegarde-mise-a-jour--sauvegarder">Sauvegarder</h2>
<pre><code class="language-bash">cd /opt/controlix
sudo ./install.sh backup
</code></pre>
<p>L'archive contient la base PostgreSQL, <code>.env</code>, les certificats et la configuration. Si la pile est arrêtée, <code>backup</code> démarre uniquement PostgreSQL. Les événements OpenSearch ne sont pas inclus (rétention courte par conception).</p>
<p>Sauvegarde quotidienne conseillée (cron) :</p>
<pre><code class="language-bash">0 3 * * * /opt/controlix/install.sh backup --yes
</code></pre>
<aside class="callout c-astuce">
<p><strong>Astuce</strong> Gardez une copie <strong>hors du serveur</strong>. <code>.env</code> contient les clés <code>SECRETS_KEY</code> et <code>AGENT_SIGNING_KEY</code> : traitez l'archive comme un secret.</p>
</aside>
<h2 id="sauvegarde-mise-a-jour--restaurer">Restaurer</h2>
<pre><code class="language-bash">sudo ./install.sh restore &lt;archive&gt;
</code></pre>
<p>Restaure base, configuration et certificats.</p>
<h2 id="sauvegarde-mise-a-jour--mettre-a-jour-le-serveur">Mettre à jour le serveur</h2>
<pre><code class="language-bash">curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo sh -s -- update
</code></pre>
<p>La commande :</p>
<ol>
<li>télécharge la dernière archive et <strong>vérifie sa somme SHA-256</strong> ;</li>
<li>fait une <strong>sauvegarde</strong> automatique ;</li>
<li>tire les nouvelles images, redémarre les services et applique les migrations de base ;</li>
<li>lance l'auto-test.</li>
</ol>
<p><code>update</code> ne modifie jamais <code>.env</code> ni vos données. Pour une version précise : <code>update --version 1.0.1</code>. Contrôle : <code>sudo /opt/controlix/install.sh status</code> montre tous les services sains et <strong>System Health</strong> est vert. Si quelque chose tourne mal : <code>sudo /opt/controlix/install.sh restore backups/&lt;dernière&gt;.tar.gz</code>.</p>
<h2 id="sauvegarde-mise-a-jour--mettre-a-jour-les-agents">Mettre à jour les agents</h2>
<p>Les agents se mettent à jour par le serveur, avec un binaire <strong>signé</strong> (Ed25519) :</p>
<ol>
<li>La mise à jour du serveur publie les nouveaux binaires et leur manifeste (le serveur les signe avec votre <code>AGENT_SIGNING_KEY</code>).</li>
<li><strong>Agents</strong> : envoyez la commande <strong>Update</strong> (un poste ou tous).</li>
<li>L'agent vérifie signature et empreinte, remplace son exécutable, redémarre ; en cas d'échec il garde l'ancienne version.</li>
</ol>
<h2 id="sauvegarde-mise-a-jour--bonnes-pratiques">Bonnes pratiques</h2>
<ul>
<li>Mettez à jour d'abord le serveur, ensuite les agents.</li>
<li>Sauvegardez avant chaque mise à jour.</li>
<li>Conservez <code>AGENT_SIGNING_KEY</code> et <code>SECRETS_KEY</code>.</li>
<li>Après une coupure de courant : <code>systemctl start controlix</code> ; les files Redis (AOF) et les tampons des agents garantissent la reprise sans perte.</li>
</ul><div class="pn"><a href="#docs-alertes-incidents"><small>Précédent</small>Alertes et incidents</a><a class="next" href="#docs-depannage"><small>Suivant</small>Dépannage</a></div></article><article class="doc" id="doc-depannage" data-slug="depannage" data-title="Dépannage" hidden><div class="crumb">Exploitation</div><h1>Dépannage</h1><p style="margin-top:0">Symptômes fréquents, causes probables et solutions.</p>
<p>Premiers réflexes :</p>
<pre><code class="language-bash">./install.sh status
./install.sh self-test
docker compose logs --tail=100 backend      # worker, collector, postgres, redis, nginx, frontend
</code></pre>
<p>Les journaux sont en rotation automatique.</p>
<table>
<thead>
<tr>
<th>Symptôme</th>
<th>Cause probable</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>L'installeur refuse de continuer</td>
<td>Installation existante</td>
<td>Normal : confirmez, une sauvegarde est faite avant toute modification. Utilisez <code>update</code></td>
</tr>
<tr>
<td>« --host is required »</td>
<td>Adresse du serveur non fournie</td>
<td>Ajoutez <code>--host</code> avec l'IP ou le nom de <strong>votre</strong> serveur</td>
</tr>
<tr>
<td>Téléchargement impossible (serveur de téléchargement, registre d'images)</td>
<td>Pas d'accès Internet sortant, proxy</td>
<td>Autorisez les domaines de la commande d'installation et du registre d'images ; l'installation hors ligne n'est pas prise en charge</td>
</tr>
<tr>
<td>« checksum » : rien n'est installé</td>
<td>Archive corrompue ou interceptée</td>
<td>Relancez ; si cela persiste, changez de réseau</td>
</tr>
<tr>
<td><code>backend</code> redémarre en boucle</td>
<td><code>.env</code> incomplet ou <code>SECRETS_KEY</code> invalide</td>
<td><code>docker compose logs backend</code>. Ne régénérez les clés que sur une installation neuve</td>
</tr>
<tr>
<td><code>password authentication failed for user controlix</code></td>
<td>Volume PostgreSQL créé avec un ancien mot de passe</td>
<td>Alignez le mot de passe (<code>ALTER USER controlix PASSWORD '…'</code> avec celui du <code>.env</code>) ou, sur une installation vide, <code>docker compose down -v</code></td>
</tr>
<tr>
<td>Certificat non fiable dans le navigateur</td>
<td>CA privée non installée</td>
<td>Importez <code>data/tls/ca.pem</code> ou fournissez votre certificat</td>
</tr>
<tr>
<td>Agent : « token invalid »</td>
<td>Jeton expiré, utilisé ou quota atteint</td>
<td>Créez un nouveau jeton</td>
</tr>
<tr>
<td>Agent : erreur TLS / empreinte</td>
<td>Mauvaise adresse ou autre CA</td>
<td>L'adresse de la commande doit être celle des certificats ; régénérez la commande</td>
</tr>
<tr>
<td>Agent « offline »</td>
<td>Service arrêté, réseau coupé, clé révoquée</td>
<td><code>systemctl status controlix-agent</code> / <code>Get-Service ControlixAgent</code> ; l'agent reprend seul et renvoie son tampon</td>
</tr>
<tr>
<td>Aucune donnée Windows</td>
<td>Droits insuffisants pour le journal Security</td>
<td>Le service doit tourner en <code>LocalSystem</code></td>
</tr>
<tr>
<td>Événements en retard, 429</td>
<td>File d'ingestion saturée</td>
<td>System Health ; aucune perte ; ajoutez du CPU ou un worker</td>
</tr>
<tr>
<td>Disque qui se remplit</td>
<td>Rétention trop longue</td>
<td>Log Management › Retention</td>
</tr>
<tr>
<td>Intégration : erreur de certificat</td>
<td>CA inconnue du collecteur</td>
<td>Collez la CA ou l'empreinte SHA-256</td>
</tr>
<tr>
<td>Intégration : cible refusée</td>
<td>Garde SSRF</td>
<td>Utilisez l'adresse réelle de l'équipement ; ajustez <code>INTERNAL_SUBNET</code></td>
</tr>
<tr>
<td>Intégration : « SECRETS_KEY manquant »</td>
<td>Clé absente</td>
<td>Définissez-la dans <code>.env</code>, redémarrez</td>
</tr>
<tr>
<td>Syslog : rien ne s'affiche</td>
<td>Pare-feu ou adresse non autorisée</td>
<td>Ouvrez UDP/TCP 514 ; déclarez l'équipement ou ajoutez son réseau à <code>SYSLOG_ALLOWED_NETS</code> ; vérifiez le NAT</td>
</tr>
<tr>
<td>Règle personnalisée sans effet</td>
<td>Worker non redémarré ou règle invalide</td>
<td>Validez dans Correlation, puis <code>docker compose restart worker</code></td>
</tr>
<tr>
<td>Alerte sans incident</td>
<td>Seuls HIGH/CRITICAL ouvrent un incident</td>
<td>Ajustez la gravité de la règle</td>
</tr>
<tr>
<td><code>install.sh install</code> : « database dump failed »</td>
<td>Pile arrêtée</td>
<td>Corrigé : la sauvegarde démarre PostgreSQL seule, ou passe en mode « configuration seule » à l'installation</td>
</tr>
<tr>
<td><code>self-test</code> : « dashboard is served » en échec, ou erreur <strong>502</strong> après une mise à jour</td>
<td>nginx a gardé l'ancienne adresse d'un conteneur recréé</td>
<td><code>docker compose restart nginx</code>. Corrigé dans l'installeur : nginx est redémarré automatiquement après <code>install</code>, <code>update</code> et <code>restore</code></td>
</tr>
<tr>
<td><code>self-test</code> : « an unknown enrollment token is refused »</td>
<td>Ancien <code>install.sh</code> : faux jeton trop court (le serveur répond 422 au lieu de 401)</td>
<td>Utilisez la version 1.0.1 ou plus récente de l'installeur</td>
</tr>
<tr>
<td><code>docker compose restart</code> ou <code>up</code> : « required variable … is missing »</td>
<td>Commande lancée hors du dossier d'installation, ou <code>.env</code> absent</td>
<td>Placez-vous dans le dossier d'installation (celui qui contient <code>.env</code>)</td>
</tr>
</tbody>
</table>
<h2 id="depannage--pour-un-support">Pour un support</h2>
<p>Fournissez <code>./install.sh status</code>, <code>docker compose ps</code> et les derniers journaux — <strong>sans</strong> le fichier <code>.env</code>.</p><div class="pn"><a href="#docs-sauvegarde-mise-a-jour"><small>Précédent</small>Sauvegarde et mise à jour</a><a class="next" href="#docs-utilisateurs-roles"><small>Suivant</small>Utilisateurs et rôles</a></div></article><article class="doc" id="doc-utilisateurs-roles" data-slug="utilisateurs-roles" data-title="Utilisateurs et rôles" hidden><div class="crumb">Administration</div><h1>Utilisateurs et rôles</h1><p style="margin-top:0">Comptes, connexion par nom d&#x27;utilisateur ou e-mail, rôles intégrés et rôles personnalisés.</p>
<h2 id="utilisateurs-roles--premier-administrateur">Premier administrateur</h2>
<p>Il est créé <strong>à l'installation</strong> : l'installeur demande nom d'utilisateur, e-mail et mot de passe (12 caractères minimum). Rien de tout cela n'est écrit dans <code>.env</code>. Pour en ajouter un après coup :</p>
<pre><code class="language-bash">sudo ./scripts/create-admin.sh
</code></pre>
<h2 id="utilisateurs-roles--se-connecter">Se connecter</h2>
<p>Avec le <strong>nom d'utilisateur ou l'e-mail</strong> et le mot de passe. Après 5 tentatives ratées en une minute, la connexion est suspendue brièvement : c'est une protection, pas une panne. La session est un jeton d'accès de 15 minutes renouvelé par un cookie HttpOnly (7 jours).</p>
<h2 id="utilisateurs-roles--roles-integres">Rôles intégrés</h2>
<table>
<thead>
<tr>
<th>Rôle</th>
<th>Peut faire</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>VIEWER</code></td>
<td>Tout consulter, aucun bouton d'action</td>
</tr>
<tr>
<td><code>SOC_ANALYST</code></td>
<td>+ changer le statut des alertes et incidents, notes, créer des actifs</td>
</tr>
<tr>
<td><code>SECURITY_MANAGER</code></td>
<td>Comme l'analyste, plus les actions de réponse</td>
</tr>
<tr>
<td><code>ADMIN</code></td>
<td>Tout : utilisateurs, rôles, agents, intégrations, règles, rétention</td>
</tr>
</tbody>
</table>
<h2 id="utilisateurs-roles--roles-personnalises">Rôles personnalisés</h2>
<p>Un administrateur peut créer ses propres rôles dans <strong>Settings › Roles</strong> : un nom (minuscules, chiffres, <code>_</code>) et un ensemble de <strong>permissions</strong> parmi <code>READ</code>, <code>WRITE</code>, <code>INVESTIGATE</code>, <code>RESPOND</code>, <code>ADMIN</code>. Les rôles intégrés ne sont ni modifiables ni supprimables ; un rôle personnalisé encore attribué à un utilisateur ne peut pas être supprimé.</p>
<h2 id="utilisateurs-roles--creer-et-modifier-un-compte">Créer et modifier un compte</h2>
<p><strong>Settings › Users › Create</strong> : nom d'utilisateur (<code>a-z</code>, <code>0-9</code>, <code>.</code>, <code>_</code>, <code>-</code>, 3 à 64 caractères), e-mail, mot de passe, rôle. Vous pouvez modifier le rôle, désactiver un compte ou réinitialiser son mot de passe.</p>
<aside class="callout c-attention">
<p><strong>Attention</strong> Le dernier administrateur actif ne peut être ni rétrogradé ni désactivé : la plateforme refuse l'action pour que vous ne perdiez jamais l'accès.</p>
</aside>
<h2 id="utilisateurs-roles--le-serveur-decide">Le serveur décide</h2>
<p>Les boutons interdits sont masqués, <strong>et</strong> le serveur refuse l'action même si on la tentait directement (HTTP 403, tracé dans le journal d'audit).</p><div class="pn"><a href="#docs-depannage"><small>Précédent</small>Dépannage</a><a class="next" href="#docs-securite"><small>Suivant</small>Sécurité de la plateforme</a></div></article><article class="doc" id="doc-securite" data-slug="securite" data-title="Sécurité de la plateforme" hidden><div class="crumb">Administration</div><h1>Sécurité de la plateforme</h1><p style="margin-top:0">Modèle de sécurité du serveur, des agents et des intégrations, rotation des secrets, limites connues.</p>
<p>Principes : moindre privilège, défense en profondeur, aucun secret en clair, aucune exécution arbitraire.</p>
<h2 id="securite--serveur">Serveur</h2>
<ul>
<li>Seul <strong>nginx</strong> est publié (HTTPS 443, redirection 80, syslog sur liste blanche). Base, Redis, worker, collecteur et API ne sont joignables que sur le réseau interne Docker.</li>
<li>TLS partout ; CA privée ou certificat fourni ; en-têtes de sécurité, limitation de débit, <code>X-Forwarded-For</code> réécrit par nginx.</li>
<li>Mots de passe <strong>Argon2id</strong>, JWT court + cookie de rafraîchissement HttpOnly/Secure, RBAC, <strong>journal d'audit</strong> des actions sensibles.</li>
<li>Secrets générés à l'installation (<code>.env</code> en 0600), jamais dans l'image ni le dépôt.</li>
</ul>
<h2 id="securite--agents">Agents</h2>
<table>
<thead>
<tr>
<th>Mécanisme</th>
<th>Détail</th>
</tr>
</thead>
<tbody>
<tr>
<td>Enrôlement</td>
<td>Jeton <code>cxe_</code> à durée courte, usage limité, consommé atomiquement, jamais écrit sur le disque de l'agent</td>
</tr>
<tr>
<td>Authentification</td>
<td>Clé <code>cxa_</code> propre à chaque poste, stockée hachée (SHA-256), fichier de configuration en 0600, révocation immédiate</td>
</tr>
<tr>
<td>Transport</td>
<td>HTTPS avec CA épinglée (empreintes vérifiées)</td>
</tr>
<tr>
<td>Actions</td>
<td>Uniquement <code>restart</code>, <code>collect_inventory</code>, <code>update</code> ; toute autre commande est refusée (422) côté serveur <strong>et</strong> ignorée par l'agent. <strong>Aucun shell distant</strong></td>
</tr>
<tr>
<td>Mises à jour</td>
<td>Manifeste et binaires signés <strong>Ed25519</strong>, vérifiés avant remplacement</td>
</tr>
<tr>
<td>Robustesse</td>
<td>Tampon disque borné, dédoublonnage, CPU/RAM limités, <code>NoNewPrivileges</code> et <code>ProtectSystem=full</code></td>
</tr>
</tbody>
</table>
<h2 id="securite--integrations-externes">Intégrations externes</h2>
<p>Identifiants chiffrés (Fernet/MultiFernet), jamais renvoyés ni journalisés ; TLS vérifié par défaut ; garde SSRF ; aucune commande envoyée aux outils tiers ; gestion réservée aux <code>ADMIN</code>.</p>
<h2 id="securite--rotation-et-incident">Rotation et incident</h2>
<table>
<thead>
<tr>
<th>Situation</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr>
<td>Rotation de <code>SECRETS_KEY</code></td>
<td>Ajoutez la nouvelle clé <strong>en tête</strong> (MultiFernet), gardez l'ancienne le temps de réenregistrer</td>
</tr>
<tr>
<td>Poste compromis</td>
<td><strong>Agents › Revoke</strong></td>
</tr>
<tr>
<td>Certificat serveur à renouveler</td>
<td><code>sh scripts/gen-tls.sh --renew &lt;noms&gt;</code> (même clé, les agents continuent), puis <code>docker compose restart nginx</code></td>
</tr>
<tr>
<td>Fuite de la clé de signature</td>
<td>Régénérez-la, reconstruisez et redistribuez les agents</td>
</tr>
</tbody>
</table>
<aside class="callout c-attention">
<p><strong>Attention</strong> Perdre <code>SECRETS_KEY</code> oblige à ressaisir les identifiants d'intégration ; perdre <code>AGENT_SIGNING_KEY</code> oblige à réenrôler les agents. Sauvegardez-les.</p>
</aside>
<h2 id="securite--limites-connues">Limites connues</h2>
<ul>
<li>L'agent Linux s'exécute en <strong>root</strong> (nécessaire pour lire <code>auth.log</code> et journald). Ce <strong>n'est pas un EDR</strong> : pas de blocage, pas d'inspection mémoire.</li>
<li>Pas de signalement de vulnérabilités (CVE).</li>
<li>Permissions d'intégration non granulaires (administrateurs seulement).</li>
<li>Pas de TLS sur Syslog.</li>
</ul>
<p>Pour signaler une vulnérabilité : contactez l'administrateur de la plateforme ; ne publiez pas de détails avant correction.</p><div class="pn"><a href="#docs-utilisateurs-roles"><small>Précédent</small>Utilisateurs et rôles</a><a class="next" href="#docs-reference-api"><small>Suivant</small>Référence de l&#x27;API</a></div></article><article class="doc" id="doc-reference-api" data-slug="reference-api" data-title="Référence de l&#x27;API" hidden><div class="crumb">Référence</div><h1>Référence de l&#x27;API</h1><p style="margin-top:0">API de gestion et API des agents : authentification, routes, pagination, erreurs.</p>
<p>Documentation interactive OpenAPI : <code>/api/docs</code> si <code>DOCS_ENABLED=true</code> (désactivée en production par défaut). Toutes les routes <code>/api/v1/*</code> exigent une authentification, sauf <code>health</code>, <code>ready</code> et <code>auth/login</code>.</p>
<h2 id="reference-api--authentification">Authentification</h2>
<pre><code class="language-bash">curl -sk https://SERVEUR/api/v1/auth/login \
  -H 'Content-Type: application/json' \
  -d '{&quot;identifier&quot;:&quot;admin&quot;,&quot;password&quot;:&quot;********&quot;}'
# → {&quot;access_token&quot;:&quot;…&quot;, …} + cookie de rafraîchissement HttpOnly

curl -sk https://SERVEUR/api/v1/events?limit=10 -H &quot;Authorization: Bearer $TOKEN&quot;
</code></pre>
<p>Autres routes : <code>POST /auth/refresh</code>, <code>POST /auth/logout</code>, <code>GET /auth/me</code> (renvoie aussi les <strong>permissions</strong> effectives).</p>
<h2 id="reference-api--api-de-gestion-api-v1">API de gestion (<code>/api/v1</code>)</h2>
<table>
<thead>
<tr>
<th>Domaine</th>
<th>Routes principales</th>
</tr>
</thead>
<tbody>
<tr>

<tr>

</tr>
<tr>

</tr>

</tr>
<tr>

<td><code>GET /infrastructure/overview</code>, <code>…/machines</code>, <code>…/machines/{id}</code>, <code>…/machines/{id}/inventory/{software\|services\|processes\|ports\|users}</code>, <code>…/machines/{id}/changes</code></td>

<tr>

</tr>
<tr>
<td>Santé / rétention</td>
<td><code>GET /system/health</code>, <code>GET/PUT /system/retention</code></td>
</tr>
<tr>
<td>Security Solutions</td>
<td><code>GET /integrations/solutions/catalog</code>, <code>GET/POST /integrations/solutions</code>, <code>PATCH/DELETE …/{id}</code>, <code>POST …/{id}/connect</code>, <code>…/disconnect</code>, <code>…/{id}/test</code>, <code>POST …/test</code></td>
</tr>
<tr>
<td>Utilisateurs / rôles</td>
<td><code>/users</code>, <code>/roles</code></td>
</tr>
<tr>
<td>Autres</td>
<td><code>/assets</code>, <code>/dashboard</code>, <code>/risk</code>, <code>/mitre</code>, <code>/rules</code>, <code>/ai/*</code>, <code>/response/*</code>, <code>/notifications</code>, <code>/demo/*</code></td>
</tr>
</tbody>
</table>
<p>Les commandes d'agent n'acceptent que <code>restart</code>, <code>collect_inventory</code> et <code>update</code>.</p>
<h2 id="reference-api--pagination-et-erreurs">Pagination et erreurs</h2>
<p>Réponses paginées : <code>{"items": […], "total": n, "limit": n, "offset": n}</code>. Erreurs : <code>{"detail": "…"}</code> — <code>422</code> validation, <code>401</code>, <code>403</code>, <code>404</code>, <code>409</code>, <code>429</code> (avec <code>Retry-After</code>).</p>
<p>Les identifiants d'intégration ne sont <strong>jamais</strong> renvoyés : la réponse indique seulement les champs renseignés (<code>credentials_set</code>). Pour un <code>PATCH</code>, les champs d'identifiants envoyés remplacent les existants, une chaîne vide supprime le champ, les champs absents sont conservés.</p>
<h2 id="reference-api--api-des-agents-agent">API des agents (<code>/agent</code>)</h2>

<th>Rôle</th>

</tr>
<tr>
<td><code>POST /agent/v1/heartbeat</code></td>
<td>idem</td>

</tr>
<tr>

<td>idem</td>
<td>Binaire</td>

<tr>

<td>publique</td>

</tr>
</tbody>
</table>
<p>Le protocole est rétro-compatible au sein d'une version majeure (<code>/agent/v1</code>). Le contrat complet (formats JSON, garanties) est fourni par l'éditeur sur demande.</p>
<h2 id="reference-api--syslog">Syslog</h2>
<p>UDP/TCP 514 (5514 dans le conteneur), limité à <code>SYSLOG_ALLOWED_NETS</code> et aux équipements déclarés.</p><div class="pn"><a href="#docs-securite"><small>Précédent</small>Sécurité de la plateforme</a><a class="next" href="#docs-configuration"><small>Suivant</small>Variables de configuration</a></div></article><article class="doc" id="doc-configuration" data-slug="configuration" data-title="Variables de configuration" hidden><div class="crumb">Référence</div><h1>Variables de configuration</h1><p style="margin-top:0">Les variables du fichier .env et les fichiers de configs/ à connaître.</p>
<p>Tout se règle dans <strong><code>.env</code></strong> et dans <strong><code>configs/</code></strong>. Après modification de <code>.env</code> : <code>docker compose up -d</code>. Après modification de <code>configs/</code> : <code>docker compose restart backend worker</code>.</p>
<aside class="callout c-note">
<p><strong>Note</strong> Le compte administrateur n'est <strong>pas</strong> dans <code>.env</code> : il est demandé à l'installation.</p>

<h2 id="configuration--memoire">Mémoire</h2>
<p><code>POSTGRES_MEM_LIMIT</code>, <code>REDIS_MEM_LIMIT</code>, <code>REDIS_MAXMEMORY</code>, <code>OPENSEARCH_MEM_LIMIT</code>, <code>OPENSEARCH_JAVA_OPTS</code> (tas Java ≈ la moitié de la limite), <code>BACKEND_MEM_LIMIT</code>, <code>WORKER_MEM_LIMIT</code>, <code>AI_MEM_LIMIT</code>, <code>COLLECTOR_MEM_LIMIT</code>, <code>FRONTEND_MEM_LIMIT</code>, <code>NGINX_MEM_LIMIT</code>.</p>
<h2 id="configuration--fichiers-de-configs">Fichiers de <code>configs/</code></h2>
<table>
<thead>
<tr>
<th>Fichier</th>
<th>Rôle</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>configs/rules/*.yaml</code></td>
<td>Règles de détection (<code>custom.yaml</code> pour les vôtres)</td>
</tr>
<tr>
<td><code>configs/parsers/*.yaml</code></td>
<td>Analyseurs déclaratifs</td>
</tr>
<tr>
<td><code>configs/correlation_patterns.yaml</code></td>
<td>Motifs d'attaque nommés</td>
</tr>
<tr>
<td><code>configs/risk_weights.yaml</code></td>
<td>Pondérations du score de risque</td>
</tr>
</tbody>
</table>
<p>Pour le risque : montez <code>ot_zone</code> et <code>asset_criticality.CRITICAL</code> si vos automates sont ce qui compte ; baissez <code>severity.high</code> si les alertes isolées sont trop sévères. Le total reste plafonné à 100 et chaque contribution reste affichée. <code>asset_risk_half_life_hours</code> règle le déclin (12 h par défaut, <code>0</code> désactive). Les niveaux 0-20 / 21-40 / 41-70 / 71-100 sont fixes.</p><div class="pn"><a href="#docs-reference-api"><small>Précédent</small>Référence de l&#x27;API</a><a class="next" href="#docs-dimensionnement"><small>Suivant</small>Dimensionnement et performances</a></div></article><article class="doc" id="doc-dimensionnement" data-slug="dimensionnement" data-title="Dimensionnement et performances" hidden><div class="crumb">Référence</div><h1>Dimensionnement et performances</h1><p style="margin-top:0">Ressources à prévoir, mode léger ou complet, et résultats mesurés.</p>
<h2 id="dimensionnement--materiel">Matériel</h2>
<table>
<thead>
<tr>
<th>Parc</th>
<th>Mode conseillé</th>
<th>Ressources indicatives</th>
</tr>
</thead>
<tbody>
<tr>
<td>Quelques machines, test</td>
<td>Léger (sans OpenSearch)</td>
<td>2 vCPU, moins de 6 Go de RAM</td>
</tr>
<tr>
<td>Dizaines à centaines de machines</td>
<td>Complet</td>
<td>4 vCPU et plus, 8 Go et plus, disque selon la rétention</td>
</tr>
</tbody>
</table>
<p>L'installeur choisit le mode léger sous 6 Go de RAM ; <code>--light</code> le force. Les limites mémoire par défaut des conteneurs sont : PostgreSQL 512 Mo, Redis 192 Mo, Backend 512 Mo, IA 768 Mo, Worker 384 Mo, Collecteur 128 Mo, Frontend 256 Mo, nginx 64 Mo, OpenSearch 1 Go (mode complet). Elles se règlent dans <code>.env</code>.</p>
<h2 id="dimensionnement--mesures">Mesures</h2>
<p>Environnement de test : 2 vCPU, PostgreSQL + Redis + API + worker sur la même machine, sans OpenSearch, générateur de charge sur la même machine.</p>
<table>
<thead>
<tr>
<th>Test</th>
<th>Résultat</th>
</tr>
</thead>
<tbody>
<tr>
<td>Débit maximal (10 agents, lots de 500)</td>
<td>1 437 événements/s acceptés, 940/s traités de bout en bout, <strong>0 perdu</strong>, contre-pression 429 déclenchée sans erreur</td>
</tr>
<tr>
<td>Débit soutenu de 500 ev/s</td>
<td>474 ev/s, file vide, latence requête p50 30 ms / p95 155 ms, CPU moyen 24 %, RAM 368 Mo</td>
</tr>
<tr>
<td>Latence d'un événement isolé (envoi → stocké)</td>
<td>p50 111 ms, p95 125 ms</td>
</tr>
<tr>
<td>Arrêt brutal (<code>kill -9</code>) du worker en pleine charge</td>
<td>18 000 acceptés → 18 000 stockés, 0 perdu, 0 doublon</td>
</tr>
<tr>
<td>Parcours bout en bout avec un agent réel</td>
<td>30 contrôles réussis, dont coupure serveur (200 événements tamponnés puis livrés)</td>
</tr>
</tbody>
</table>
<p>Le goulot est le worker (un cœur, ≈ 950 ev/s), soit de l'ordre de 80 millions d'événements par jour. Au-delà, ajoutez des workers (le groupe de consommateurs Redis les répartit) ; ce cas n'a pas été mesuré.</p>
<aside class="callout c-note">
<p><strong>Note</strong> Ces chiffres viennent de tests sur une petite machine, pas d'un déploiement client. Mesurez avec <code>scripts/load-native.py</code> sur votre matériel.</p>
</aside>
<h2 id="dimensionnement--quand-la-file-monte">Quand la file monte</h2>
<p><strong>System Health › file d'ingestion</strong> : au-delà du seuil, l'API répond 429/503 avec <code>Retry-After</code>, les agents conservent leur tampon et rien n'est perdu. Ajoutez du CPU au worker, ou un second worker, ou réduisez les sources bruyantes.</p><div class="pn"><a href="#docs-configuration"><small>Précédent</small>Variables de configuration</a><a class="next" href="#docs-faq-limites"><small>Suivant</small>FAQ et limites</a></div></article><article class="doc" id="doc-faq-limites" data-slug="faq-limites" data-title="FAQ et limites" hidden><div class="crumb">Référence</div><h1>FAQ et limites</h1><p style="margin-top:0">Réponses courtes, et ce qui n&#x27;est pas couvert ou n&#x27;a pas été testé.</p>
<h2 id="faq-limites--questions-frequentes">Questions fréquentes</h2>
<p><strong>Controlix remplace-t-il Wazuh ou Suricata ?</strong>
Non. Il lit leurs sorties, les corrèle entre elles et avec ses propres agents, et ajoute risque, incidents et IA.</p>
<p><strong>Est-ce un EDR ?</strong>
Non. Il détecte et alerte ; il ne bloque pas et n'inspecte pas la mémoire.</p>
<p><strong>Mes données sortent-elles de mon réseau ?</strong>
Non : l'IA et tout le traitement sont locaux. Les intégrations n'interrogent que les équipements que vous déclarez.</p>
<p><strong>Que se passe-t-il si le serveur est injoignable ?</strong>
Les agents gardent un tampon disque borné et renvoient tout au retour, sans doublon.</p>
<p><strong>Puis-je écrire mes propres règles ?</strong>
Oui, en YAML : voir <a href="#docs-detection-correlation">Détection et corrélation</a>. Analyseurs aussi.</p>
<p><strong>Quelles langues ?</strong>
La console est en anglais. Ce site et sa documentation sont disponibles en français et en anglais (bouton FR/EN en haut de page).</p>
<p><strong>Combien de machines ?</strong> Voir <a href="#docs-dimensionnement">Dimensionnement</a> : les mesures portent sur un petit serveur.</p>
<h2 id="faq-limites--limites-assumees">Limites assumées</h2>
<ul>
<li><strong>Installation complète</strong> : chaque brique a été testée séparément (API, détection, interface, agent, installeur, archive de publication), mais le parcours complet depuis le site (téléchargement des images puis démarrage) n'a pas été rejoué de bout en bout par l'éditeur sur un serveur vierge. Lancez <code>sudo /opt/controlix/install.sh self-test</code> après installation et signalez tout écart.</li>
<li><strong>Code source</strong> : non distribué. Les images sont tirées d'un registre ; le contenu des conteneurs n'est pas destiné à être modifié.</li>
<li><strong>Agent Windows</strong> : compile, passe <code>go vet</code> et les tests unitaires, mais <strong>n'a pas été exécuté sur un Windows réel</strong>.</li>
<li><strong>Produits tiers</strong> : Wazuh, FortiGate, pfSense, Snort n'étaient pas disponibles ; les connecteurs ont été testés contre des serveurs de protocole locaux et des lignes au format documenté. Vérifiez sur vos propres données.</li>
<li>Pas de correspondance <strong>CVE</strong>, pas de Windows Event Forwarding, pas de Syslog sur TLS.</li>
<li>Permissions d'intégration non granulaires (administrateurs seulement).</li>
<li>Deux règles (changement de pare-feu, agent hors ligne) n'ont pas de mapping MITRE.</li>
<li>Le goulot mesuré est un worker unique ; la montée en charge multi-workers n'a pas été mesurée.</li>
</ul><div class="pn"><a href="#docs-dimensionnement"><small>Précédent</small>Dimensionnement et performances</a><a class="next" href="#docs-glossaire"><small>Suivant</small>Glossaire</a></div></article><article class="doc" id="doc-glossaire" data-slug="glossaire" data-title="Glossaire" hidden><div class="crumb">Référence</div><h1>Glossaire</h1><p style="margin-top:0">Les termes utilisés dans Controlix.</p>
<table>
<thead>
<tr>
<th>Terme</th>
<th>Définition</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Actif (asset)</strong></td>
<td>Machine ou équipement connu, avec zone et criticité</td>
</tr>
<tr>
<td><strong>Agent</strong></td>
<td>Programme Go installé sur un poste, qui collecte journaux et inventaire</td>
</tr>
<tr>
<td><strong>Alerte</strong></td>
<td>Détection produite par une règle ou par l'IA</td>
</tr>
<tr>
<td><strong>Anomalie</strong></td>
<td>Comportement très éloigné de la normale apprise d'une machine</td>
</tr>
<tr>
<td><strong>Contre-pression</strong></td>
<td>Réponse 429/503 qui demande à l'agent de ralentir ; il garde son tampon</td>
</tr>
<tr>
<td><strong>Corrélation</strong></td>
<td>Rapprochement d'alertes liées dans le temps, par source, cible ou utilisateur</td>
</tr>
<tr>
<td><strong><code>cxa_</code> / <code>cxe_</code></strong></td>
<td>Préfixes des clés d'agent et des jetons d'enrôlement</td>
</tr>
<tr>
<td><strong>Dead-letter</strong></td>
<td>File de rebut des événements invalides</td>
</tr>
<tr>
<td><strong>Enrôlement</strong></td>
<td>Première connexion d'un agent avec un jeton à usage limité</td>
</tr>
<tr>
<td><strong>Fenêtre</strong></td>
<td>Durée sur laquelle une règle compte ou ordonne des événements</td>
</tr>
<tr>
<td><strong>Incident</strong></td>
<td>Regroupement d'alertes corrélées à investiguer</td>
</tr>
<tr>
<td><strong>Isolation Forest</strong></td>
<td>Algorithme non supervisé utilisé pour l'IA</td>
</tr>
<tr>
<td><strong>MITRE ATT&amp;CK</strong></td>
<td>Catalogue public de tactiques et techniques d'attaque</td>
</tr>
<tr>
<td><strong>Motif (pattern)</strong></td>
<td>Séquence de règles qui nomme un incident</td>
</tr>
<tr>
<td><strong>Mode léger</strong></td>
<td>Installation sans OpenSearch, événements dans PostgreSQL</td>
</tr>
<tr>
<td><strong>Normalisation</strong></td>
<td>Conversion de tout journal vers un schéma commun, journal brut conservé</td>
</tr>
<tr>
<td><strong>Rétention</strong></td>
<td>Durée de conservation des événements, de l'historique et de l'audit</td>
</tr>
<tr>
<td><strong>Score de risque</strong></td>
<td>Note de 0 à 100 avec le détail de chaque contribution</td>
</tr>
<tr>
<td><strong>SSRF</strong></td>
<td>Détournement du serveur pour atteindre des adresses internes ; bloqué pour les intégrations</td>
</tr>
<tr>
<td><strong>Tampon</strong></td>
<td>File disque de l'agent qui évite toute perte hors connexion</td>
</tr>
<tr>
<td><strong>Zone</strong></td>
<td>Segment de l'actif : IT, OT ou DMZ</td>
</tr>
</tbody>
</table><div class="pn"><a href="#docs-faq-limites"><small>Précédent</small>FAQ et limites</a></div></article></div>

  <section class="band" id="fonctions"><div class="wrap">
    <div class="eyebrow">What Controlix does</div>
    <h2>Every alert comes with its explanation</h2>
    <p class="sub">The risk score shows its calculation, the AI tells you what changed on the machine, and every event keeps its original log.</p>
    <div class="grid">
      <a class="card" href="#docs-agent-installation"><span class="ci"><svg class="ico"><use href="#i-server"/></svg></span><h3>Go agents for Linux and Windows</h3><p>One binary, one command copied from the dashboard. Disk buffer: nothing is lost if the server is unreachable.</p><span class="go">Install an agent →</span></a>
      <a class="card" href="#docs-collecte-normalisation"><span class="ci"><svg class="ico"><use href="#i-layers"/></svg></span><h3>Lossless normalization</h3><p>Every format mapped to one schema, with the raw log kept. Add a format in YAML.</p><span class="go">See the schema →</span></a>
      <a class="card" href="#docs-detection-correlation"><span class="ci"><svg class="ico"><use href="#i-shield"/></svg></span><h3>Rules, sequences, MITRE</h3><p>Thresholds, distinct values and ordered sequences. Alerts from several sources end up in the same incident.</p><span class="go">Write a rule →</span></a>
      <a class="card" href="#docs-ia"><span class="ci"><svg class="ico"><use href="#i-cpu"/></svg></span><h3>Local AI per machine</h3><p>Learns each machine's normal behavior and explains the deviation. No GPU, no data leaves.</p><span class="go">Understand the AI →</span></a>
      <a class="card" href="#docs-inventaire"><span class="ci"><svg class="ico"><use href="#i-list"/></svg></span><h3>Inventory and changes</h3><p>Software, services, ports, accounts. "What changed on this server since yesterday?"</p><span class="go">See the inventory →</span></a>
      <a class="card" href="#docs-integrations"><span class="ci"><svg class="ico"><use href="#i-plug"/></svg></span><h3>Optional integrations</h3><p>Wazuh, Suricata, Snort, pfSense, FortiGate, Syslog. Read-only: no command is ever sent.</p><span class="go">Connect a source →</span></a>
      <a class="card" href="#docs-utilisateurs-roles"><span class="ci"><svg class="ico"><use href="#i-users"/></svg></span><h3>Roles and audit</h3><p>Four built-in roles, custom roles, sign-in by name or e-mail, audit log.</p><span class="go">Manage access →</span></a>

    </div>

  <section class="band alt" id="flux"><div class="wrap">
    <div class="eyebrow">How it works</div>
    <h2>From raw log to incident</h2>
    <p class="sub">An acknowledged event is already published in a durable queue: a hard kill does not lose it, a replay does not duplicate it.</p>
    <div class="flow">
      <div><span class="k">Sources</span><h4>Agents and sensors</h4><p>Linux, Windows, Syslog, Wazuh, Suricata, files.</p></div>
      <div><span class="k">Queue</span><h4>Redis Streams</h4><p>Durable, acknowledged, crash recovery, backpressure.</p></div>
      <div><span class="k">Schema</span><h4>Normalization</h4><p>One common format, enriched by the inventory.</p></div>
      <div><span class="k">Detection</span><h4>Rules + AI</h4><p>Sequences, thresholds, anomalies, risk score.</p></div>
      <div><span class="k">Console</span><h4>Alerts and incidents</h4><p>Grouped, explained, annotated by the analyst.</p></div>
    </div>
  </div></section>

  <section class="band" id="agents"><div class="wrap split">
    <div>
      <div class="eyebrow">Deployment</div>
      <h2>An agent in one line</h2>
      <p class="sub" style="margin-bottom:16px">The dashboard generates the command with a limited-use token and the certificate fingerprint. The script checks the CA and the binary checksum before installing the service.</p>
      <ul>
        <li>Short-lived enrollment <b>token</b>, consumed once.</li>
        <li><b>Agent key</b> unique to each host, revocable immediately.</li>
        <li>Signed <b>updates</b>, verified before replacement.</li>
        <li>Actions limited to <code>restart</code>, <code>collect_inventory</code>, <code>update</code>.</li>
      </ul>
    </div>
    <div>
      <div class="term"><div class="term-bar"><i></i><i></i><i></i><span>agent</span></div>
<pre><code>curl -fsSL -k --pinnedpubkey 'sha256//&lt;fingerprint&gt;' \
  https://203.0.113.10/agent/install.sh \
  | sudo sh -s -- --server https://203.0.113.10 \
      --token cxe_&lt;token&gt; --ca-sha256 &lt;CA-fingerprint&gt;</code></pre></div>
      <p class="note-line">Shortened form, with your server's address. Copy the full command shown in Agents › Agents Deployment.</p>
    </div>
  </div></section>

  <section class="band alt" id="installer"><div class="wrap">
    <div class="eyebrow">Get started</div>
    <h2>One command, with your server's address</h2>
    <p class="sub">Controlix is installed <strong>only</strong> with this installer: no repository to clone, nothing to compile. It checks the machine, installs Docker if needed, downloads the images, generates the secrets and the certificate, then asks for the administrator's user name, e-mail and password.</p>
    <div class="install">
      <div class="term"><div class="term-bar"><i></i><i></i><i></i><span>Linux server · root</span></div>
<pre><code>curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo sh -s -- install --host 203.0.113.10</code></pre></div>
      <div class="callout-home" role="note"><strong>Replace <code>203.0.113.10</code> with the address of YOUR server</strong>, its IP or DNS name, as your browsers and agents will reach it. The HTTPS certificate is issued for that exact address; with another one, the connection is refused. Server in the cloud: give its <em>public</em> IP.</div>
      <div class="steps">
        <div><h4>Run the command</h4><p>On a Linux server, with that server's address.</p></div>
        <div><h4>Create the administrator</h4><p>Name, e-mail and a password of at least 12 characters.</p></div>
        <div><h4>Open the console</h4><p>https://your-address, then accept the private CA.</p></div>
      </div>
      <ul class="chips"><li>Linux x86_64 or arm64</li><li>2 GB RAM minimum, light mode under 6 GB</li><li>Ports 80 and 443 (514 for Syslog)</li><li>Updates: <code>… | sudo sh -s -- update</code></li><li>The source code is not distributed</li></ul>
    </div>

  <div id="articles"><article class="doc" id="doc-introduction" data-slug="introduction" data-title="Introduction" hidden><div class="crumb">Get started</div><h1>Introduction</h1><p style="margin-top:0">What Controlix AI is, who it is for, and what it does (and does not do).</p>
<p><strong>Controlix AI</strong> is a <strong>standalone</strong> SIEM/SOC platform: it collects logs and inventory from your machines, converts them to a common format, detects dangerous behavior, and shows you alerts and incidents in a dashboard. Everything runs on <strong>a single Linux server</strong>, installed with <strong>a single command</strong>, with no source code to handle.</p>
<p>It needs no external tools. Wazuh, Suricata, Snort, pfSense or FortiGate can plug into it as <strong>optional event sources</strong>, but nothing depends on them.</p>
<h2 id="introduction--who-it-is-for">Who it is for</h2>
<ul>
<li>Teams that want an <strong>operational SOC without building a multi-server architecture</strong> (collection, storage, detection engine, interface).</li>
<li>Administrators who manage a <strong>mixed Linux and Windows fleet</strong> and want to see sign-ins, changes and machine status in one place.</li>
<li>Environments where you want to <strong>keep data in-house</strong>: everything is computed locally, including anomaly detection.</li>
</ul>
<h2 id="introduction--what-controlix-does">What Controlix does</h2>
<table>
<thead>
<tr>
<th>Need</th>
<th>Answer</th>
</tr>
</thead>
<tbody>
<tr>
<td>Collect</td>
<td>Linux and Windows agents, Syslog reception, file reading, connectors to existing tools</td>
</tr>
<tr>
<td>Understand</td>
<td>Normalization of all logs into <strong>a single schema</strong>, original log always kept</td>
</tr>
<tr>
<td>Detect</td>
<td>28 bundled rules (thresholds, distinct values, sequences), mapped to <strong>MITRE ATT&amp;CK</strong>, plus learning-based anomaly detection</td>
</tr>
<tr>
<td>Correlate</td>
<td>Alerts from several sources grouped by IP, machine or user into explained <strong>incidents</strong></td>
</tr>
<tr>
<td>Inventory</td>
<td>Hardware, system, software, services, ports, accounts, updates, with <strong>change history</strong></td>
</tr>
<tr>
<td>Administer</td>
<td>Users, custom roles, audit, retention, backups, signed agent updates</td>
</tr>
</tbody>
</table>
<h2 id="introduction--what-controlix-does-not-do">What Controlix does not do</h2>
<aside class="callout c-attention">
<p><strong>Warning</strong> Controlix <strong>detects and alerts</strong>; it does not block anything. It is not an EDR: no kernel hooks, no memory inspection, no automatic quarantine.</p>
</aside>
<ul>
<li>It does not replace a firewall or an IPS: it tells you what to block.</li>
<li>It does not look for CVEs in installed software: the inventory gives the list and the number of pending updates.</li>
<li>Windows Event Forwarding is not supported: you install the agent on each machine.</li>
</ul>
<p>The <a href="#docs-faq-limites">Known limits</a> page gives the complete list, plainly.</p>
<h2 id="introduction--where-to-start">Where to start</h2>
<ol>
<li><a href="#docs-distribution">How Controlix is distributed</a>: one installer, images, no source code.</li>
<li><a href="#docs-installation-serveur">Install the server</a>: one command <strong>with the address of your server</strong>; your credentials are requested.</li>
<li><a href="#docs-premiere-connexion">Sign in and create users</a>.</li>
<li><a href="#docs-agent-installation">Install a first agent</a> from the dashboard.</li>
<li>Watch events arrive in <strong>Log Management</strong>, then the inventory in <strong>Infrastructure</strong>.</li>
<li>With no infrastructure at hand: <a href="#docs-simulation">the simulation</a> plays real attacks for demonstration.</li>
<li>Connect your existing tools: <a href="#docs-integrations">Integrations</a>.</li>
</ol><div class="pn"><span></span><a class="next" href="#docs-concepts"><small>Next</small>Key concepts</a></div></article><article class="doc" id="doc-concepts" data-slug="concepts" data-title="Key concepts" hidden><div class="crumb">Get started</div><h1>Key concepts</h1><p style="margin-top:0">The platform vocabulary: agent, event, rule, alert, incident, asset.</p>
<p>The path of a piece of information, from the monitored machine to the incident:</p>
<pre><code>raw log ─► normalized event ─► rule ─► alert ─► incident
 (agent)      (one schema)    (detection)     (correlation)
</code></pre>
<table>
<thead>
<tr>
<th>Term</th>
<th>Definition</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Agent</strong></td>
<td>Small program installed on a Linux or Windows machine. It sends logs and inventory and accepts only three predefined actions.</td>
</tr>
<tr>
<td><strong>Event</strong></td>
<td>A log line converted to the common schema (<code>NormalizedEvent</code>). The original text remains available (<code>raw_log</code>).</td>
</tr>
<tr>
<td><strong>Asset</strong></td>
<td>A known machine or device: address, zone (IT, OT, DMZ), criticality. Machines enrolled by an agent become assets automatically.</td>
</tr>
<tr>
<td><strong>Rule</strong></td>
<td>A detection condition written in YAML: one event, a threshold within a time window, a count of distinct values, or a sequence.</td>
</tr>
<tr>
<td><strong>Alert</strong></td>
<td>The result of a rule that fires: severity, confidence, MITRE technique, explanation and recommendations.</td>
</tr>
<tr>
<td><strong>Risk score</strong></td>
<td>From 0 to 100, computed from severity, asset criticality, zone and neighboring alerts. Every point is justified on screen.</td>
</tr>
<tr>
<td><strong>Incident</strong></td>
<td>A group of related alerts (same source, same target, same window). It opens when the risk is HIGH or CRITICAL, or when a detection is critical.</td>
</tr>
<tr>
<td><strong>Origin</strong></td>
<td><code>real</code> or <code>simulated</code>: demonstration data never mixes with real data.</td>
</tr>
</tbody>
</table>
<h2 id="concepts--risk-levels">Risk levels</h2>
<table>
<thead>
<tr>
<th>Score</th>
<th>Level</th>
</tr>
</thead>
<tbody>
<tr>
<td>0 – 20</td>
<td>LOW</td>
</tr>
<tr>
<td>21 – 40</td>
<td>MEDIUM</td>
</tr>
<tr>
<td>41 – 70</td>
<td>HIGH</td>
</tr>
<tr>
<td>71 – 100</td>
<td>CRITICAL</td>
</tr>
</tbody>
</table>
<p>An isolated low-risk brute force creates an <strong>alert</strong> without opening an incident. If the same source then signs in successfully, the sequence rule fires as <strong>critical</strong> and the incident opens.</p>
<h2 id="concepts--the-server">The server</h2>
<p>A single server hosts: the HTTPS entry point (nginx), the API, a processing worker, the collector (Syslog, files, connectors), PostgreSQL, Redis, the AI service and the web interface. OpenSearch is <strong>optional</strong>. See <a href="#docs-collecte-normalisation">Architecture, collection and normalization</a> for details on the flow.</p><div class="pn"><a href="#docs-introduction"><small>Previous</small>Introduction</a><a class="next" href="#docs-distribution"><small>Next</small>How Controlix is distributed</a></div></article><article class="doc" id="doc-distribution" data-slug="distribution" data-title="How Controlix is distributed" hidden><div class="crumb">Get started</div><h1>How Controlix is distributed</h1><p style="margin-top:0">One installer, Docker images, no source code to deploy: what you receive and what gets installed.</p>
<p>Controlix AI is installed <strong>only with the install command</strong> on this site. You have no code repository to clone, nothing to compile, and no dependencies to install by hand.</p>
<h2 id="distribution--what-is-delivered">What is delivered</h2>
<table>
<thead>
<tr>
<th>Item</th>
<th>Role</th>
<th>Where it is</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Installer</strong></td>
<td>A script that checks the server, installs Docker if needed, generates secrets and certificates, and starts the platform</td>
<td><code>https://controlix-ten.vercel.app/install.sh</code></td>
</tr>
<tr>
<td><strong>Docker images</strong></td>
<td>The API, detection engine, AI, collector and interface, ready to use</td>
<td>The publisher's image registry</td>
</tr>
<tr>
<td><strong>Configuration archive</strong></td>
<td>The Compose file, the editable detection rules, the parsers, the certificate scripts, and the prebuilt Linux and Windows agents</td>
<td>The publisher's download server (the one in the install command)</td>
</tr>
</tbody>
</table>
<p>The <strong>product source code is not distributed</strong>: it is neither in the archive nor on your server.</p>
<h2 id="distribution--what-is-installed-on-your-side">What is installed on your side</h2>
<p>In <code>/opt/controlix</code> (changeable with <code>--dir</code>):</p>
<pre><code class="language-text">/opt/controlix
├── docker-compose.yml     the services (do not modify)
├── .env                   your secrets and settings (mode 600, never shared)
├── configs/               detection rules, parsers, risk weightings (editable)
├── data/tls/              the private certificate authority and the server certificate
├── agent/dist/            the Linux and Windows agents, served to your machines
├── backups/               your backups
└── install.sh             status, backup, restore, update, self-test, uninstall
</code></pre>
<p>Data (database, queues, AI model) lives in Docker volumes on your server. No data is sent to the vendor.</p>
<h2 id="distribution--integrity">Integrity</h2>
<ul>
<li>The archive is downloaded with its <strong>SHA-256 checksum</strong>, verified <strong>before</strong> any installation. If it does not match, nothing is installed.</li>
<li>Images are pulled by <strong>version number</strong>: <code>./install.sh update</code> installs a specific version, reversible thanks to the backup made beforehand.</li>
<li>Agents are <strong>signed with Ed25519</strong> by your own key, generated at installation (see <a href="#docs-securite">Platform security</a>).</li>
</ul>
<h2 id="distribution--versions-and-updates">Versions and updates</h2>
<p>The install command installs the <strong>latest version</strong>. For a specific version, add <code>--version 1.0.0</code>. Updates use the same command with <code>update</code>, after an automatic backup: see <a href="#docs-sauvegarde-mise-a-jour">Backup and update</a>.</p>
<h2 id="distribution--private-registry">Private registry</h2>
<p>If the vendor gives you private access to the images, add your username and export the token:</p>
<pre><code class="language-bash">export CONTROLIX_REGISTRY_TOKEN='&lt;token provided&gt;'
curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo -E sh -s -- install --host 203.0.113.10 --registry-user mon-compte
</code></pre>
<aside class="callout c-note">
<p><strong>Note</strong> The server must be able to reach the Internet during installation and updates (the download server of the install command, the image registry, Docker Hub). An offline installation is not supported in this version.</p>
</aside><div class="pn"><a href="#docs-concepts"><small>Previous</small>Key concepts</a><a class="next" href="#docs-installation-serveur"><small>Next</small>Install the server</a></div></article><article class="doc" id="doc-installation-serveur" data-slug="installation-serveur" data-title="Install the server" hidden><div class="crumb">Get started</div><h1>Install the server</h1><p style="margin-top:0">The single command, the address (IP or name) to provide, the options, and what the installer does step by step.</p>
<p>Installation takes <strong>one command</strong>, run on the Linux server that will host Controlix.</p>
<h2 id="installation-serveur--before-you-begin">Before you begin</h2>
<table>
<thead>
<tr>
<th>Item</th>
<th>Requirement</th>
</tr>
</thead>
<tbody>
<tr>
<td>System</td>
<td>64-bit Linux (x86_64 or arm64): Ubuntu 22.04/24.04 or Debian 12 recommended</td>
</tr>
<tr>
<td>Privileges</td>
<td><code>root</code> (or <code>sudo</code>)</td>
</tr>
<tr>
<td>Memory</td>
<td>2 GB minimum; automatic <strong>light mode</strong> below 6 GB</td>
</tr>
<tr>
<td>Disk</td>
<td>10 GB free minimum</td>
</tr>
<tr>
<td>Free ports</td>
<td><strong>80</strong> and <strong>443</strong>; <strong>514</strong> (UDP/TCP) if you receive Syslog</td>
</tr>
<tr>
<td>Network</td>
<td>Outbound Internet access during installation (download server of the install command, image registry, Docker Hub)</td>
</tr>
<tr>
<td>Tools</td>
<td><code>curl</code>, <code>tar</code>, <code>openssl</code> (Docker is installed by the installer if missing)</td>
</tr>
</tbody>
</table>
<h2 id="installation-serveur--your-server-s-address-the-host-option">Your server's address: the <code>--host</code> option</h2>
<aside class="callout c-attention">
<p><strong>Warning</strong> Controlix is installed <strong>with the address of YOUR server</strong>. Replace <code>203.0.113.10</code> below with the IP address (or DNS name) of the machine <strong>as your browsers and agents will reach it</strong>. It is not an example value to keep.</p>
</aside>
<p>The HTTPS certificate is issued <strong>for this exact address</strong>, and each agent is bound to it. If you give a different address than the one used afterward, the browser or agent will refuse the connection.</p>
<table>
<thead>
<tr>
<th>Your situation</th>
<th>Which address to give</th>
</tr>
</thead>
<tbody>
<tr>
<td>Server on your local network</td>
<td>Its <strong>private IP</strong> (<code>ip -4 addr</code> or <code>hostname -I</code>), for example <code>192.168.1.20</code></td>
</tr>
<tr>
<td>Cloud server (OVH, AWS, Azure, Hetzner…)</td>
<td>Its <strong>public IP</strong>, or a <strong>DNS name</strong> that points to it. The public IP is often not visible inside the machine: <strong>provide it explicitly</strong></td>
</tr>
<tr>
<td>You have a name (<code>203.0.113.10</code>)</td>
<td>The name, with a DNS record that points to the server</td>
</tr>
<tr>
<td>Test on the same machine</td>
<td><code>localhost</code> (no remote agent will be able to connect to it)</td>
</tr>
</tbody>
</table>
<p>Prefer a <strong>DNS name</strong> if the IP address may change.</p>
<h2 id="installation-serveur--the-command">The command</h2>
<pre><code class="language-bash">curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo sh -s -- install --host 203.0.113.10
</code></pre>
<p>If you omit <code>--host</code>, the installer <strong>asks</strong> for the address and suggests the one it detected. Without a terminal (automated script), it refuses to continue: it never guesses the address for you.</p>
<h3 id="installation-serveur--options">Options</h3>
<table>
<thead>
<tr>
<th>Option</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>--host ADDRESS</code></td>
<td>Server IP or DNS name (<strong>adapt it</strong>)</td>
</tr>
<tr>
<td><code>--dir DIR</code></td>
<td>Installation folder (default <code>/opt/controlix</code>)</td>
</tr>
<tr>
<td><code>--light</code></td>
<td>Forces light mode (without OpenSearch)</td>
</tr>
<tr>
<td><code>--demo</code></td>
<td>Enables the <strong>simulation</strong> (demonstration data): see <a href="#docs-simulation">Simulation and demo mode</a></td>
</tr>
<tr>
<td><code>--admin-user NAME</code>, <code>--admin-email EMAIL</code></td>
<td>Pre-fills the administrator account (the password is always requested)</td>
</tr>
<tr>
<td><code>--version X.Y.Z</code></td>
<td>Installs a specific version (default: the latest)</td>
</tr>
<tr>
<td><code>--registry-user NAME</code></td>
<td>Account for a private image registry (<a href="#docs-distribution">details</a>)</td>
</tr>
<tr>
<td><code>--yes</code></td>
<td>Answers "yes" to confirmations (automation)</td>
</tr>
</tbody>
</table>
<h2 id="installation-serveur--what-the-installer-does">What the installer does</h2>
<ol>
<li><strong>Checks</strong> the server: architecture, memory, disk, ports 80/443 free.</li>
<li><strong>Downloads</strong> the configuration archive and <strong>verifies its SHA-256 checksum</strong>.</li>
<li><strong>Installs Docker</strong> if it is missing.</li>
<li><strong>Generates</strong> the secrets (<code>.env</code>, mode 600) and a <strong>private certificate authority</strong> with the certificate for your address.</li>
<li><strong>Pulls the images</strong> and starts the services; waits until they are healthy.</li>
<li>Asks you for the administrator's <strong>username, email and password</strong> (12 characters minimum). None of this is written to <code>.env</code>.</li>
<li>Installs a system service (automatic startup) and runs a <strong>self-test</strong>.</li>
</ol>
<p>Allow 3 to 10 minutes depending on the connection.</p>
<h2 id="installation-serveur--after-installation">After installation</h2>
<ol>
<li><strong>Open the firewall</strong> on the server (and the security group if you are in the cloud):</li>
</ol>
<table>
<thead>
<tr>
<th>Port</th>
<th>Direction</th>
<th>For</th>
</tr>
</thead>
<tbody>
<tr>
<td>443 TCP</td>
<td>inbound</td>
<td>Web interface and agents</td>
</tr>
<tr>
<td>80 TCP</td>
<td>inbound</td>
<td>Redirect to HTTPS</td>
</tr>
<tr>
<td>514 UDP/TCP</td>
<td>inbound from your devices</td>
<td>Syslog (pfSense, FortiGate…)</td>
</tr>
</tbody>
</table>
<ol>
<li>Open <code>https://203.0.113.10</code> (your address). The browser warns that the certificate comes from a private authority: import <code>data/tls/ca.pem</code> into your browser or system, or, for a simple trial, accept the exception.</li>
<li>Sign in with the administrator you created: see <a href="#docs-premiere-connexion">First sign-in</a>.</li>
<li>Add your first machine: <a href="#docs-agent-installation">Install an agent</a>.</li>
</ol>
<pre><code class="language-bash">sudo /opt/controlix/install.sh status      # service status
sudo /opt/controlix/install.sh self-test   # end-to-end check
</code></pre>
<h2 id="installation-serveur--changing-the-address-later">Changing the address later</h2>
<p>If the IP or name changes:</p>
<pre><code class="language-bash">cd /opt/controlix
sudo sh scripts/gen-tls.sh --renew NEW_ADDRESS localhost 127.0.0.1
sudo sed -i 's#^PUBLIC_URL=.*#PUBLIC_URL=https://NEW_ADDRESS#; s#^CORS_ORIGINS=.*#CORS_ORIGINS=https://NEW_ADDRESS#' .env
sudo docker compose up -d
</code></pre>
<p>The authority's key stays the same: agents already installed keep their trust. They do, however, point to the old address: <strong>reinstall them</strong> with the new deployment command (Agents › Agents Deployment).</p>
<h2 id="installation-serveur--uninstall">Uninstall</h2>
<pre><code class="language-bash">sudo /opt/controlix/install.sh uninstall           # stops, keeps the data
sudo /opt/controlix/install.sh uninstall --purge   # also deletes the data (back up first)
</code></pre>
<aside class="callout c-astuce">
<p><strong>Tip</strong> An existing installation is never overwritten without confirmation and without a backup. Re-running the command on a server that is already installed is safe.</p>
</aside><div class="pn"><a href="#docs-distribution"><small>Previous</small>How Controlix is distributed</a><a class="next" href="#docs-premiere-connexion"><small>Next</small>First sign-in</a></div></article><article class="doc" id="doc-premiere-connexion" data-slug="premiere-connexion" data-title="First sign-in" hidden><div class="crumb">Get started</div><h1>First sign-in</h1><p style="margin-top:0">Sign in, discover the interface, create your first users.</p>
<h2 id="premiere-connexion--sign-in">Sign in</h2>
<p>The sign-in page accepts your <strong>username</strong> or your <strong>email</strong>, with the password chosen at installation. The session lasts 7 days as long as you stay active; a 15-minute access token is renewed automatically. After 5 failed attempts in one minute, sign-in is briefly suspended: this is a protection, not an outage.</p>
<p>The sun/moon button at the top right switches between <strong>light mode</strong> and <strong>night mode</strong>. Your choice is remembered.</p>

<h2 id="premiere-connexion--real-or-simulated-data">Real or simulated data</h2>
<p>A <strong>Real data / Simulated</strong> selector appears at the top. Simulated mode shows demonstration data so you can explore the interface; a yellow banner reminds you of it. The two worlds never mix.</p>
<h2 id="premiere-connexion--create-users">Create users</h2>
<p><strong>Administration › Users › Add user</strong>: username, email, full name, password (12 characters minimum) and role. The <strong>Edit</strong> button lets you change the role, disable the account or reset the password. See <a href="#docs-utilisateurs-roles">Users and roles</a>.</p>
<h2 id="premiere-connexion--recommended-first-steps">Recommended first steps</h2>
<ol>
<li>Create one account per person; do not share the administrator account.</li>
<li><a href="#docs-agent-installation">Install a first agent</a> on a test machine.</li>
<li>Open <strong>Infrastructure</strong>: the inventory appears within a few minutes.</li>
<li>Open <strong>Log Management</strong> and filter on the machine name.</li>
<li>Set the retention according to your disk space.</li>
</ol><div class="pn"><a href="#docs-installation-serveur"><small>Previous</small>Install the server</a><a class="next" href="#docs-simulation"><small>Next</small>Simulation and demo mode</a></div></article><article class="doc" id="doc-simulation" data-slug="simulation" data-title="Simulation and demo mode" hidden><div class="crumb">Get started</div><h1>Simulation and demo mode</h1><p style="margin-top:0">Generate real simulated attacks to see the whole detection chain, with no infrastructure at all.</p>
<p>Controlix includes a <strong>demo mode</strong>: it builds realistic attacks and sends them through <strong>the real engine</strong> (normalization, rules, correlation, risk, incident, AI). You see the product at work without installing a single agent or connecting a single device.</p>
<p>It is used to <strong>explore</strong> the product, to <strong>train</strong> a team, to <strong>present</strong> a demonstration, and to <strong>check</strong> that a custom rule reacts.</p>
<h2 id="simulation--strict-separation">Strict separation</h2>
<p>Simulated data is <strong>marked</strong> and <strong>never</strong> mixes with real data:</p>
<ul>
<li>a <strong>Real data / Simulated</strong> selector at the top of the console chooses which world is displayed;</li>
<li>a yellow banner "Simulated data — Demo Mode" reminds you that nothing comes from your infrastructure;</li>
<li>a <strong>Delete simulated data</strong> button deletes everything simulated; real data is never touched.</li>
</ul>
<h2 id="simulation--enable-the-simulation">Enable the simulation</h2>
<p>The simulation is <strong>disabled by default</strong>. There are two ways to enable it:</p>
<pre><code class="language-bash"># at installation
curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo sh -s -- install --host 203.0.113.10 --demo

# or later
sudo sed -i 's/^DEMO_MODE_ENABLED=.*/DEMO_MODE_ENABLED=true/' /opt/controlix/.env
cd /opt/controlix &amp;&amp; sudo docker compose up -d
</code></pre>
<p>The <strong>Administration › Demo</strong> menu appears (administrators only).</p>
<aside class="callout c-attention">
<p><strong>Warning</strong> Disable the simulation on a real production server: set <code>DEMO_MODE_ENABLED=false</code> again and re-run <code>docker compose up -d</code>.</p>
</aside>
<h2 id="simulation--use-the-demo-page-step-by-step">Use the Demo page, step by step</h2>
<h3 id="simulation--1-create-the-simulated-environment">1 · Create the simulated environment</h3>
<p>The <strong>Seed assets</strong> button creates <strong>10 simulated assets</strong>: servers, a firewall, a SCADA workstation, controllers (PLC) and connected devices, spread across the IT and OT zones.</p>
<h3 id="simulation--2-launch-an-attack-scenario">2 · Launch an attack scenario</h3>
<p>Choose a scenario from the <strong>Scenario</strong> list, then <strong>Run scenario</strong>. The console switches to the simulated data.</p>

<tr>
<th>Scenario</th>
<th>What it plays</th>
</tr>
</thead>

<tr>
