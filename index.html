<td><strong>The full story</strong>: SSH brute force, port scan, successful sign-in, privilege escalation, merged into <strong>one critical incident</strong></td>
</tr>
<tr>
<td><code>port_scan</code></td>
<td>Port sweep from one source</td>
</tr>
<tr>
<td><code>plc_compromise</code></td>
<td>Scan, then abnormal MQTT traffic to a controller</td>
</tr>
<tr>
<td><code>abnormal_mqtt</code></td>
<td>Unusual MQTT traffic</td>
</tr>
<tr>
<td><code>malware_detection</code></td>
<td>Malware detection</td>
</tr>
<tr>
<td><code>suspicious_dns</code></td>
<td>Suspicious DNS requests</td>
</tr>
<tr>
<td><code>failed_login</code></td>
<td>Repeated failed sign-ins</td>
</tr>
<tr>
<td><code>file_modification</code></td>
<td>Modification of a sensitive file</td>
</tr>
<tr>
<td><code>unusual_traffic</code></td>
<td>Unusual traffic volume</td>
</tr>
<tr>
<td><code>ai_anomaly</code></td>
<td>See step 4</td>
</tr>
</tbody>
</table>
<p>Then go to <strong>Alerts</strong> and <strong>Incidents</strong> with the selector on <em>Simulated</em>.</p>
<h3 id="simulation--3-live-traffic">3 · Live traffic</h3>
<p><strong>Start live traffic</strong> launches background traffic and <strong>one random attack about every 2 minutes</strong>, handy for a demonstration that stays lively. <strong>Stop live traffic</strong> stops it.</p>
<h3 id="simulation--4-ai-anomaly-detection">4 · AI anomaly detection</h3>
<p>The AI must see normal behavior before it can spot the abnormal. Follow the four buttons <strong>in order</strong>, then open <strong>AI Detection</strong>:</p>
<ol>
<li><strong>Generate normal traffic</strong>: 6 hours of normal traffic;</li>
<li><strong>Train the model</strong>: model training;</li>
<li><strong>Simulate the anomaly</strong>: a controller (PLC-03) contacts dozens of unknown hosts and floods MQTT;</li>
<li><strong>Analyse now</strong>: the AI flags the deviation <strong>and explains what changed</strong>.</li>
</ol>
<h2 id="simulation--a-ten-minute-demonstration">A ten-minute demonstration</h2>
<ol>
<li>Enable the simulation, <strong>Seed assets</strong>, <strong>Run scenario</strong> <code>ssh_compromise</code>.</li>
<li><strong>Overview</strong>: the overall risk rises, a critical incident appears.</li>
<li>Open the incident: the timeline shows the four alerts and the recognized pattern; "Why this risk score" details the score.</li>
<li><strong>MITRE ATT&amp;CK</strong>: the observed techniques light up.</li>
<li>Continue with step 4 to show the AI.</li>
<li>Finish with <strong>Delete simulated data</strong>.</li>
</ol>
<aside class="callout c-note">
<p><strong>Note</strong> The simulation sends <strong>already formatted</strong> events to the engine: it proves that detection works, not that your own devices are properly connected. For that, use the <a href="#docs-integrations">Integrations</a> pages.</p>
</aside><div class="pn"><a href="#docs-premiere-connexion"><small>Previous</small>First sign-in</a><a class="next" href="#docs-agent-installation"><small>Next</small>Install an agent</a></div></article><article class="doc" id="doc-agent-installation" data-slug="agent-installation" data-title="Install an agent" hidden><div class="crumb">Agents</div><h1>Install an agent</h1><p style="margin-top:0">One command per machine, generated from the dashboard. Linux and Windows.</p>
<p>The dashboard generates a <strong>custom command</strong> containing a limited-use token. You paste it on the machine, and the agent installs, enrolls and starts. The token is never stored on the machine and can be used only once (or the number of times you set).</p>
<h2 id="agent-installation--step-1-generate-the-token">Step 1: generate the token</h2>
<ol>
<li>Open <strong>Agents › Agents Deployment</strong>.</li>
<li>Fill in the form, then click <strong>Generate token</strong>.</li>
<li>Copy the <strong>Linux</strong> or <strong>Windows</strong> command: the <code>cxe_…</code> token is shown <strong>only once</strong>; the server keeps only its fingerprint.</li>
</ol>
<table>
<thead>
<tr>
<th>Field</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td>Label</td>
<td>Free-form name to find the token again ("Web servers", "Paris fleet")</td>
</tr>
<tr>
<td>Validity</td>
<td>From 1 h to 720 h (30 days)</td>
</tr>
<tr>
<td>Uses</td>
<td>Number of machines that can enroll with this token, from 1 to 1000</td>
</tr>
<tr>
<td>Zone</td>
<td><code>IT</code>, <code>OT</code> or <code>DMZ</code>: zone assigned to the enrolled machines</td>
</tr>
<tr>
<td>Criticality</td>
<td><code>LOW</code>, <code>MEDIUM</code>, <code>HIGH</code> or <code>CRITICAL</code>: default value for the machines</td>
</tr>
</tbody>
</table>
<p>An expired, exhausted or revoked token always gets the same response (401), with no indication of the cause.</p>
<h2 id="agent-installation--step-2a-linux-machine">Step 2a: Linux machine</h2>
<p>Paste the command in a <strong>root</strong> terminal (or with <code>sudo</code>):</p>
<pre><code class="language-bash">curl -fsSL -k --pinnedpubkey 'sha256//&lt;fingerprint&gt;' \
  https://203.0.113.10/agent/install.sh \
  | sudo sh -s -- --server https://203.0.113.10 \
      --token cxe_&lt;token&gt; --ca-sha256 &lt;CA-fingerprint&gt;
</code></pre>
<p>The script retrieves the server's CA and <strong>verifies its fingerprint</strong>, downloads the binary and <strong>verifies its SHA-256 checksum against the manifest</strong>, enrolls the machine, then installs and starts the <code>controlix-agent</code> service (systemd). Architectures: <code>amd64</code> and <code>arm64</code>.</p>
<p>The <code>-k</code> in <code>curl</code> is used only for bootstrapping: the server's public key is pinned with <code>--pinnedpubkey</code>. After that, the agent trusts <strong>only the Controlix CA</strong> (no system CA, no bypass).</p>
<p>The service runs as <strong>root</strong>, which is required to read <code>/var/log/auth.log</code> and journald and to monitor sensitive files. It is constrained: <code>NoNewPrivileges</code>, <code>ProtectSystem=full</code>, <code>MemoryMax</code>, <code>CPUQuota=30%</code> and automatic restart.</p>
<h2 id="agent-installation--step-2b-windows-machine">Step 2b: Windows machine</h2>
<p>Open <strong>PowerShell as administrator</strong> and paste the Windows command from the dashboard (a single line). It validates the server certificate by its fingerprint, downloads <code>install.ps1</code>, then installs the <code>ControlixAgent</code> service (delayed automatic start, automatic restart on failure).</p>
<pre><code class="language-powershell">powershell -NoProfile -ExecutionPolicy Bypass -Command &quot;
  [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12;
  iwr -UseBasicParsing https://203.0.113.10/agent/install.ps1 `
      -OutFile $env:TEMP\controlix-install.ps1;
  &amp; $env:TEMP\controlix-install.ps1 -Server https://203.0.113.10 `
      -Token cxe_&lt;token&gt; -CaSha256 &lt;CA-fingerprint&gt;&quot;
</code></pre>
<aside class="callout c-note">
<p><strong>Note</strong> Shortened form, split across several lines for readability. <strong>Copy the full command shown by the dashboard</strong>: it fits on a single line and already contains the certificate fingerprint.</p>
</aside>
<p>Logs read: <strong>Security</strong>, <strong>System</strong> and <strong>Application</strong> (configurable list of event IDs). Add <code>-EnableAudit</code> to enable the audit policy required for some security events.</p>
<aside class="callout c-attention">
<p><strong>Warning</strong> The Windows agent is compiled and tested against real output samples, but has not yet been run on a real Windows machine during development. Deploy to <strong>a pilot machine</strong> first and check the steps below.</p>
</aside>
<h2 id="agent-installation--step-3-verify">Step 3: verify</h2>
<ol>
<li>In <strong>Agents</strong>, the machine appears within seconds with the status <code>online</code>, its version and its last activity.</li>
<li>In <strong>Infrastructure</strong>, it is shown with its hardware, software, services, ports and accounts (the full inventory arrives within a few minutes).</li>
<li>In <strong>Log Management</strong>, filter on the hostname: events appear with the original log.</li>
</ol>
<p>On the machine:</p>
<pre><code class="language-bash">controlix-agent status        # credentials + connectivity (exit code 0 if OK)
controlix-agent collect-now   # sends a full inventory right away
systemctl status controlix-agent        # Linux
Get-Service ControlixAgent              # Windows (PowerShell)
</code></pre>
<h2 id="agent-installation--deploy-to-many-machines">Deploy to many machines</h2>
<p>Generate <strong>one token with N uses</strong> and a suitable validity, then run the same command from your deployment tool (Ansible, GPO, Intune, SSH script). Each machine gets its <strong>own agent key</strong>; the token is used only for enrollment.</p>
<h2 id="agent-installation--manual-installation">Manual installation</h2>
<pre><code class="language-bash">CONTROLIX_TOKEN=cxe_&lt;token&gt; controlix-agent enroll \
  --server https://203.0.113.10 --ca-file ca.pem --ca-sha256 &lt;CA-fingerprint&gt;
controlix-agent service install &amp;&amp; controlix-agent service start
</code></pre>
<h2 id="agent-installation--locations-on-the-machine">Locations on the machine</h2>
<table>
<thead>
<tr>
<th></th>
<th>Linux</th>
<th>Windows</th>
</tr>
</thead>
<tbody>
<tr>
<td>Configuration (restricted access)</td>

<p>Then revoke the agent in <strong>Agents › Revoke</strong> so that its key is permanently rejected.</p><div class="pn"><a href="#docs-simulation"><small>Previous</small>Simulation and demo mode</a><a class="next" href="#docs-agent-configuration"><small>Next</small>Configure agents</a></div></article><article class="doc" id="doc-agent-configuration" data-slug="agent-configuration" data-title="Configure agents" hidden><div class="crumb">Agents</div><h1>Configure agents</h1><p style="margin-top:0">Settings managed centrally on the server: frequencies, collectors, logs, buffer.</p>

<h2 id="agent-configuration--change-the-configuration">Change the configuration</h2>
<p>The configuration is changed through the administration API. Absent keys keep their default value. Example: follow an application's log, enlarge the buffer and monitor no processes.</p>
<pre><code class="language-bash">SERVER=https://203.0.113.10
TOKEN=$(curl -s --cacert data/tls/ca.pem -H 'Content-Type: application/json' \
  -d '{&quot;identifier&quot;:&quot;soc.admin&quot;,&quot;password&quot;:&quot;&lt;password&gt;&quot;}' $SERVER/api/v1/auth/login \
  | sed -n 's/.*&quot;access_token&quot;:&quot;\([^&quot;]*\)&quot;.*/\1/p')

curl -s --cacert data/tls/ca.pem -X PUT $SERVER/api/v1/agents/config \
  -H &quot;Authorization: Bearer $TOKEN&quot; -H 'Content-Type: application/json' -d '{
    &quot;config&quot;: {
      &quot;buffer_max_mb&quot;: 1024,
      &quot;collectors&quot;: {&quot;process&quot;: &quot;off&quot;},
      &quot;extra_logs&quot;: [{&quot;path&quot;: &quot;/var/log/nginx/error.log&quot;, &quot;src&quot;: &quot;nginx&quot;}]
    }
  }'
</code></pre>
<p>The response gives the new version number; <code>GET /api/v1/agents/config</code> shows the configuration in effect.</p>
<aside class="callout c-astuce">
<p><strong>Tip</strong> Keep the default values to start. Increase <code>buffer_max_mb</code> for sites with an unstable connection, add <code>extra_logs</code> for your applications, and set <code>collectors.process</code> to <code>off</code> on heavily loaded machines.</p>
</aside>

<h2 id="agent-configuration--sources-read-on-linux">Sources read on Linux</h2>
<p><code>auth.log</code> or <code>secure</code>, <code>syslog</code>, <code>messages</code>, <code>kern.log</code>, journald if the files are missing, the application logs declared in <code>extra_logs</code>, plus sensitive file integrity (fingerprints), new suspicious processes, new listening ports and firewall changes.</p><div class="pn"><a href="#docs-agent-installation"><small>Previous</small>Install an agent</a><a class="next" href="#docs-agent-gestion"><small>Next</small>Manage agents</a></div></article><article class="doc" id="doc-agent-gestion" data-slug="agent-gestion" data-title="Manage agents" hidden><div class="crumb">Agents</div><h1>Manage agents</h1><p style="margin-top:0">Available actions, revocation, signed updates, what the agent refuses to do.</p>
<h2 id="agent-gestion--the-agent-fleet">The agent fleet</h2>
<p><strong>Agents</strong> lists each machine with its status (<code>online</code> / <code>offline</code>), its version, its last activity, buffer fill level and recent errors. An agent is flagged offline when its heartbeats stop; the <code>AGENT_OFFLINE</code> rule can then raise an alert.</p>
<h2 id="agent-gestion--actions">Actions</h2>
<table>
<thead>
<tr>
<th>Button</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Restart</strong></td>
<td>Restarts the agent service</td>
</tr>
<tr>
<td><strong>Inventory</strong></td>
<td>Requests an immediate full inventory</td>
</tr>
<tr>
<td><strong>Update</strong></td>
<td>Updates the agent if a newer version is published</td>
</tr>
<tr>
<td><strong>Revoke</strong></td>
<td>Cuts the agent off immediately</td>
</tr>
</tbody>
</table>
<aside class="callout c-attention">
<p><strong>Warning</strong> These three actions (<code>restart</code>, <code>collect_inventory</code>, <code>update</code>) are the <strong>only</strong> ones the agent accepts. The server rejects any other command type (422), and the agent would ignore it anyway. <strong>No remote shell exists</strong>, by design.</p>
</aside>
<h2 id="agent-gestion--revocation">Revocation</h2>
<p><strong>Revoke</strong> invalidates the agent's key: its requests receive 401, it stops sending, keeps its buffer for 24 h, then purges it. Use it for a compromised, lost or retired machine.</p>
<h2 id="agent-gestion--signed-updates">Signed updates</h2>
<p>The server publishes an <strong>Ed25519-signed manifest</strong> (<code>/agent/v1/manifest</code>). The agent:</p>
<ol>
<li>verifies the signature with the public key received at enrollment;</li>
<li>verifies the SHA-256 and the size of the binary;</li>
<li>replaces its executable atomically, then restarts.</li>
</ol>
<p>If anything fails, it keeps the old version. On Windows, the old executable is renamed to <code>.old</code> and deleted at the next startup.</p>
<p>New agents arrive with each Controlix version, already built for Linux (amd64, arm64) and Windows (amd64). To publish them on your server:</p>
<pre><code class="language-bash">curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo sh -s -- update
</code></pre>
<p>Then, in <strong>Agents</strong>, use the <strong>Update</strong> button (one machine or all).</p>
<p>The protocol is backward compatible within a major version (<code>/agent/v1</code>).</p>
<h2 id="agent-gestion--enrollment-tokens">Enrollment tokens</h2>
<p>In <strong>Agents Deployment</strong>, the list of active tokens shows their prefix, their creator, their expiry and their number of uses. A token can be deleted at any time: agents already enrolled are not affected.</p><div class="pn"><a href="#docs-agent-configuration"><small>Previous</small>Configure agents</a><a class="next" href="#docs-agent-fiabilite"><small>Next</small>Agent reliability</a></div></article><article class="doc" id="doc-agent-fiabilite" data-slug="agent-fiabilite" data-title="Agent reliability" hidden><div class="crumb">Agents</div><h1>Agent reliability</h1><p style="margin-top:0">Disk buffer, delivery without duplicates, backpressure, recovery after a hard stop.</p>
<p>The agent is designed to <strong>not lose security events</strong> and to not get in the way of the machine that hosts it.</p>
<h2 id="agent-fiabilite--bounded-disk-buffer">Bounded disk buffer</h2>
<p>When the server is unreachable, the agent writes to a <strong>buffer on disk</strong> (256 MB by default, adjustable with <code>buffer_max_mb</code>). Two queues separate the priorities:</p>
<ul>
<li><strong>security</strong> events (authentications, log clearing, configuration changes);</li>
<li><strong>non-security</strong> events (application noise, inventory).</li>
</ul>
<p>If the cap is reached, the <strong>oldest</strong> non-security events are dropped first. Every loss is <strong>counted and reported</strong> to the server: the dashboard shows how many events were dropped.</p>
<h2 id="agent-fiabilite--at-least-once-delivery-without-duplicates">At-least-once delivery, without duplicates</h2>
<p>Each event carries a <code>(agent, epoch, seq)</code> triplet. The server deduplicates: after a network outage or a restart, a resent event appears <strong>only once</strong>.</p>
<h2 id="agent-fiabilite--backpressure">Backpressure</h2>
<p>If the server is saturated, it answers <strong>429</strong> or <strong>503</strong> with a <code>Retry-After</code> header. The agent waits and keeps its buffer: the server slows agents down rather than losing data.</p>
<h2 id="agent-fiabilite--hard-stop-of-the-agent">Hard stop of the agent</h2>
<p>File read offsets are persisted. After a <code>kill -9</code> or a power cut, the agent resumes where it stopped; at most about 0.5 s of lines may be replayed, then deduplicated by the server.</p>
<h2 id="agent-fiabilite--resource-limits">Resource limits</h2>
<table>
<thead>
<tr>
<th>Limit</th>
<th>Value</th>
</tr>
</thead>
<tbody>
<tr>
<td>CPU (Linux)</td>
<td><code>CPUQuota=30%</code></td>
</tr>
<tr>
<td>Memory (Linux)</td>
<td><code>MemoryMax</code> of the systemd service</td>
</tr>
<tr>
<td>Binary size</td>
<td>about 6.5 MB, static, no runtime</td>
</tr>
<tr>
<td>External dependencies</td>
<td>one only (<code>golang.org/x/sys</code>)</td>
</tr>
</tbody>
</table>
<h2 id="agent-fiabilite--what-has-been-verified">What has been verified</h2>
<p>The agent's automated tests cover the buffer cap and eviction, crash recovery, file tracking (rotation, truncation, partial lines), pinned TLS (rejection of a different CA), 429 backpressure, 401 revocation, commands outside the allowed list, bounded configuration and signed updates, including with the race detector (<code>-race</code>).</p>
<p>An end-to-end test with the real binary installed the agent with the command from the dashboard, cut the server during sending (200 events buffered, then delivered only once) and killed the agent abruptly (50 events collected, no duplicates).</p><div class="pn"><a href="#docs-agent-gestion"><small>Previous</small>Manage agents</a><a class="next" href="#docs-collecte-normalisation"><small>Next</small>Architecture, collection and normalization</a></div></article><article class="doc" id="doc-collecte-normalisation" data-slug="collecte-normalisation" data-title="Architecture, collection and normalization" hidden><div class="crumb">Platform</div><h1>Architecture, collection and normalization</h1><p style="margin-top:0">The engines, the flow of an event, the common schema and the parsers.</p>
<p>Controlix is made of <strong>engines</strong> that run on a single server. Wazuh, Suricata, Snort, pfSense and FortiGate are optional sources.</p>
<pre><code class="language-text"> Linux/Windows agents ──HTTPS/443──┐
 Firewalls/IDS (syslog 514) ────────┤      ┌────────── CONTROLIX SERVER (1 machine) ───────────┐
 Wazuh / Suricata / custom (pull) ──┘ ───► │ nginx(TLS) → API ──► Redis Streams ──► Worker      │
                                          │ Collector (syslog, files, connectors)              │
                                          │ Worker: normalization → detection → correlation    │
                                          │         → incidents → storage                      │
                                          │ PostgreSQL (state, inventory, alerts)  OpenSearch* │
                                          │ AI (anomalies)   Web interface                     │
                                          └────────────────────────────────────────────────────┘
                                                                                  * optional
</code></pre>
<h2 id="collecte-normalisation--the-engines">The engines</h2>
<table>
<thead>
<tr>
<th>Engine</th>
<th>Role</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Collection</strong></td>
<td>Agent API (enrollment, events, heartbeat, inventory, signed manifest), Syslog listener, file reading, integration connectors</td>
</tr>
<tr>
<td><strong>Normalization</strong></td>
<td>All logs into a single schema; the raw log is always kept</td>
</tr>
<tr>
<td><strong>Correlation and detection</strong></td>
<td>Rules (match, threshold, distinct values, sequence), time windows, grouping, risk score, MITRE ATT&amp;CK, incidents</td>
</tr>
<tr>
<td><strong>Inventory</strong></td>
<td>Snapshots by category and change history</td>
</tr>
<tr>
<td><strong>AI</strong></td>
<td>Anomaly detection with a locally trained model</td>
</tr>
</tbody>
</table>
<h2 id="collecte-normalisation--the-flow-of-an-event">The flow of an event</h2>
<ol>
<li>The agent (or the collector) publishes the raw event to a Redis stream. Publishing happens <strong>before</strong> the acknowledgment is sent to the agent: an acknowledged event is never lost.</li>
<li>The worker reads in <strong>batches</strong>, normalizes, enriches with the inventory, evaluates the rules, correlates, opens or updates incidents, then stores.</li>
<li>Invalid events go to a dead-letter queue without blocking the batch; a batch that fails is replayed.</li>
<li>Event identifiers are deterministic and inserts are idempotent: <strong>a replay does not create duplicates</strong>.</li>
<li>Beyond a queue threshold, the API answers 429/503 with <code>Retry-After</code> and agents keep their buffer.</li>
</ol>
<h2 id="collecte-normalisation--the-normalized-schema">The normalized schema</h2>

<thead>

<th>Field</th>
<th>Content</th>
</tr>
</thead>

<tr>

<td>Deterministic identifier</td>
</tr>
<tr>
<td><code>timestamp</code></td>
<td>Event timestamp</td>
</tr>
<tr>
<td><code>agent_id</code>, <code>hostname</code></td>
<td>Originating machine and agent</td>
</tr>
<tr>
<td><code>source_type</code></td>
<td>Nature of the source (<code>linux.auth</code>, <code>windows.eventlog</code>, <code>pfsense.filterlog</code>...)</td>
</tr>
<tr>
<td><code>event_category</code>, <code>event_action</code></td>
<td>Normalized category and action</td>
</tr>
<tr>
<td><code>severity</code></td>
<td><code>low</code>, <code>medium</code>, <code>high</code>, <code>critical</code></td>
</tr>
<tr>

<tr>

<p>The <code>event_type</code> vocabulary covers in particular: <code>auth_failure</code>, <code>auth_success</code>, <code>privilege_escalation</code>, <code>account_created</code>, <code>log_cleared</code>, <code>file_modified</code>, <code>network_probe</code>, <code>ids_alert</code>, <code>fw_deny</code>, <code>dns_query</code>, <code>flow</code>, <code>syslog</code>.</p>
<h2 id="collecte-normalisation--provided-parsers">Provided parsers</h2>
<p>Linux (auth, syslog), Windows (event XML, DTDs rejected), pfSense (<code>filterlog</code>), FortiGate (key=value), Snort, Suricata (EVE JSON and syslog), generic JSON, agent envelope, and <strong>declarative</strong> parsers.</p>
<h2 id="collecte-normalisation--add-a-format-without-writing-code">Add a format without writing code</h2>
<p>Drop a file in <code>configs/parsers/</code> (see <code>web.yaml</code> for a template): a regular expression with named groups, mapped to the normalized fields. Then:</p>
<pre><code class="language-bash">docker compose restart worker collector
</code></pre>
<p>For a complex format, write a Python parser class registered by name in <code>backend/app/normalization/</code>.</p>

</table><div class="pn"><a href="#docs-agent-fiabilite"><small>Previous</small>Agent reliability</a><a class="next" href="#docs-detection-correlation"><small>Next</small>Detection and correlation</a></div></article><article class="doc" id="doc-detection-correlation" data-slug="detection-correlation" data-title="Detection and correlation" hidden><div class="crumb">Platform</div><h1>Detection and correlation</h1><p style="margin-top:0">Rule types, YAML syntax, sequences, risk score, incidents, MITRE ATT&amp;CK.</p>
<h2 id="detection-correlation--rule-types">Rule types</h2>
<table>
<thead>
<tr>
<th>Type</th>
<th>Triggers when...</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>match</code></td>
<td>an event matches the conditions</td>
</tr>
<tr>
<td><code>threshold</code></td>
<td>the <strong>number</strong> of matching events exceeds <code>count</code> within the window</td>
</tr>
<tr>
<td><code>distinct_count</code></td>
<td>the number of <strong>different values</strong> of a field exceeds <code>count</code> (e.g. one source fails on 3 machines)</td>
</tr>
<tr>
<td><code>sequence</code></td>
<td><strong>ordered</strong> steps occur within the window for the same grouping key</td>
</tr>
</tbody>
</table>
<p>A rule can also depend on another with <code>follows</code>: it acts only if the indicated rule alerted for the same source within the delay.</p>
<h2 id="detection-correlation--write-a-rule">Write a rule</h2>
<p>Rules are in <code>configs/rules/*.yaml</code> (all files in the folder are read). For your own rules, create <code>configs/rules/custom.yaml</code>.</p>
<pre><code class="language-yaml">rules:
  - id: WIN_RDP_BRUTE_FORCE          # UPPERCASE, digits, _ ; unique
    name: Windows logon brute force
    description: Many failed Windows logons against one machine from one source.
    type: threshold
    match: { event_type: auth_failure, source_type: windows.eventlog }
    group_by: [source_ip, hostname]  # one counter per combination
    count: &quot;&gt;10&quot;                     # &gt; &gt;= &lt; &lt;= ==
    window: 5m                       # s, m or h
    severity: high                   # low | medium | high | critical
    confidence: 0.8                  # 0 to 1
    mitre: T1110
    recommendations:
      - Block the source address at the firewall if it is external.
</code></pre>
<p>A sequence:</p>
<pre><code class="language-yaml">  - id: ACCOUNT_CREATED_THEN_PRIVILEGED
    type: sequence
    steps:
      - match: { event_type: account_created }
      - match: { event_type: privilege_escalation }
    group_by: [hostname, username]
    window: 30m
    severity: critical
    mitre: T1136.001
</code></pre>
<h3 id="detection-correlation--match-operators"><code>match</code> operators</h3>
<p>A simple value or a list means "equal to (one of)". A table accepts <code>regex</code>, <code>contains</code>, <code>startswith</code>, <code>endswith</code>, <code>in</code> and <code>not</code>. A field can be a key of <code>normalized_fields</code> with the prefix <code>normalized_fields.</code>.</p>
<h3 id="detection-correlation--apply">Apply</h3>
<aside class="callout c-attention">
<p><strong>Warning</strong> Rules are only reloaded at startup and counters in progress restart from zero. An invalid file prevents startup; the message names the faulty field.</p>
</aside>
<p>Validate first in <strong>Correlation › Custom rules</strong> (the validation API checks the syntax without applying anything), then:</p>
<pre><code class="language-bash">docker compose restart worker
</code></pre>
<h2 id="detection-correlation--the-risk-score">The risk score</h2>
<p>Each alert receives a score from 0 to 100 calculated from the rule's <strong>severity</strong>, its <strong>confidence</strong>, the <strong>criticality</strong> of the affected asset, its <strong>zone</strong> (OT, DMZ, IT) and neighboring alerts. Each contribution is displayed in "Why this risk score". The risk decay of an asset is adjustable (12 h half-life by default). The weights are in <code>configs/risk_weights.yaml</code>.</p>
<h2 id="detection-correlation--incidents-and-attack-patterns">Incidents and attack patterns</h2>
<p>Alerts linked by the same source, the same target or the same user within a 30-minute window are grouped into an <strong>incident</strong>, opened for a HIGH or CRITICAL risk or a critical detection. A <strong>pattern</strong> names an incident when all the rules of a sequence have alerted, in order:</p>
<pre><code class="language-yaml">patterns:
  - id: SSH_COMPROMISE
    title: Possible SSH compromise
    sequence: [SSH_BRUTE_FORCE, SSH_LOGIN_AFTER_BRUTE_FORCE, PRIVILEGE_ESCALATION]
    risk_bonus: 15
</code></pre>
<p>Alerts from several sources (agent, firewall, IDS) end up in the same incident, because correlation reasons on the source IP and the asset, not on the originating sensor.</p>
<h2 id="detection-correlation--mitre-att-ck">MITRE ATT&amp;CK</h2>
<p>Each rule can carry a technique. The <strong>MITRE</strong> page shows the matrix and the <strong>detection coverage</strong>; alerts display the technique and the tactic. The embedded catalog is generated from MITRE's official data (<code>scripts/build_mitre_catalog.py</code>).</p>
<h2 id="detection-correlation--shipped-rules">Shipped rules</h2>
<table><thead><tr><th>Identifier</th><th>Name</th><th>Type</th><th>Severity</th><th>Threshold</th><th>Window</th><th>MITRE</th></tr></thead><tbody><tr><td><code>AI_ANOMALY</code></td><td>AI behaviour anomaly</td><td>match</td><td>medium</td><td></td><td>15m</td><td>—</td></tr><tr><td><code>SSH_BRUTE_FORCE</code></td><td>SSH Brute Force</td><td>threshold</td><td>high</td><td>&gt;10</td><td>5m</td><td>T1110</td></tr><tr><td><code>PORT_SCAN</code></td><td>Port Scan</td><td>distinct_count</td><td>medium</td><td>&gt;=15</td><td>1m</td><td>T1046</td></tr><tr><td><code>SSH_LOGIN_AFTER_BRUTE_FORCE</code></td><td>Successful SSH login after brute force</td><td>match</td><td>critical</td><td></td><td>30m</td><td>T1078</td></tr><tr><td><code>PRIVILEGE_ESCALATION</code></td><td>Privilege Escalation</td><td>match</td><td>high</td><td></td><td>5m</td><td>T1068</td></tr><tr><td><code>MALWARE_DETECTED</code></td><td>Malware Detected</td><td>match</td><td>critical</td><td></td><td>5m</td><td>T1204</td></tr><tr><td><code>SUSPICIOUS_DNS</code></td><td>Suspicious DNS Query</td><td>match</td><td>medium</td><td></td><td>5m</td><td>T1071.004</td></tr><tr><td><code>ABNORMAL_MQTT</code></td><td>Abnormal MQTT Traffic</td><td>match</td><td>high</td><td></td><td>5m</td><td>T1071</td></tr><tr><td><code>CRITICAL_FILE_MODIFICATION</code></td><td>Critical File Modification</td><td>match</td><td>medium</td><td></td><td>10m</td><td>T1565.001</td></tr><tr><td><code>UNUSUAL_NETWORK_TRAFFIC</code></td><td>Unusual Network Traffic</td><td>match</td><td>medium</td><td></td><td>5m</td><td>—</td></tr><tr><td><code>WIN_RDP_BRUTE_FORCE</code></td><td>Windows logon brute force</td><td>threshold</td><td>high</td><td>&gt;10</td><td>5m</td><td>T1110</td></tr><tr><td><code>WIN_LOGIN_AFTER_BRUTE_FORCE</code></td><td>Successful Windows logon after brute force</td><td>match</td><td>critical</td><td></td><td>30m</td><td>T1078</td></tr><tr><td><code>MULTI_HOST_AUTH_FAILURES</code></td><td>Authentication failures on several machines</td><td>distinct_count</td><td>high</td><td>&gt;=3</td><td>10m</td><td>T1110.003</td></tr><tr><td><code>LOG_CLEARED</code></td><td>Audit log cleared</td><td>match</td><td>critical</td><td></td><td>10m</td><td>T1070</td></tr><tr><td><code>NEW_SERVICE_INSTALLED</code></td><td>New Windows service installed</td><td>match</td><td>medium</td><td></td><td>10m</td><td>T1543.003</td></tr><tr><td><code>SCHEDULED_TASK_CREATED</code></td><td>Scheduled task created</td><td>match</td><td>medium</td><td></td><td>10m</td><td>T1053.005</td></tr><tr><td><code>FIREWALL_RULE_CHANGED</code></td><td>Host firewall configuration changed</td><td>match</td><td>medium</td><td></td><td>10m</td><td>—</td></tr><tr><td><code>SENSITIVE_FILE_CHANGED</code></td><td>Sensitive file changed</td><td>match</td><td>high</td><td></td><td>10m</td><td>—</td></tr><tr><td><code>ACCOUNT_CREATED_THEN_PRIVILEGED</code></td><td>New account given administrative rights</td><td>sequence</td><td>critical</td><td></td><td>30m</td><td>T1136.001</td></tr><tr><td><code>SUSPICIOUS_PROCESS</code></td><td>Suspicious process started</td><td>match</td><td>medium</td><td></td><td>5m</td><td>T1059</td></tr><tr><td><code>SUSPICIOUS_COMMAND_LINE</code></td><td>Suspicious command line</td><td>match</td><td>high</td><td></td><td>5m</td><td>T1059</td></tr><tr><td><code>POWERSHELL_SUSPICIOUS</code></td><td>Suspicious PowerShell script</td><td>match</td><td>high</td><td></td><td>5m</td><td>T1059.001</td></tr><tr><td><code>ACCOUNT_LOCKOUT_SPIKE</code></td><td>Several account lockouts</td><td>threshold</td><td>medium</td><td>&gt;=3</td><td>10m</td><td>T1110</td></tr><tr><td><code>NEW_LISTENING_PORT</code></td><td>New listening port</td><td>match</td><td>low</td><td></td><td>30m</td><td>T1571</td></tr><tr><td><code>AGENT_OFFLINE</code></td><td>Agent stopped reporting</td><td>match</td><td>medium</td><td></td><td>30m</td><td>—</td></tr><tr><td><code>IDS_HIGH_SEVERITY</code></td><td>IDS high-severity signature</td><td>match</td><td>high</td><td></td><td>5m</td><td>—</td></tr><tr><td><code>HOST_ALERT_HIGH</code></td><td>Host security alert (high severity)</td><td>match</td><td>high</td><td></td><td>10m</td><td>—</td></tr><tr><td><code>FIREWALL_DENY_BURST</code></td><td>Firewall deny burst</td><td>threshold</td><td>medium</td><td>&gt;=50</td><td>1m</td><td>T1046</td></tr></tbody></table>
<aside class="callout c-note">
<p><strong>Note</strong> The rules are deliberately generic. Tune them with your real data: raise <code>count</code>, lengthen <code>window</code> or lower <code>severity</code> if a rule is too noisy.</p>
</aside><div class="pn"><a href="#docs-collecte-normalisation"><small>Previous</small>Architecture, collection and normalization</a><a class="next" href="#docs-inventaire"><small>Next</small>Inventory and history</a></div></article><article class="doc" id="doc-inventaire" data-slug="inventaire" data-title="Inventory and history" hidden><div class="crumb">Platform</div><h1>Inventory and history</h1><p style="margin-top:0">What the inventory collects, how it is kept and how to read the changes.</p>
<p>Each agent sends an <strong>inventory</strong> by category, at frequencies adapted to how volatile the data is.</p>

</tr>
<tr>

<h2 id="inventaire--where-to-see-it">Where to see it</h2>
<p><strong>Infrastructure</strong> gives an overview (machines, CPU/memory/disk load) and one page per machine with its software, services, ports, accounts and updates.</p>
<h2 id="inventaire--change-history">Change history</h2>
<p>At each inventory, Controlix compares with the previous one and records the <strong>difference</strong>: software installed or removed, a port opened, a service modified, an account added. The <strong>Changes</strong> tab of the machine lists these changes with their date. This is what lets you answer "what changed on this server since yesterday?".</p>
<h2 id="inventaire--inventory-based-detection">Inventory-based detection</h2>
<p>Some rules rely on these changes: <code>NEW_LISTENING_PORT</code> (new listening port), <code>NEW_SERVICE_INSTALLED</code>, <code>SCHEDULED_TASK_CREATED</code>, <code>FIREWALL_RULE_CHANGED</code>, <code>SENSITIVE_FILE_CHANGED</code>.</p>
<aside class="callout c-note">
<p><strong>Note</strong> There is no CVE matching in this version: the inventory gives the software and the number of pending security updates, not the associated known vulnerabilities.</p>
</aside>
<h2 id="inventaire--missing-services">Missing services</h2>
<p>On a machine without systemd (container, some test environments), the service list is empty: this is normal, the service does not exist.</p>
<h2 id="inventaire--privacy">Privacy</h2>
<p>The hardware serial number is collected only if <code>inventory.collect_serial</code> is enabled. The inventory does not contain file contents.</p><div class="pn"><a href="#docs-detection-correlation"><small>Previous</small>Detection and correlation</a><a class="next" href="#docs-ia"><small>Next</small>Anomaly detection (AI)</a></div></article><article class="doc" id="doc-ia" data-slug="ia" data-title="Anomaly detection (AI)" hidden><div class="crumb">Platform</div><h1>Anomaly detection (AI)</h1><p style="margin-top:0">Learning the normal behavior of each machine, with an explanation of every anomaly.</p>
<p>Rules detect what you can describe ("more than 10 SSH failures in 5 minutes"). They do not see what you did not anticipate: a controller that suddenly contacts dozens of unknown addresses, a sensor whose traffic explodes. This is the role of the AI.</p>
<p>Controlix <strong>learns what is normal for each machine</strong>, then flags the moments when it behaves very differently, <strong>stating precisely what changed</strong>. Each anomaly becomes an alert like any other: scored, explained, correlated, and able to open an incident.</p>
<h2 id="ia--why-this-technique">Why this technique</h2>
<table>
<thead>
<tr>
<th>Requirement</th>
<th>Answer</th>
</tr>
</thead>
<tbody>
<tr>
<td>Explain each detection</td>
<td>Simple indicators (counts) and an explanation sentence</td>
</tr>
<tr>
<td>Run on site</td>
<td>Local computation on the CPU: no data leaves</td>
</tr>
<tr>
<td>Stay lightweight</td>
<td>Isolation Forest, no GPU, training in a few seconds</td>
</tr>
<tr>
<td>No labeled data</td>
<td>Unsupervised learning on normal traffic</td>
</tr>
</tbody>
</table>
<h2 id="ia--how-it-works">How it works</h2>
<ol>
<li><strong>Splitting</strong> into 5-minute windows. For each machine, the following are counted: <code>events_out</code>, <code>events_in</code>, <code>peers_out</code>, <code>peers_in</code>, <code>ports_out</code>, <code>auth_failures_in</code>, <code>mqtt_events</code>, <code>new_peers</code>.</li>
<li><strong>Per-machine baseline</strong>: mean and spread of each indicator over its normal behavior. "100 events" is trivial for a gateway and alarming for a sensor.</li>
<li><strong>Deviation</strong>: by how many usual deviations each indicator moves away from the normal of <strong>this</strong> machine.</li>
<li><strong>Isolation forest</strong>: measures how easily this window can be isolated from the rest (score from 0.5 to 1.0).</li>
<li><strong>Decision</strong>: a window is flagged if several indicators change together (score above the learned threshold and one indicator at 4 deviations, <code>AI_Z_THRESHOLD</code>), or if a single indicator explodes (6 deviations, <code>AI_Z_STRONG</code>). A real <strong>increase</strong> is required: silence is not flagged.</li>
</ol>
<p>Example explanation:</p>
<pre><code class="language-text">Outbound events: 197 (usual 10.4, 19x the usual)
Distinct destinations contacted: 47 (usual 1.0, 47x the usual)
MQTT messages: 60 (usual 0.0)
</code></pre>
<h2 id="ia--learning">Learning</h2>
<ul>
<li><strong>Real data</strong>: training starts on its own once there are <strong>24 hours</strong> of history, on the last 7 days, then repeats every 24 hours. Before that, the page shows "collecting baseline".</li>
<li>Windows where a HIGH or CRITICAL alert concerns the machine are <strong>excluded</strong>: an attack is not learned as normal.</li>
<li>A machine with fewer than 12 usable windows has no baseline.</li>
<li>Real and simulated data each have their own model.</li>
</ul>
<h2 id="ia--integration-with-the-rest">Integration with the rest</h2>
<p>The anomaly becomes an alert (<code>AI_ANOMALY</code> rule) with the same risk and correlation engines. It adds up to <strong>15 points</strong> of risk, and another alert on the same machine within 30 minutes receives the same points: a detection on a machine that behaves oddly deserves more attention. An anomaly that lasts produces <strong>a single alert</strong> (15-minute rest per machine).</p>
<p>The AI service is a <strong>separate process</strong>: training affects neither the API nor collection.</p>

</table><div class="pn"><a href="#docs-inventaire"><small>Previous</small>Inventory and history</a><a class="next" href="#docs-stockage-retention"><small>Next</small>Storage and retention</a></div></article><article class="doc" id="doc-stockage-retention" data-slug="stockage-retention" data-title="Storage and retention" hidden><div class="crumb">Platform</div><h1>Storage and retention</h1><p style="margin-top:0">Where the data goes, how long it is kept and how to limit disk usage.</p>
<h2 id="stockage-retention--where-the-data-is">Where the data is</h2>
<table>
<thead>
<tr>
<th>Data</th>
<th>Location</th>
</tr>
</thead>
<tbody>
<tr>
<td>Agents, tokens, commands, inventory and changes, alerts, incidents, assets, audit, integrations (encrypted secrets), settings</td>
<td><strong>PostgreSQL 16</strong></td>
</tr>
<tr>
<td>Events</td>
<td>PostgreSQL in <strong>light mode</strong>, or <strong>OpenSearch</strong> (compressed daily indexes) in full mode</td>
</tr>
<tr>
<td>Ingestion queue</td>
<td>Redis Streams (AOF persistence)</td>
</tr>
<tr>
<td>Certificates and keys</td>
<td><code>data/tls/</code></td>
</tr>
<tr>
<td>Runtime secrets</td>
<td><code>.env</code> (access 600)</td>
</tr>
</tbody>
</table>
<h2 id="stockage-retention--light-or-full-mode">Light or full mode</h2>
<p>Below 6 GB of RAM, the installer chooses <strong>light mode</strong>: no OpenSearch, events stay in PostgreSQL. For a sustained volume or searches over long periods, use full mode. To force light mode: <code>--light</code>.</p>
<h2 id="stockage-retention--configurable-retention">Configurable retention</h2>
<p>In <strong>Log Management › Retention</strong> (or <code>GET/PUT /api/v1/system/retention</code>):</p>
<ul>
<li>retention period for <strong>events</strong>;</li>
<li>retention period for the <strong>inventory history</strong> and the <strong>audit log</strong>;</li>
<li><strong>storage cap</strong>: beyond it, the oldest data is deleted.</li>
</ul>
<p>Cleanup jobs run every 30 minutes. <strong>Alerts and incidents are kept.</strong></p>
<p>Default value for events: 48 hours (<code>EVENT_RETENTION_HOURS</code>).</p>
<aside class="callout c-astuce">
<p><strong>Tip</strong> Reduce the period if the disk fills up. In the measurement made during testing, 6,000 events aged 5 days were deleted and the 12,000 recent ones kept.</p>
</aside>
<h2 id="stockage-retention--service-log-rotation">Service log rotation</h2>
<p>All Docker services use log rotation (bounded size and number of files), so that the platform's own logs do not fill the disk. Agents rotate their own log (10 MB × 5).</p>
<h2 id="stockage-retention--what-the-backup-contains">What the backup contains</h2>
<p>The PostgreSQL database, <code>.env</code>, certificates and configuration. OpenSearch events are not included: their retention is short by design. See <a href="#docs-sauvegarde-mise-a-jour">Backup and update</a>.</p><div class="pn"><a href="#docs-ia"><small>Previous</small>Anomaly detection (AI)</a><a class="next" href="#docs-manuel-navigation"><small>Next</small>Navigate the console</a></div></article><article class="doc" id="doc-manuel-navigation" data-slug="manuel-navigation" data-title="Navigate the console" hidden><div class="crumb">Dashboard manual</div><h1>Navigate the console</h1><p style="margin-top:0">The icon rail, the tabs, the real/simulated selector, the theme and access rights.</p>

</aside><div class="pn"><a href="#docs-stockage-retention"><small>Previous</small>Storage and retention</a><a class="next" href="#docs-manuel-overview"><small>Next</small>Overview (dashboard)</a></div></article><article class="doc" id="doc-manuel-overview" data-slug="manuel-overview" data-title="Overview (dashboard)" hidden><div class="crumb">Dashboard manual</div><h1>Overview (dashboard)</h1><p style="margin-top:0">Every card of the console home page: what it measures, how to read it, what to do next.</p>
<p>The home page answers one question: <strong>"is there anything to handle right now?"</strong>. It refreshes itself every 10 seconds; the line under the title shows the time of the last update.</p>
<h2 id="manuel-overview--the-header">The header</h2>
<p><strong><code>Security Operations Center</code></strong>: the title, with the world displayed ("Your infrastructure" or "Simulated environment").</p>
<p><strong>The severity badges</strong> (on the right) count alerts by severity: <code>All alerts N</code>, <code>Critical</code>, <code>High</code>, <code>Medium</code>, <code>Low</code>. Each one is a link: a click opens <code>Alerts</code> already filtered.</p>
<h2 id="manuel-overview--first-row-four-cards">First row: four cards</h2>
<table>
<thead>
<tr>
<th>Card</th>
<th>What it shows</th>
<th>How to read it</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong><code>Alerts, 24 h</code></strong></td>
<td>The number of alerts in the last 24 hours and their hour-by-hour curve</td>
<td>A recent spike deserves a look. Hover over a point to see the time and the count</td>
</tr>
<tr>
<td><strong><code>Activity by hour</code></strong></td>
<td>The number of stored events, and a grid of 24 cells: one per hour, the oldest first</td>
<td>Gray cell: no alerts. The redder the cell, the more alerts that hour produced</td>
</tr>
<tr>
<td><strong><code>Platform health</code></strong></td>
<td>PostgreSQL, Redis, OpenSearch</td>
<td><strong>Tall green</strong> bar: the service responds. <strong>Short red</strong> bar: it is down. <strong>Gray</strong> bar: disabled (normal in light mode for OpenSearch). The title changes from <code>All up</code> to <code>Degraded</code></td>
</tr>
<tr>
<td><strong><code>Recent incidents</code></strong></td>
<td>The last five incidents, with their reference, age and severity</td>
<td>Click to open the incident. <code>View all</code> opens the full list</td>
</tr>
</tbody>
</table>
<h2 id="manuel-overview--second-row">Second row</h2>
<p><strong><code>Global risk</code></strong>: the score from 0 to 100 for your whole infrastructure, with its level (<code>LOW</code>, <code>MEDIUM</code>, <code>HIGH</code>, <code>CRITICAL</code>).</p>
<ul>
<li>The <strong>bar</strong> goes from green to red.</li>
<li>The <strong>gauge</strong> repeats the score.</li>
<li><strong><code>How this score is built</code></strong> lists the contributions, for example "Highest open incident (94/100) +66" and "Average of the 2 riskiest assets (54/100) +16". If nothing is open, the card shows "No open incident or risky asset".</li>
</ul>
<p><strong><code>Alerts, last 24 hours</code></strong> (red and green gradient card): the same curve at a larger size, with the number of critical alerts still open (<code>N critical open</code>).</p>
<h2 id="manuel-overview--modules"><code>Modules</code></h2>
<p>Eight tiles to go directly to: <code>Alerts</code>, <code>Incidents</code>, <code>AI Detection</code>, <code>MITRE ATT&amp;CK</code>, <code>Infrastructure</code>, <code>Agents</code>, <code>Correlation</code>, <code>Log Management</code>.</p>
<h2 id="manuel-overview--last-row">Last row</h2>
<table>
<thead>
<tr>
<th>Element</th>
<th>Content</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong><code>Recent events</code></strong></td>
<td>The latest events: time, severity, type, source → destination, message. <code>All events</code> opens the full list</td>
</tr>
<tr>
<td><strong><code>Top ATT&amp;CK techniques</code></strong></td>
<td>The MITRE techniques most frequent in your alerts. <code>Matrix</code> opens the MITRE page</td>
</tr>
<tr>
<td><strong><code>Top sources (24 h)</code></strong></td>
<td>The IP addresses that emit the most</td>
</tr>
<tr>
<td><strong><code>Top destinations (24 h)</code></strong></td>
<td>The most targeted IP addresses</td>
</tr>
</tbody>
</table>
<h2 id="manuel-overview--when-the-page-is-empty">When the page is empty</h2>
<p>If the message <strong>"No data received yet"</strong> is displayed, no source has sent an event yet. Two options:</p>
<ul>
<li>connect a source: <a href="#docs-agent-installation">install an agent</a> or <a href="#docs-integrations">connect an integration</a>;</li>
<li>watch the product work with the <a href="#docs-simulation">simulation</a>.</li>
</ul>
<h2 id="manuel-overview--two-minute-daily-routine">Two-minute daily routine</h2>
<ol>
<li>Look at <code>Global risk</code> and the <code>Critical</code> badge.</li>
<li>Open the first incident in <code>Recent incidents</code>.</li>
<li>Read its timeline, then handle it: <a href="#docs-alertes-incidents">Alerts and incidents</a>.</li>
<li>Check <code>Platform health</code>: everything should be green.</li>
<li>If a rule is too noisy, tune it: <a href="#docs-detection-correlation">Detection and correlation</a>.</li>
</ol><div class="pn"><a href="#docs-manuel-navigation"><small>Previous</small>Navigate the console</a><a class="next" href="#docs-manuel-soc"><small>Next</small>SOC: alerts, incidents, events</a></div></article><article class="doc" id="doc-manuel-soc" data-slug="manuel-soc" data-title="SOC: alerts, incidents, events" hidden><div class="crumb">Dashboard manual</div><h1>SOC: alerts, incidents, events</h1><p style="margin-top:0">The Alerts, Incidents, Events and Log Management pages, element by element.</p>
<h2 id="manuel-soc--alerts">Alerts</h2>
<p><em>« Detections raised by the rule engine, scored by the Risk Engine. Click a row to see why it scored what it did. »</em></p>
<p><strong>Filters</strong> (above the table): a <strong>severity</strong> list, a <strong>status</strong> list (<code>All statuses</code>) and a <code>Source IP</code> field.</p>
<table>
<thead>
<tr>
<th>Column</th>
<th>Content</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Severity</code></td>
<td>Severity of the rule</td>
</tr>
<tr>
<td><code>Alert</code></td>
<td>Readable name and rule identifier (for example <code>SSH_BRUTE_FORCE</code>)</td>
</tr>
<tr>
<td><code>Source → Destination</code></td>
<td>Addresses and port</td>
</tr>
<tr>
<td><code>Asset</code></td>
<td>The affected asset, if known</td>
</tr>
<tr>
<td><code>Engine</code></td>
<td>The source of the detection (<code>wazuh</code>, <code>mqtt-monitor</code>...)</td>
</tr>
<tr>
<td><code>ATT&amp;CK</code></td>
<td>The MITRE technique</td>
</tr>
<tr>
<td><code>Risk</code></td>
<td>The score from 0 to 100 and its level</td>
</tr>
<tr>
<td><code>Status</code></td>
<td><code>New</code>, <code>Open</code>, <code>Review</code>, <code>Closed</code>, <code>False positive</code></td>
</tr>
<tr>
<td><code>Last seen</code></td>
<td>Last occurrence</td>
</tr>
</tbody>
</table>
<p>Click a row: the detail shows <strong><code>Why this risk score</code></strong>, line by line (severity, confidence, asset criticality, zone, neighboring alerts), the originating events and the recommendations. You can change the <strong>status</strong> there. Closing an alert lowers the asset's risk.</p>
<h2 id="manuel-soc--incidents">Incidents</h2>
<p><em>« Correlated alerts grouped into one investigation, with a risk score and a timeline. »</em></p>
<p>Table: <code>Reference</code> (INC-00001...), <code>Title</code>, <code>Severity</code>, <code>Risk</code>, <code>Alerts</code> (number of linked alerts), <code>Status</code>, <code>Last activity</code>. A <code>Status</code> filter is available.</p>
<h3 id="manuel-soc--the-detail-of-an-incident">The detail of an incident</h3>
<table>
<thead>
<tr>
<th>Block</th>
<th>Content</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong><code>Summary</code></strong></td>
<td>Affected assets, source and destination IPs, detection sources, MITRE techniques</td>
</tr>
<tr>
<td><strong><code>Why this risk score</code></strong></td>
<td>The contributions to the incident's score</td>
</tr>
<tr>
<td>Alert list</td>
<td><code>Alert</code>, <code>Severity</code>, <code>Source → destination</code>, <code>Asset</code>, <code>Risk</code>, <code>ATT&amp;CK</code>, <code>First seen</code></td>
</tr>
<tr>
<td><strong><code>Timeline and analyst notes</code></strong></td>
<td>The timeline (attached alerts, status changes, recognized attack pattern) and your notes</td>
</tr>
</tbody>
</table>
<p>To write a note: the <code>Add an analyst note…</code> field then <code>Add note</code>. To move the investigation forward: the <strong><code>Incident status</code></strong> list (<code>NEW</code>, <code>INVESTIGATING</code>, <code>CONTAINED</code>, <code>RESOLVED</code>, <code>FALSE_POSITIVE</code>).</p>
<h2 id="manuel-soc--events">Events</h2>
<p><em>« Normalized events from every source, newest first. Retention applies (48 hours by default). »</em></p>
<p>Filters: <code>Event type</code> (for example <code>auth_failure</code>), <code>Severity</code>, <code>Source IP</code>.
Columns: <code>Time</code>, <code>Severity</code>, <code>Type</code>, <code>Source</code>, <code>From → to</code>, <code>Proto</code>, <code>Message</code>.</p>
<p>This is the check screen for <strong>integrations</strong>: if your device is sending its logs correctly, its events appear here with their <code>Source</code>.</p>
<h2 id="manuel-soc--log-management">Log Management</h2>
<p><em>« Every collected log, normalized into one format. The original log line is always kept and shown in the detail row. »</em></p>
<ul>
<li><strong>Search</strong>: the <code>Search message or original log</code> field searches in the message <strong>and</strong> in the original log.</li>
<li><strong>Filters</strong>: <code>Host</code>, <code>User</code>, <code>Severity</code>, <code>Source type</code> (for example <code>linux.auth</code>, <code>windows.eventlog</code>, <code>pfsense.filterlog</code>).</li>
<li><strong>Columns</strong>: <code>Time</code>, <code>Severity</code>, <code>Type</code>, <code>Source</code>, <code>Host</code>, <code>User</code>, <code>Message</code>.</li>
<li><strong>Expanded row</strong>: the intact raw log and the normalized fields.</li>
<li><strong><code>Retention and storage</code> card</strong> (administrators): the retention period for events, inventory history and the audit log, and the storage cap. <code>Save</code> button. See <a href="#docs-stockage-retention">Storage and retention</a>.</li>
</ul><div class="pn"><a href="#docs-manuel-overview"><small>Previous</small>Overview (dashboard)</a><a class="next" href="#docs-manuel-parc"><small>Next</small>Fleet: assets, infrastructure, agents</a></div></article><article class="doc" id="doc-manuel-parc" data-slug="manuel-parc" data-title="Fleet: assets, infrastructure, agents" hidden><div class="crumb">Dashboard manual</div><h1>Fleet: assets, infrastructure, agents</h1><p style="margin-top:0">The Assets, Infrastructure and Agents pages: declare, monitor and deploy.</p>
<h2 id="manuel-parc--assets">Assets</h2>
<p>The list of <strong>known</strong> machines and devices: it is what gives alerts their <strong>criticality</strong> and <strong>zone</strong>.</p>
<p><strong>Search</strong>: <code>Search hostname or IP</code>. <strong>Filters</strong>: <code>Type</code>, <code>Zone</code>, <code>Criticality</code>.
<strong>Columns</strong>: <code>Hostname</code>, <code>IP</code>, <code>OS</code>, <code>Type</code>, <code>Zone</code> (IT, OT, DMZ), <code>Criticality</code>, <code>Risk</code>, <code>Status</code>, <code>Last seen</code>.</p>
<h3 id="manuel-parc--add-an-asset">Add an asset</h3>
<p><code>Add asset</code> button (authorized role), <code>New asset</code> card:</p>
<table>
<thead>
<tr>
<th>Field</th>
<th>Content</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Hostname</code></td>
<td>Name of the machine</td>
</tr>
<tr>
<td><code>IP address</code></td>
<td>Address: it is what links events to the asset</td>
</tr>
<tr>
<td><code>MAC address</code></td>
<td>Optional (<code>AA:BB:CC:DD:EE:FF</code>)</td>
</tr>
<tr>
<td><code>Operating system</code></td>
<td>Optional</td>
</tr>
<tr>
<td><code>Type</code></td>
<td>Server, workstation, firewall, controller...</td>
</tr>
<tr>
<td><code>Zone</code></td>
<td>IT, OT or DMZ</td>
</tr>
<tr>
<td><code>Criticality</code></td>
<td>Importance of the asset; it weighs on the score of each alert</td>
</tr>
</tbody>
</table>
<p><code>Create asset</code> saves. Declare your firewalls, controllers and network devices by hand; machines with an agent are created automatically.</p>
<h2 id="manuel-parc--infrastructure">Infrastructure</h2>
<p>The fleet <strong>as seen by the agents</strong>.</p>
<ul>
<li><strong>Search</strong> <code>Host or IP</code>, <code>Status</code> filter.</li>
<li><strong><code>Machines</code></strong>: <code>Host</code>, <code>System</code>, <code>CPU</code>, <code>Memory</code>, <code>Disk</code>, <code>Open ports</code>, <code>Software</code>, <code>Status</code>, <code>Last seen</code>.</li>
<li><strong><code>By operating system</code></strong>: the breakdown of the fleet.</li>
<li><strong><code>Recent changes</code></strong>: what changed recently (software installed, port opened, service modified, account added).</li>
</ul>
<p>Click a machine: its software, services, listening ports, accounts, pending updates, and the history of its changes. See <a href="#docs-inventaire">Inventory and history</a>.</p>
<h2 id="manuel-parc--agents">Agents</h2>
<p><em>Deployment and status of the agent fleet.</em></p>
<h3 id="manuel-parc--agents-deployment-generate-the-install-command"><code>Agents Deployment</code>: generate the install command</h3>
<ol>
<li>Fill in the card: <strong><code>Label</code></strong> (for example "web servers"), <strong><code>Zone</code></strong>, <strong><code>Criticality</code></strong>, <strong><code>Machines</code></strong> (the maximum number of machines that can use this token).</li>
<li>Click <strong><code>Generate token</code></strong>.</li>
<li>The install command is displayed <strong>only once</strong> (Linux and Windows), with the address of <strong>your</strong> server and the fingerprint of its certificate. Copy it and run it on the machine.</li>
</ol>
<h3 id="manuel-parc--enrollment-tokens"><code>Enrollment tokens</code></h3>
<p><code>Token</code>, <code>Label</code>, <code>Uses</code>, <code>Expires</code>, <code>Status</code>, and <code>Revoke</code> to cancel a token before it expires.</p>
<h3 id="manuel-parc--installed-agents"><code>Installed agents</code></h3>
<p><code>Host</code>, <code>System</code>, <code>Version</code>, <code>Status</code>, <code>Last seen</code>, <code>Events</code>, <code>Buffer</code> (events waiting to be sent), and the actions:</p>
<table>
<thead>
<tr>
<th>Action</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Restart</code></td>
<td>Restarts the agent</td>
</tr>
<tr>
<td><code>Inventory</code></td>
<td>Forces an immediate inventory</td>
</tr>
<tr>
<td><code>Update</code></td>
<td>Updates the agent (signed binary)</td>
</tr>
<tr>
<td><code>Revoke</code></td>
<td>Cuts the agent's key: it can no longer send anything</td>
</tr>
</tbody>
</table>
<p>See <a href="#docs-agent-installation">Install an agent</a> and <a href="#docs-agent-gestion">Manage agents</a>.</p><div class="pn"><a href="#docs-manuel-soc"><small>Previous</small>SOC: alerts, incidents, events</a><a class="next" href="#docs-manuel-analyse"><small>Next</small>Analysis: correlation, AI, MITRE, health</a></div></article><article class="doc" id="doc-manuel-analyse" data-slug="manuel-analyse" data-title="Analysis: correlation, AI, MITRE, health" hidden><div class="crumb">Dashboard manual</div><h1>Analysis: correlation, AI, MITRE, health</h1><p style="margin-top:0">The Correlation, AI Detection, MITRE ATT&amp;CK and System Health pages.</p>
<h2 id="manuel-analyse--correlation">Correlation</h2>
<ul>
<li><strong><code>Detection rules</code></strong>: all rules currently in force. Columns: <code>Rule</code>, <code>Type</code> (match, threshold, distinct_count, sequence), <code>Severity</code>, <code>Window</code>, <code>Grouped by</code>, <code>MITRE</code>, <code>Fired 24 h</code> (triggers over the last 24 hours), <code>Last</code>.</li>
<li><strong><code>Custom rules</code></strong>: a text field where you paste your YAML rules, and the <strong><code>Check rules</code></strong> button, which checks the syntax <strong>without applying anything</strong>. To activate them, see <a href="#docs-detection-correlation">Detection and correlation</a>.</li>
</ul>
<p>A rule that fires often (<code>Fired 24 h</code>) without being useful should be tuned up or lightened.</p>
<h2 id="manuel-analyse--ai-detection">AI Detection</h2>
<p>The AI learns the normal behavior of each machine and flags deviations. See <a href="#docs-ia">AI</a>.</p>
<table>
<thead>
<tr>
<th>Item</th>
<th>Content</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Train model</code></td>
<td>Trains the model (administrators)</td>
</tr>
<tr>
<td><code>Analyse now</code></td>
<td>Starts an immediate analysis (administrators)</td>
</tr>
<tr>
<td><strong><code>What it learned</code></strong></td>
<td>The active model and, per machine, what is "normal" for it</td>
</tr>
<tr>
<td><strong><code>Score of each analysed window</code></strong></td>
<td>The score of each 5-minute window; those above the threshold are anomalies</td>
</tr>
<tr>
<td><strong><code>Detected anomalies</code></strong></td>
<td>The anomalies, with the <strong>explanation</strong> of what changed and the <code>See the alert it raised</code> link</td>
</tr>
</tbody>
</table>
<p>As long as the <code>No model has been trained yet</code> message is displayed, wait: training starts on its own after 24 hours of real data (or use the <a href="#docs-simulation">simulation</a>).</p>
<h2 id="manuel-analyse--mitre-att-ck">MITRE ATT&amp;CK</h2>
<p>The coverage of your detections.</p>
<ul>
<li><strong><code>Coverage</code></strong>: the share of techniques covered by your rules.</li>
<li>Table: <code>Tactic</code>, <code>Technique</code>, <code>ID</code>, <code>Covered by rules</code>, <code>Observed</code>, <code>Detections</code>, <code>Incidents</code>.</li>
<li>The <strong>gaps</strong> (techniques not covered) are the useful information: they show where to write new rules.</li>
</ul>
<h2 id="manuel-analyse--system-health">System Health</h2>
<p>The health of the platform itself.</p>
<table>
<thead>
<tr>
<th>Block</th>
<th>Content</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong><code>Server</code></strong></td>
<td>CPU, memory, disk, uptime (<code>Uptime</code>)</td>
</tr>
<tr>
<td><strong><code>Components</code></strong></td>
<td><code>Service</code>, <code>State</code>, <code>Latency</code>, <code>Detail</code>: PostgreSQL, Redis, OpenSearch</td>
</tr>
<tr>
<td><strong><code>Processing</code></strong></td>
<td><code>Events/s</code>, <code>Latency p50 / p95</code>, <code>Processed</code>, ingestion queue size</td>
</tr>
<tr>
<td><strong><code>Data sources</code></strong></td>
<td><code>Source</code>, <code>Seen</code>, <code>Events</code>, <code>Last event</code>: who is sending, and since when</td>
</tr>
</tbody>
</table>
<aside class="callout c-astuce">
<p><strong>Tip</strong> <code>Data sources</code> is the first screen to open when an integration seems to send nothing.</p>
</aside><div class="pn"><a href="#docs-manuel-parc"><small>Previous</small>Fleet: assets, infrastructure, agents</a><a class="next" href="#docs-manuel-administration"><small>Next</small>Administration: users, roles, rules</a></div></article><article class="doc" id="doc-manuel-administration" data-slug="manuel-administration" data-title="Administration: users, roles, rules" hidden><div class="crumb">Dashboard manual</div><h1>Administration: users, roles, rules</h1><p style="margin-top:0">The pages reserved for administrators: Users, Roles, Rules, Integrations, Demo.</p>
<p>These pages only appear for the <strong>ADMIN</strong> role.</p>
<h2 id="manuel-administration--users">Users</h2>
<p><em>« Create accounts, assign a role, disable access or reset a password. »</em></p>
<p>Table: <code>Username</code>, <code>Name</code>, <code>E-mail</code>, <code>Role</code>, <code>Status</code>, <code>Last sign-in</code>. <code>Add user</code> button: username (3 to 64 characters: lowercase letters, digits, <code>.</code>, <code>_</code>, <code>-</code>), e-mail, name, role, password (12 characters minimum). On a row: change the role, disable, reset the password. The <strong>last active administrator</strong> cannot be disabled.</p>
<h2 id="manuel-administration--roles">Roles</h2>
<p>Table: <code>Role</code>, <code>Description</code>, <code>Permissions</code>, <code>Users</code>. <code>New role</code> button: a name (for example <code>AUDITOR</code>), a description and permissions among <code>READ</code>, <code>WRITE</code>, <code>INVESTIGATE</code>, <code>RESPOND</code>, <code>ADMIN</code>. The four built-in roles are read-only; a role that is still assigned cannot be deleted (<code>Delete</code>).</p>
<h2 id="manuel-administration--rules">Rules</h2>
<p><em>« Loaded from configs/rules/</em>.yaml when the service starts. »* Read-only list: <code>Rule</code>, <code>Type</code>, <code>Severity</code>, <code>Condition</code>, <code>ATT&amp;CK</code>, <code>Enabled</code>. To modify rules, see <a href="#docs-detection-correlation">Detection and correlation</a>.</p>
<h2 id="manuel-administration--integrations">Integrations</h2>
<p>The status of the <strong>sources</strong> that feed Controlix: <code>Source</code>, <code>Status</code>, <code>Location</code>, <code>Events</code>, <code>Errors</code>, <code>Dropped</code>, <code>Last event</code>. Read-only page, refreshed every 5 seconds. A source is active as long as events keep arriving.</p>
<h2 id="manuel-administration--security-solutions">Security Solutions</h2>
<p>The page where you <strong>add, test and manage</strong> Wazuh, Suricata, Snort, pfSense, FortiGate, Syslog and JSON sources. This is the core of connecting your tools: see the <a href="#docs-integrations">Integrations</a> group.</p>
<h2 id="manuel-administration--demo">Demo</h2>
<p>The <strong>simulation</strong> page: see <a href="#docs-simulation">Simulation and demo mode</a>.</p><div class="pn"><a href="#docs-manuel-analyse"><small>Previous</small>Analysis: correlation, AI, MITRE, health</a><a class="next" href="#docs-integrations"><small>Next</small>Connect your tools (overview)</a></div></article><article class="doc" id="doc-integrations" data-slug="integrations" data-title="Connect your tools (overview)" hidden><div class="crumb">Integrations</div><h1>Connect your tools (overview)</h1><p style="margin-top:0">The principle, the Security Solutions page field by field, the statuses, verification and security rules.</p>
<p>Controlix <strong>requires no external tool</strong>: its agents are enough. If you already have sensors or firewalls, you connect them as <strong>event sources</strong>: Controlix reads their output, normalizes it, correlates it with the agents' events and computes the risk.</p>
<aside class="callout c-note">
<p><strong>Note</strong> Third-party tools only provide <strong>events</strong>. <strong>No command is sent</strong> to your equipment and no port is opened on it. Alerts from several sources (agent, firewall, IDS) end up in the same incident.</p>
</aside>

<td>A Linux server, a router, a switch</td>
<td><a href="#docs-int-syslog">Syslog and network devices</a></td>
<td>Syslog</td>
</tr>
<tr>
<td>An application with a JSON API</td>
<td><a href="#docs-int-custom">Custom JSON source</a></td>
<td>HTTP or file</td>
</tr>
<tr>
<td>A Windows server</td>
<td><a href="#docs-agent-installation">Agent</a></td>
<td>The agent reads the event logs</td>
</tr>
</tbody>
</table>
<p>Two families of connection:</p>
<ul>
<li><strong>Pull</strong>: Controlix <strong>fetches</strong> the events (Wazuh, Suricata, JSON). You give it an address, a port, credentials.</li>
<li><strong>Push</strong>: the device <strong>sends</strong> its logs to Controlix over Syslog (pfSense, FortiGate, Snort, routers…). You configure the device, then you declare its address in Controlix.</li>
</ul>
<h2 id="integrations--the-security-solutions-page">The Security Solutions page</h2>
<p><strong>Administration › Security Solutions</strong> menu (administrators).</p>
<h3 id="integrations--add-a-solution">Add a solution</h3>

<h3 id="integrations--the-tls-fields-for-https-connections">The TLS fields (for <code>https</code> connections)</h3>
<table>

<tr>
<th>Field</th>
<th>Use</th>
</tr>

<pre><code class="language-bash">openssl s_client -connect wazuh.mon-entreprise.local:9200 &lt;/dev/null 2&gt;/dev/null \
  | openssl x509 -noout -fingerprint -sha256
</code></pre>

<h2 id="integrations--five-step-method">Five-step method</h2>
<ol>
<li><strong>Prepare the device</strong> (the solution's page): read-only account, or Syslog forwarding to the address of your Controlix server.</li>
<li><strong>Add the solution</strong>: <code>Add a solution</code>, fill in the form.</li>
<li><strong><code>Test connection</code></strong>: fix issues until the message is positive.</li>
<li><strong><code>Save</code></strong> then <strong><code>Connect</code></strong>.</li>
<li><strong>Check</strong> that events are arriving (see below).</li>
</ol>
<h2 id="integrations--check-that-it-works">Check that it works</h2>
<table>
<thead>
<tr>
<th>Where</th>
<th>What you should see</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Security Solutions</strong></td>
<td>Status <code>connected</code>, a recent <code>Last communication</code>, an <code>Events</code> count that increases</td>
</tr>
<tr>
<td><strong>Events</strong> (<code>Source IP</code> filter)</td>
<td>Events carrying the right source</td>
</tr>
<tr>
<td><strong>Log Management</strong> (<code>Source type</code> filter)</td>
<td>For example <code>pfsense.filterlog</code>, with the original log</td>
</tr>
<tr>
<td><strong>System Health › Data sources</strong></td>
<td>The source appears with a recent <code>Last event</code></td>
</tr>
<tr>
<td><strong>Alerts</strong></td>
<td>The detections produced from these events</td>
</tr>
</tbody>
</table>
<h2 id="integrations--syslog-reception">Syslog: reception</h2>
<p>The installer opens Syslog reception on <strong>UDP and TCP 514</strong>. Only the networks in <code>SYSLOG_ALLOWED_NETS</code> (private networks by default) and the addresses of declared devices are accepted. See <a href="#docs-configuration">Configuration variables</a>.</p>
<aside class="callout c-attention">
<p><strong>Warning</strong> Syslog has no authentication or encryption here: restrict port 514 with the server's firewall to the addresses of your devices. Behind a relay or a NAT, the address seen is that of the <strong>relay</strong>: declare that one.</p>
</aside>
<h2 id="integrations--connection-security">Connection security</h2>
<ul>
<li>TLS verified by default; redirects not followed.</li>
<li><strong>SSRF guard</strong>: loopback, link-local, multicast and Controlix's internal network are refused as a target.</li>
<li>Credentials are <strong>encrypted</strong> (Fernet), never returned by the API nor written to the logs.</li>
<li>Managing integrations is <strong>restricted to administrators</strong>.</li>
</ul>
<aside class="callout c-note">
<p><strong>Note</strong> Severity and field mappings follow the formats documented by each vendor. Wazuh, FortiGate, pfSense and Snort could not be tested on real products: validate on your own alerts and report any discrepancy.</p>
</aside><div class="pn"><a href="#docs-manuel-administration"><small>Previous</small>Administration: users, roles, rules</a><a class="next" href="#docs-int-wazuh"><small>Next</small>Wazuh</a></div></article><article class="doc" id="doc-int-wazuh" data-slug="int-wazuh" data-title="Wazuh" hidden><div class="crumb">Integrations</div><h1>Wazuh</h1><p style="margin-top:0">Read alerts from the Indexer, agent status from the Manager, or the alerts.json file.</p>
<p>Wazuh detects; Controlix <strong>normalizes and correlates</strong> its alerts with everything else. Three possible connections, which can be combined:</p>
<table>
<thead>
<tr>
<th>Connection</th>
<th>Used for</th>
<th>Default port</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Wazuh Indexer API (alerts)</strong></td>
<td>Reading alerts in the <code>wazuh-alerts-*</code> index</td>
<td>9200</td>
</tr>
<tr>
<td><strong>Wazuh Manager API (version, agents)</strong></td>
<td>Reporting the Wazuh version and the status of Wazuh agents</td>
<td>55000</td>
</tr>
<tr>
<td><strong>alerts.json file</strong></td>
<td>Reading the alerts file directly</td>
<td>—</td>
</tr>
</tbody>
</table>
<h2 id="int-wazuh--1-prepare-wazuh">1. Prepare Wazuh</h2>
<p>Create a <strong>read-only</strong> account:</p>
<ul>
<li><strong>Indexer</strong>: a user allowed to read <code>wazuh-alerts-*</code> (no write permission).</li>
<li><strong>Manager API</strong>: an API user with a read role.</li>
</ul>
<p>Check that the Controlix server can reach the relevant port (firewall):</p>
<pre><code class="language-bash">curl -k -u utilisateur:motdepasse https://IP_WAZUH:9200/_cat/indices/wazuh-alerts-*
</code></pre>
<h2 id="int-wazuh--2-add-it-in-controlix">2. Add it in Controlix</h2>
<p><strong>Administration › Security Solutions › Add a solution</strong>:</p>
<h3 id="int-wazuh--indexer-alerts">Indexer (alerts)</h3>
<table>
<thead>
<tr>
<th>Field</th>
<th>Value</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Solution</code></td>
<td>Wazuh</td>
</tr>
<tr>
<td><code>Connection</code></td>
<td>Wazuh Indexer API (alerts)</td>
</tr>
<tr>
<td><code>Name</code></td>
<td>Wazuh production</td>
</tr>
<tr>
<td><code>Host or IP address</code> / <code>Port</code></td>
<td>Indexer address / <code>9200</code></td>
</tr>
<tr>
<td><code>Protocol</code></td>
<td><code>https</code></td>
</tr>
<tr>
<td><code>Indexer user</code>, <code>Password</code></td>
<td>The read-only account</td>
</tr>
<tr>
<td><code>Index pattern</code></td>
<td><code>wazuh-alerts-*</code></td>
</tr>
<tr>
<td><code>Start from</code></td>
<td><code>now</code> (new alerts only) or <code>beginning</code> (full history)</td>
</tr>
<tr>

</tr>
<tr>

</tbody>

<h3 id="int-wazuh--manager-api-agent-status">Manager API (agent status)</h3>
<p><code>Connection</code>: Wazuh Manager API, port <code>55000</code>, protocol <code>https</code>, <code>API user</code> and <code>Password</code>, <code>Poll interval (s)</code> <code>60</code>.</p>
<h3 id="int-wazuh--alerts-json-file"><code>alerts.json</code> file</h3>
<p>For a Wazuh installed on the <strong>same server</strong> as Controlix:</p>
<ol>
<li>In <code>/opt/controlix/.env</code>, specify the folder that contains the file:
   <code>bash
   WAZUH_LOG_DIR=/var/ossec/logs/alerts</code></li>
<li>If Wazuh protects the file, give the collector the right <code>uid:gid</code> (<code>COLLECTOR_USER=999:999</code> for example).</li>
<li><code>cd /opt/controlix &amp;&amp; sudo docker compose up -d</code>.</li>
<li>In Controlix: <code>Connection</code> = alerts.json file, <code>Path of alerts.json</code> = <code>/data/wazuh/alerts.json</code>.</li>
</ol>
<h2 id="int-wazuh--3-test-save-connect">3. Test, save, connect</h2>
<p><code>Test connection</code> → <code>Save</code> → <code>Connect</code>. The status should change to <code>connected</code>.</p>
<h2 id="int-wazuh--4-verify">4. Verify</h2>
<ul>
<li><strong>Events</strong>: events whose source is Wazuh.</li>
<li>Severity follows the Wazuh level: level ≥ 13 <code>critical</code>, ≥ 10 <code>high</code>, ≥ 7 <code>medium</code>, ≥ 4 <code>low</code>.</li>
<li><strong>System Health › Data sources</strong>: the source appears.</li>
</ul>
