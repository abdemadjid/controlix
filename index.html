<h2 id="agent-configuration--sources-lues-sur-linux">Sources lues sur Linux</h2>
<p><code>auth.log</code> ou <code>secure</code>, <code>syslog</code>, <code>messages</code>, <code>kern.log</code>, journald si les fichiers manquent, les journaux applicatifs déclarés dans <code>extra_logs</code>, plus l'intégrité de fichiers sensibles (empreintes), les nouveaux processus suspects, les nouveaux ports en écoute et les changements du pare-feu.</p><div class="pn"><a href="#docs-agent-installation"><small>Précédent</small>Installer un agent</a><a class="next" href="#docs-agent-gestion"><small>Suivant</small>Piloter les agents</a></div></article><article class="doc" id="doc-agent-gestion" data-slug="agent-gestion" data-title="Piloter les agents" hidden><div class="crumb">Agents</div><h1>Piloter les agents</h1><p style="margin-top:0">Actions disponibles, révocation, mises à jour signées, ce que l&#x27;agent refuse de faire.</p>
<h2 id="agent-gestion--le-parc-d-agents">Le parc d'agents</h2>
<p><strong>Agents</strong> liste chaque machine avec son état (<code>online</code> / <code>offline</code>), sa version, sa dernière activité, le remplissage du tampon et les erreurs récentes. Un agent est signalé hors ligne quand ses battements s'arrêtent ; la règle <code>AGENT_OFFLINE</code> peut alors lever une alerte.</p>
<h2 id="agent-gestion--actions">Actions</h2>
<table>
<thead>
<tr>
<th>Bouton</th>
<th>Effet</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Restart</strong></td>
<td>Redémarre le service de l'agent</td>
</tr>
<tr>
<td><strong>Inventory</strong></td>
<td>Demande un inventaire complet immédiat</td>
</tr>
<tr>
<td><strong>Update</strong></td>
<td>Met à jour l'agent si une version plus récente est publiée</td>
</tr>
<tr>
<td><strong>Revoke</strong></td>
<td>Coupe l'agent immédiatement</td>
</tr>
</tbody>
</table>
<aside class="callout c-attention">
<p><strong>Attention</strong> Ces trois actions (<code>restart</code>, <code>collect_inventory</code>, <code>update</code>) sont les <strong>seules</strong> que l'agent accepte. Le serveur refuse tout autre type de commande (422) et l'agent l'ignorerait de toute façon. <strong>Aucun shell à distance n'existe</strong>, par conception.</p>
</aside>
<h2 id="agent-gestion--revocation">Révocation</h2>
<p><strong>Revoke</strong> invalide la clé de l'agent : ses requêtes reçoivent 401, il cesse d'émettre, garde son tampon 24 h, puis le purge. À utiliser pour une machine compromise, perdue ou retirée du parc.</p>
<h2 id="agent-gestion--mises-a-jour-signees">Mises à jour signées</h2>
<p>Le serveur publie un <strong>manifeste signé Ed25519</strong> (<code>/agent/v1/manifest</code>). L'agent :</p>
<ol>
<li>vérifie la signature avec la clé publique reçue à l'enrôlement ;</li>
<li>vérifie le SHA-256 et la taille du binaire ;</li>
<li>remplace son exécutable de façon atomique, puis redémarre.</li>
</ol>
<p>En cas d'échec, il garde l'ancienne version. Sous Windows, l'ancien exécutable est renommé en <code>.old</code> puis supprimé au démarrage suivant.</p>
<p>Les nouveaux agents arrivent avec chaque version de Controlix, déjà compilés pour Linux (amd64, arm64) et Windows (amd64). Pour les publier sur votre serveur :</p>
<pre><code class="language-bash">curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo sh -s -- update
</code></pre>
<p>Puis, dans <strong>Agents</strong>, le bouton <strong>Update</strong> (un poste ou tous).</p>
<p>Le protocole est rétro-compatible au sein d'une version majeure (<code>/agent/v1</code>).</p>
<h2 id="agent-gestion--jetons-d-enrolement">Jetons d'enrôlement</h2>
<p>Dans <strong>Agents Deployment</strong>, la liste des jetons actifs montre leur préfixe, leur auteur, leur échéance et leur nombre d'utilisations. Un jeton peut être supprimé à tout moment : les agents déjà enrôlés ne sont pas affectés.</p><div class="pn"><a href="#docs-agent-configuration"><small>Précédent</small>Configurer les agents</a><a class="next" href="#docs-agent-fiabilite"><small>Suivant</small>Fiabilité de l&#x27;agent</a></div></article><article class="doc" id="doc-agent-fiabilite" data-slug="agent-fiabilite" data-title="Fiabilité de l&#x27;agent" hidden><div class="crumb">Agents</div><h1>Fiabilité de l&#x27;agent</h1><p style="margin-top:0">Tampon disque, livraison sans doublon, contre-pression, reprise après arrêt brutal.</p>
<p>L'agent est conçu pour <strong>ne pas perdre d'événements de sécurité</strong> et ne pas gêner la machine qui l'héberge.</p>
<h2 id="agent-fiabilite--tampon-disque-borne">Tampon disque borné</h2>
<p>Quand le serveur est injoignable, l'agent écrit dans un <strong>tampon sur disque</strong> (256 Mo par défaut, réglable par <code>buffer_max_mb</code>). Deux files séparent les priorités :</p>
<ul>
<li>les événements de <strong>sécurité</strong> (authentifications, effacement de journaux, changements de configuration) ;</li>
<li>les événements <strong>non sécuritaires</strong> (bruit applicatif, inventaire).</li>
</ul>
<p>Si le plafond est atteint, les événements non sécuritaires <strong>les plus anciens</strong> partent en premier. Chaque perte est <strong>comptée et remontée</strong> au serveur : vous voyez dans le tableau de bord combien d'événements ont été abandonnés.</p>
<h2 id="agent-fiabilite--livraison-au-moins-une-fois-sans-doublon">Livraison au moins une fois, sans doublon</h2>
<p>Chaque événement porte un triplet <code>(agent, epoch, seq)</code>. Le serveur dédoublonne : après une coupure réseau ou un redémarrage, un événement renvoyé n'apparaît <strong>qu'une seule fois</strong>.</p>
<h2 id="agent-fiabilite--contre-pression">Contre-pression</h2>
<p>Si le serveur est saturé, il répond <strong>429</strong> ou <strong>503</strong> avec un en-tête <code>Retry-After</code>. L'agent attend et garde son tampon : le serveur ralentit les agents plutôt que de perdre des données.</p>
<h2 id="agent-fiabilite--arret-brutal-de-l-agent">Arrêt brutal de l'agent</h2>
<p>Les décalages de lecture des fichiers sont persistés. Après un <code>kill -9</code> ou une coupure de courant, l'agent reprend où il s'était arrêté ; au plus environ 0,5 s de lignes peuvent être rejouées, puis dédoublonnées par le serveur.</p>
<h2 id="agent-fiabilite--limites-de-ressources">Limites de ressources</h2>
<table>
<thead>
<tr>
<th>Limite</th>
<th>Valeur</th>
</tr>
</thead>
<tbody>
<tr>
<td>CPU (Linux)</td>
<td><code>CPUQuota=30%</code></td>
</tr>
<tr>
<td>Mémoire (Linux)</td>
<td><code>MemoryMax</code> du service systemd</td>
</tr>
<tr>
<td>Taille du binaire</td>
<td>environ 6,5 Mo, statique, sans runtime</td>
</tr>
<tr>
<td>Dépendances externes</td>
<td>une seule (<code>golang.org/x/sys</code>)</td>
</tr>
</tbody>
</table>
<h2 id="agent-fiabilite--ce-qui-a-ete-verifie">Ce qui a été vérifié</h2>
<p>Les tests automatisés de l'agent couvrent le plafond et l'éviction du tampon, la reprise après crash, le suivi de fichiers (rotation, troncature, lignes partielles), le TLS épinglé (refus d'une autre CA), la contre-pression 429, la révocation 401, les commandes hors liste, la configuration bornée et les mises à jour signées, y compris avec le détecteur de courses (<code>-race</code>).</p>
<p>Un test de bout en bout avec le vrai binaire a installé l'agent avec la commande du tableau de bord, coupé le serveur pendant l'envoi (200 événements mis en tampon puis livrés une seule fois) et tué l'agent brutalement (50 événements collectés, aucun doublon).</p><div class="pn"><a href="#docs-agent-gestion"><small>Précédent</small>Piloter les agents</a><a class="next" href="#docs-collecte-normalisation"><small>Suivant</small>Architecture, collecte et normalisation</a></div></article><article class="doc" id="doc-collecte-normalisation" data-slug="collecte-normalisation" data-title="Architecture, collecte et normalisation" hidden><div class="crumb">Plateforme</div><h1>Architecture, collecte et normalisation</h1><p style="margin-top:0">Les moteurs, le flux d&#x27;un événement, le schéma commun et les analyseurs.</p>
<p>Controlix est composé de <strong>moteurs</strong> qui tournent sur un seul serveur. Wazuh, Suricata, Snort, pfSense et FortiGate sont des sources optionnelles.</p>
<pre><code class="language-text"> Agents Linux/Windows ──HTTPS/443──┐
 Pare-feu/IDS (syslog 514) ─────────┤      ┌────────── SERVEUR CONTROLIX (1 machine) ──────────┐
 Wazuh / Suricata / custom (pull) ──┘ ───► │ nginx(TLS) → API ──► Redis Streams ──► Worker      │
                                          │ Collecteur (syslog, fichiers, connecteurs)         │
                                          │ Worker : normalisation → détection → corrélation   │
                                          │          → incidents → stockage                    │
                                          │ PostgreSQL (état, inventaire, alertes)  OpenSearch*│
                                          │ IA (anomalies)   Interface web                     │
                                          └────────────────────────────────────────────────────┘
                                                                                  * optionnel
</code></pre>
<h2 id="collecte-normalisation--les-moteurs">Les moteurs</h2>
<table>
<thead>
<tr>
<th>Moteur</th>
<th>Rôle</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Collecte</strong></td>
<td>API des agents (enrôlement, événements, battement, inventaire, manifeste signé), écouteur Syslog, lecture de fichiers, connecteurs d'intégration</td>
</tr>
<tr>
<td><strong>Normalisation</strong></td>
<td>Tous les journaux vers un seul schéma ; le journal brut est toujours conservé</td>
</tr>
<tr>
<td><strong>Corrélation et détection</strong></td>
<td>Règles (match, seuil, valeurs distinctes, séquence), fenêtres de temps, regroupement, score de risque, MITRE ATT&amp;CK, incidents</td>
</tr>
<tr>
<td><strong>Inventaire</strong></td>
<td>Instantanés par catégorie et historique des changements</td>
</tr>
<tr>
<td><strong>IA</strong></td>
<td>Détection d'anomalies avec un modèle entraîné localement</td>
</tr>
</tbody>
</table>
<h2 id="collecte-normalisation--le-flux-d-un-evenement">Le flux d'un événement</h2>
<ol>
<li>L'agent (ou le collecteur) publie l'événement brut dans un flux Redis. La publication a lieu <strong>avant</strong> l'accusé de réception à l'agent : un événement acquitté n'est jamais perdu.</li>
<li>Le worker lit par <strong>lots</strong>, normalise, enrichit avec l'inventaire, évalue les règles, corrèle, ouvre ou alimente les incidents, puis stocke.</li>
<li>Les événements invalides vont en file de rebut (<em>dead-letter</em>) sans bloquer le lot ; un lot qui échoue est rejoué.</li>
<li>Les identifiants d'événements sont déterministes et les insertions idempotentes : <strong>un rejeu ne crée pas de doublon</strong>.</li>
<li>Au-delà d'un seuil de file, l'API répond 429/503 avec <code>Retry-After</code> et les agents conservent leur tampon.</li>
</ol>
<h2 id="collecte-normalisation--le-schema-normalise">Le schéma normalisé</h2>
<table>
<thead>
<tr>
<th>Champ</th>
<th>Contenu</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>event_id</code></td>
<td>Identifiant déterministe</td>
</tr>
<tr>
<td><code>timestamp</code></td>
<td>Horodatage de l'événement</td>
</tr>
<tr>
<td><code>agent_id</code>, <code>hostname</code></td>
<td>Machine et agent d'origine</td>
</tr>
<tr>
<td><code>source_type</code></td>
<td>Nature de la source (<code>linux.auth</code>, <code>windows.eventlog</code>, <code>pfsense.filterlog</code>…)</td>
</tr>
<tr>
<td><code>event_category</code>, <code>event_action</code></td>
<td>Catégorie et action normalisées</td>
</tr>
<tr>
<td><code>severity</code></td>
<td><code>low</code>, <code>medium</code>, <code>high</code>, <code>critical</code></td>
</tr>
<tr>
<td><code>source_ip</code>, <code>destination_ip</code></td>
<td>Adresses, avec ports et protocole quand ils existent</td>
</tr>
<tr>
<td><code>username</code>, <code>process_name</code></td>
<td>Compte et processus concernés</td>
</tr>
<tr>
<td><code>raw_log</code></td>
<td><strong>Journal original</strong>, intact</td>
</tr>
<tr>
<td><code>normalized_fields</code></td>
<td>Champs spécifiques à la source</td>
</tr>
<tr>
<td><code>metadata</code></td>
<td>Contexte de collecte</td>
</tr>
</tbody>
</table>
<p>Le vocabulaire <code>event_type</code> couvre notamment : <code>auth_failure</code>, <code>auth_success</code>, <code>privilege_escalation</code>, <code>account_created</code>, <code>log_cleared</code>, <code>file_modified</code>, <code>network_probe</code>, <code>ids_alert</code>, <code>fw_deny</code>, <code>dns_query</code>, <code>flow</code>, <code>syslog</code>.</p>
<h2 id="collecte-normalisation--analyseurs-fournis">Analyseurs fournis</h2>
<p>Linux (auth, syslog), Windows (XML d'événement, DTD refusées), pfSense (<code>filterlog</code>), FortiGate (clé=valeur), Snort, Suricata (EVE JSON et syslog), JSON générique, enveloppe d'agent, et des analyseurs <strong>déclaratifs</strong>.</p>
<h2 id="collecte-normalisation--ajouter-un-format-sans-ecrire-de-code">Ajouter un format sans écrire de code</h2>
<p>Déposez un fichier dans <code>configs/parsers/</code> (voir <code>web.yaml</code> pour un modèle) : une expression régulière avec des groupes nommés, associés aux champs normalisés. Puis :</p>
<pre><code class="language-bash">docker compose restart worker collector
</code></pre>
<p>Pour un format complexe, écrivez une classe d'analyseur Python enregistrée par nom dans <code>backend/app/normalization/</code>.</p>
<h2 id="collecte-normalisation--choix-techniques">Choix techniques</h2>
<table>
<thead>
<tr>
<th>Choix</th>
<th>Pourquoi</th>
</tr>
</thead>
<tbody>
<tr>
<td>Python / FastAPI, SQLAlchemy, Alembic</td>
<td>Asynchrone, migrations versionnées</td>
</tr>
<tr>
<td>Redis Streams</td>
<td>File durable avec accusés et reprise, sans composant en plus</td>
</tr>
<tr>
<td>PostgreSQL</td>
<td>Intégrité transactionnelle pour l'état ; suffisant pour les événements en mode léger</td>
</tr>
<tr>
<td>OpenSearch (optionnel)</td>
<td>Recherche à grande échelle sans l'imposer aux petites installations</td>
</tr>
<tr>
<td>Agent en Go</td>
<td>Un binaire statique, multi-plateforme, faible empreinte</td>
</tr>
<tr>
<td>Docker Compose</td>
<td>Un serveur, déploiement reproductible, réseau interne isolé</td>
</tr>
</tbody>
</table><div class="pn"><a href="#docs-agent-fiabilite"><small>Précédent</small>Fiabilité de l&#x27;agent</a><a class="next" href="#docs-detection-correlation"><small>Suivant</small>Détection et corrélation</a></div></article><article class="doc" id="doc-detection-correlation" data-slug="detection-correlation" data-title="Détection et corrélation" hidden><div class="crumb">Plateforme</div><h1>Détection et corrélation</h1><p style="margin-top:0">Types de règles, syntaxe YAML, séquences, score de risque, incidents, MITRE ATT&amp;CK.</p>
<h2 id="detection-correlation--les-types-de-regles">Les types de règles</h2>
<table>
<thead>
<tr>
<th>Type</th>
<th>Se déclenche quand…</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>match</code></td>
<td>un événement correspond aux conditions</td>
</tr>
<tr>
<td><code>threshold</code></td>
<td>le <strong>nombre</strong> d'événements correspondants dépasse <code>count</code> dans la fenêtre</td>
</tr>
<tr>
<td><code>distinct_count</code></td>
<td>le nombre de <strong>valeurs différentes</strong> d'un champ dépasse <code>count</code> (ex. une source échoue sur 3 machines)</td>
</tr>
<tr>
<td><code>sequence</code></td>
<td>des étapes <strong>ordonnées</strong> se produisent dans la fenêtre pour la même clé de regroupement</td>
</tr>
</tbody>
</table>
<p>Une règle peut aussi dépendre d'une autre avec <code>follows</code> : elle n'agit que si la règle indiquée a alerté pour la même source dans le délai.</p>
<h2 id="detection-correlation--ecrire-une-regle">Écrire une règle</h2>
<p>Les règles sont dans <code>configs/rules/*.yaml</code> (tous les fichiers du dossier sont lus). Pour vos règles, créez <code>configs/rules/custom.yaml</code>.</p>
<pre><code class="language-yaml">rules:
  - id: WIN_RDP_BRUTE_FORCE          # MAJUSCULES, chiffres, _ ; unique
    name: Windows logon brute force
    description: Many failed Windows logons against one machine from one source.
    type: threshold
    match: { event_type: auth_failure, source_type: windows.eventlog }
    group_by: [source_ip, hostname]  # un compteur par combinaison
    count: &quot;&gt;10&quot;                     # &gt; &gt;= &lt; &lt;= ==
    window: 5m                       # s, m ou h
    severity: high                   # low | medium | high | critical
    confidence: 0.8                  # 0 à 1
    mitre: T1110
    recommendations:
      - Block the source address at the firewall if it is external.
</code></pre>
<p>Une séquence :</p>
<pre><code class="language-yaml">  - id: ACCOUNT_CREATED_THEN_PRIVILEGED
    type: sequence
    steps:
      - match: { event_type: account_created }
      - match: { event_type: privilege_escalation }
    group_by: [hostname, username]
    window: 30m
    severity: critical
    mitre: T1136.001
</code></pre>
<h3 id="detection-correlation--operateurs-de-match">Opérateurs de <code>match</code></h3>
<p>Une valeur simple ou une liste signifie « égal à (l'une de) ». Une table accepte <code>regex</code>, <code>contains</code>, <code>startswith</code>, <code>endswith</code>, <code>in</code> et <code>not</code>. Un champ peut être une clé de <code>normalized_fields</code> avec le préfixe <code>normalized_fields.</code>.</p>
<h3 id="detection-correlation--appliquer">Appliquer</h3>
<aside class="callout c-attention">
<p><strong>Attention</strong> Les règles ne se rechargent qu'au démarrage et les compteurs en cours repartent à zéro. Un fichier invalide empêche le démarrage ; le message nomme le champ fautif.</p>
</aside>
<p>Validez d'abord dans <strong>Correlation › Custom rules</strong> (l'API de validation vérifie la syntaxe sans rien appliquer), puis :</p>
<pre><code class="language-bash">docker compose restart worker
</code></pre>
<h2 id="detection-correlation--le-score-de-risque">Le score de risque</h2>
<p>Chaque alerte reçoit un score de 0 à 100 calculé à partir de la <strong>gravité</strong> de la règle, de sa <strong>confiance</strong>, de la <strong>criticité</strong> de l'actif touché, de sa <strong>zone</strong> (OT, DMZ, IT) et des alertes voisines. Chaque contribution est affichée dans « Why this risk score ». Le déclin du risque d'un actif est réglable (demi-vie de 12 h par défaut). Les pondérations sont dans <code>configs/risk_weights.yaml</code>.</p>
<h2 id="detection-correlation--incidents-et-motifs-d-attaque">Incidents et motifs d'attaque</h2>
<p>Les alertes liées par la même source, la même cible ou le même utilisateur dans une fenêtre de 30 minutes sont regroupées dans un <strong>incident</strong>, ouvert pour un risque HIGH ou CRITICAL ou une détection critique. Un <strong>motif</strong> nomme un incident quand toutes les règles d'une séquence ont alerté, dans l'ordre :</p>
<pre><code class="language-yaml">patterns:
  - id: SSH_COMPROMISE
    title: Possible SSH compromise
    sequence: [SSH_BRUTE_FORCE, SSH_LOGIN_AFTER_BRUTE_FORCE, PRIVILEGE_ESCALATION]
    risk_bonus: 15
</code></pre>
<p>Les alertes de plusieurs sources (agent, pare-feu, IDS) se retrouvent dans le même incident, car la corrélation raisonne sur l'IP source et l'actif, pas sur le capteur d'origine.</p>
<h2 id="detection-correlation--mitre-att-ck">MITRE ATT&amp;CK</h2>
<p>Chaque règle peut porter une technique. La page <strong>MITRE</strong> montre la matrice et la <strong>couverture de détection</strong> ; les alertes affichent la technique et la tactique. Le catalogue embarqué est généré à partir des données officielles de MITRE (<code>scripts/build_mitre_catalog.py</code>).</p>

>high</td><td></td><td>5m</td><td>—</td></tr><tr><td><code>HOST_ALERT_HIGH</code></td><td>Host security alert (high severity)</td><td>match</td><td>high</td><td></td><td>10m</td><td>—</td></tr><tr><td><code>FIREWALL_DENY_BURST</code></td><td>Firewall deny burst</td><td>threshold</td><td>medium</td><td>&gt;=50</td><td>1m</td><td>T1046</td></tr></tbody></table>

<p><strong>Note</strong> Les règles sont volontairement génériques. Affinez-les avec vos données réelles : relevez <code>count</code>, allongez <code>window</code> ou baissez <code>severity</code> si une règle crie trop.</p>
</aside><div class="pn"><a href="#docs-collecte-normalisation"><small>Précédent</small>Architecture, collecte et normalisation</a><a class="next" href="#docs-inventaire"><small>Suivant</small>Inventaire et historique</a></div></article><article class="doc" id="doc-inventaire" data-slug="inventaire" data-title="Inventaire et historique" hidden><div class="crumb">Plateforme</div><h1>Inventaire et historique</h1><p style="margin-top:0">Ce que l&#x27;inventaire collecte, comment il est conservé et comment lire les changements.</p>
<p>Chaque agent envoie un <strong>inventaire</strong> par catégories, à des fréquences adaptées à la volatilité des données.</p>
<table>
<thead>
<tr>
<th>Catégorie</th>
<th>Fréquence</th>
<th>Contenu</th>
</tr>
</thead>
<tbody>
<tr>
<td>Matériel et système</td>
<td>60 min</td>
<td>CPU, mémoire, disques, cartes réseau, adresses, système, noyau, fuseau</td>
</tr>
<tr>
<td>Logiciels</td>
<td>60 min</td>
<td>Paquets installés (dpkg, rpm, apk, Windows)</td>
</tr>
<tr>
<td>Mises à jour</td>
<td>60 min</td>
<td>Correctifs installés, mises à jour en attente</td>
</tr>
<tr>
<td>Services</td>
<td>15 min</td>
<td>État de chaque service (systemd, services Windows)</td>
</tr>
<tr>
<td>Ports</td>
<td>15 min</td>
<td>Ports en écoute et processus associé</td>
</tr>
<tr>
<td>Utilisateurs</td>
<td>15 min</td>
<td>Comptes, groupes, privilèges</td>
</tr>
<tr>
<td>Processus</td>
<td>15 min</td>
<td>Processus actifs</td>
</tr>
</tbody>
</table>
<h2 id="inventaire--ou-le-voir">Où le voir</h2>
<p><strong>Infrastructure</strong> donne une vue d'ensemble (machines, charge CPU/mémoire/disque) et une page par machine avec ses logiciels, services, ports, comptes et mises à jour.</p>
<h2 id="inventaire--historique-des-changements">Historique des changements</h2>
<p>À chaque inventaire, Controlix compare avec le précédent et enregistre la <strong>différence</strong> : un logiciel installé ou retiré, un port ouvert, un service modifié, un compte ajouté. L'onglet <strong>Changes</strong> de la machine liste ces évolutions avec leur date. C'est ce qui permet de répondre à « qu'est-ce qui a changé sur ce serveur depuis hier ? ».</p>
<h2 id="inventaire--detection-liee-a-l-inventaire">Détection liée à l'inventaire</h2>
<p>Certaines règles s'appuient sur ces changements : <code>NEW_LISTENING_PORT</code> (nouveau port en écoute), <code>NEW_SERVICE_INSTALLED</code>, <code>SCHEDULED_TASK_CREATED</code>, <code>FIREWALL_RULE_CHANGED</code>, <code>SENSITIVE_FILE_CHANGED</code>.</p>
<aside class="callout c-note">
<p><strong>Note</strong> Pas de correspondance CVE dans cette version : l'inventaire donne les logiciels et le nombre de mises à jour de sécurité en attente, pas les vulnérabilités connues associées.</p>
</aside>
<h2 id="inventaire--services-absents">Services absents</h2>
<p>Sur une machine sans systemd (conteneur, certains environnements de test), la liste des services est vide : c'est normal, le service n'existe pas.</p>
<h2 id="inventaire--vie-privee">Vie privée</h2>
<p>Le numéro de série matériel n'est collecté que si <code>inventory.collect_serial</code> est activé. L'inventaire ne contient pas de contenu de fichiers.</p><div class="pn"><a href="#docs-detection-correlation"><small>Précédent</small>Détection et corrélation</a><a class="next" href="#docs-ia"><small>Suivant</small>Détection d&#x27;anomalies (IA)</a></div></article><article class="doc" id="doc-ia" data-slug="ia" data-title="Détection d&#x27;anomalies (IA)" hidden><div class="crumb">Plateforme</div><h1>Détection d&#x27;anomalies (IA)</h1><p style="margin-top:0">Apprentissage du comportement normal de chaque machine, avec explication de chaque anomalie.</p>
<p>Les règles détectent ce qu'on sait décrire (« plus de 10 échecs SSH en 5 minutes »). Elles ne voient pas ce qu'on n'a pas prévu : un automate qui contacte soudain des dizaines d'adresses inconnues, un capteur dont le trafic explose. C'est le rôle de l'IA.</p>
<p>Controlix <strong>apprend ce qui est normal pour chaque machine</strong>, puis signale les moments où elle se comporte très différemment, <strong>en disant précisément ce qui a changé</strong>. Chaque anomalie devient une alerte comme les autres : notée, expliquée, corrélée, et capable d'ouvrir un incident.</p>
<h2 id="ia--pourquoi-cette-technique">Pourquoi cette technique</h2>
<table>
<thead>
<tr>
<th>Exigence</th>
<th>Réponse</th>
</tr>
</thead>
<tbody>
<tr>
<td>Expliquer chaque détection</td>
<td>Indicateurs simples (des comptages) et phrase d'explication</td>
</tr>
<tr>
<td>Fonctionner sur place</td>
<td>Calcul local sur processeur : aucune donnée ne sort</td>
</tr>
<tr>
<td>Rester léger</td>
<td>Isolation Forest, sans GPU, entraînement en quelques secondes</td>
</tr>
<tr>
<td>Pas de données étiquetées</td>
<td>Apprentissage non supervisé sur le trafic normal</td>
</tr>
</tbody>
</table>
<h2 id="ia--comment-ca-marche">Comment ça marche</h2>
<ol>
<li><strong>Découpage</strong> en fenêtres de 5 minutes. Pour chaque machine, on compte : <code>events_out</code>, <code>events_in</code>, <code>peers_out</code>, <code>peers_in</code>, <code>ports_out</code>, <code>auth_failures_in</code>, <code>mqtt_events</code>, <code>new_peers</code>.</li>
<li><strong>Référence par machine</strong> : moyenne et dispersion de chaque indicateur sur son comportement normal. « 100 événements » est banal pour une passerelle et alarmant pour un capteur.</li>
<li><strong>Écart</strong> : de combien d'écarts habituels chaque indicateur s'éloigne de la normale de <strong>cette</strong> machine.</li>
<li><strong>Forêt d'isolement</strong> : mesure la facilité d'isoler cette fenêtre du reste (score de 0,5 à 1,0).</li>
<li><strong>Décision</strong> : une fenêtre est signalée si plusieurs indicateurs changent ensemble (score au-dessus du seuil appris et un indicateur à 4 écarts, <code>AI_Z_THRESHOLD</code>), ou si un seul indicateur explose (6 écarts, <code>AI_Z_STRONG</code>). Il faut une vraie <strong>hausse</strong> : un silence n'est pas signalé.</li>
</ol>
<p>Exemple d'explication :</p>
<pre><code class="language-text">Outbound events: 197 (usual 10.4, 19x the usual)
Distinct destinations contacted: 47 (usual 1.0, 47x the usual)
MQTT messages: 60 (usual 0.0)
</code></pre>
<h2 id="ia--apprentissage">Apprentissage</h2>
<ul>
<li><strong>Données réelles</strong> : l'entraînement démarre tout seul dès <strong>24 heures</strong> d'historique, sur les 7 derniers jours, puis se répète toutes les 24 heures. Avant cela, la page indique « collecting baseline ».</li>
<li>Les fenêtres où une alerte HIGH ou CRITICAL concerne la machine sont <strong>exclues</strong> : une attaque n'est pas apprise comme normale.</li>
<li>Une machine avec moins de 12 fenêtres utilisables n'a pas de référence.</li>
<li>Réel et simulé ont chacun leur modèle.</li>
</ul>
<h2 id="ia--integration-au-reste">Intégration au reste</h2>
<p>L'anomalie devient une alerte (règle <code>AI_ANOMALY</code>) avec les mêmes moteurs de risque et de corrélation. Elle ajoute jusqu'à <strong>15 points</strong> de risque, et une autre alerte sur la même machine dans les 30 minutes reçoit les mêmes points : une détection sur une machine qui se comporte bizarrement mérite plus d'attention. Une anomalie qui dure donne <strong>une seule alerte</strong> (repos de 15 minutes par machine).</p>
<p>Le service IA est un <strong>processus séparé</strong> : l'entraînement n'affecte ni l'API ni la collecte.</p>

</table><div class="pn"><a href="#docs-inventaire"><small>Précédent</small>Inventaire et historique</a><a class="next" href="#docs-stockage-retention"><small>Suivant</small>Stockage et rétention</a></div></article><article class="doc" id="doc-stockage-retention" data-slug="stockage-retention" data-title="Stockage et rétention" hidden><div class="crumb">Plateforme</div><h1>Stockage et rétention</h1><p style="margin-top:0">Où vont les données, combien de temps elles sont gardées et comment limiter l&#x27;espace.</p>
<h2 id="stockage-retention--ou-sont-les-donnees">Où sont les données</h2>
<table>
<thead>
<tr>
<th>Donnée</th>
<th>Emplacement</th>
</tr>
</thead>
<tbody>
<tr>
<td>Agents, jetons, commandes, inventaire et changements, alertes, incidents, actifs, audit, intégrations (secrets chiffrés), paramètres</td>
<td><strong>PostgreSQL 16</strong></td>
</tr>
<tr>
<td>Événements</td>
<td>PostgreSQL en <strong>mode léger</strong>, ou <strong>OpenSearch</strong> (index quotidiens compressés) en mode complet</td>
</tr>
<tr>
<td>File d'ingestion</td>
<td>Redis Streams (persistance AOF)</td>
</tr>
<tr>
<td>Certificats et clés</td>
<td><code>data/tls/</code></td>
</tr>
<tr>
<td>Secrets de fonctionnement</td>
<td><code>.env</code> (accès 600)</td>
</tr>
</tbody>
</table>
<h2 id="stockage-retention--mode-leger-ou-complet">Mode léger ou complet</h2>
<p>Sous 6 Go de RAM, l'installeur choisit le <strong>mode léger</strong> : pas d'OpenSearch, les événements restent dans PostgreSQL. Pour un volume soutenu ou des recherches sur de longues périodes, utilisez le mode complet. Forcer le mode léger : <code>--light</code>.</p>
<h2 id="stockage-retention--retention-configurable">Rétention configurable</h2>
<p>Dans <strong>Log Management › Retention</strong> (ou <code>GET/PUT /api/v1/system/retention</code>) :</p>
<ul>
<li>durée de conservation des <strong>événements</strong> ;</li>
<li>durée de l'<strong>historique d'inventaire</strong> et du <strong>journal d'audit</strong> ;</li>
<li><strong>plafond de stockage</strong> : au-delà, les plus anciens sont supprimés.</li>
</ul>
<p>Les tâches de nettoyage tournent toutes les 30 minutes. <strong>Les alertes et les incidents sont conservés.</strong></p>
<p>Valeur par défaut des événements : 48 heures (<code>EVENT_RETENTION_HOURS</code>).</p>
<aside class="callout c-astuce">
<p><strong>Astuce</strong> Réduisez la durée si le disque se remplit. Sur la mesure faite pendant les tests, 6 000 événements vieillis de 5 jours ont été supprimés et les 12 000 récents conservés.</p>
</aside>
<h2 id="stockage-retention--rotation-des-journaux-des-services">Rotation des journaux des services</h2>
<p>Tous les services Docker utilisent la rotation des journaux (taille et nombre de fichiers bornés), pour que les logs de la plateforme elle-même ne remplissent pas le disque. Les agents font tourner leur propre journal (10 Mo × 5).</p>
<h2 id="stockage-retention--ce-que-la-sauvegarde-contient">Ce que la sauvegarde contient</h2>
<p>Base PostgreSQL, <code>.env</code>, certificats et configuration. Les événements OpenSearch ne sont pas inclus : leur rétention est courte par conception. Voir <a href="#docs-sauvegarde-mise-a-jour">Sauvegarde et mise à jour</a>.</p><div class="pn"><a href="#docs-ia"><small>Précédent</small>Détection d&#x27;anomalies (IA)</a><a class="next" href="#docs-manuel-navigation"><small>Suivant</small>Naviguer dans la console</a></div></article><article class="doc" id="doc-manuel-navigation" data-slug="manuel-navigation" data-title="Naviguer dans la console" hidden><div class="crumb">Manuel du tableau de bord</div><h1>Naviguer dans la console</h1><p style="margin-top:0">Le rail d&#x27;icônes, les onglets, le sélecteur réel/simulé, le thème et les droits d&#x27;accès.</p>

<li><strong>Horodatages relatifs</strong> (« 7m ago ») : passez la souris dessus pour l'heure exacte.</li>
<li><strong>Rafraîchissement automatique</strong> : <code>Overview</code> toutes les 10 s, les intégrations toutes les 5 s. Rien à recharger.</li>
<li><strong>Tableaux</strong> : une ligne cliquable ouvre son détail ; la pagination (<code>Previous</code> / <code>Next</code>) est en bas.</li>
</ul>
<aside class="callout c-astuce">
<p><strong>Astuce</strong> Un lien du type « Alerts › High 3 » en haut de <code>Overview</code> ouvre directement la liste d'alertes déjà filtrée.</p>
</aside><div class="pn"><a href="#docs-stockage-retention"><small>Précédent</small>Stockage et rétention</a><a class="next" href="#docs-manuel-overview"><small>Suivant</small>Overview (tableau de bord)</a></div></article><article class="doc" id="doc-manuel-overview" data-slug="manuel-overview" data-title="Overview (tableau de bord)" hidden><div class="crumb">Manuel du tableau de bord</div><h1>Overview (tableau de bord)</h1><p style="margin-top:0">Chaque carte de la page d&#x27;accueil de la console : ce qu&#x27;elle mesure, comment la lire, quoi faire ensuite.</p>
<p>La page d'accueil répond à une question : <strong>« y a-t-il quelque chose à traiter maintenant ? »</strong>. Elle se rafraîchit seule toutes les 10 secondes ; la ligne sous le titre indique l'heure de la dernière mise à jour.</p>
<h2 id="manuel-overview--l-en-tete">L'en-tête</h2>
<p><strong><code>Security Operations Center</code></strong> : le titre, avec le monde affiché (« Your infrastructure » ou « Simulated environment »).</p>
<p><strong>Les pastilles de gravité</strong> (à droite) comptent les alertes par gravité : <code>All alerts N</code>, <code>Critical</code>, <code>High</code>, <code>Medium</code>, <code>Low</code>. Chacune est un lien : un clic ouvre <code>Alerts</code> déjà filtré.</p>
<h2 id="manuel-overview--premiere-rangee-quatre-cartes">Première rangée : quatre cartes</h2>
<table>
<thead>
<tr>
<th>Carte</th>
<th>Ce qu'elle montre</th>
<th>Comment la lire</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong><code>Alerts, 24 h</code></strong></td>
<td>Le nombre d'alertes des 24 dernières heures et leur courbe heure par heure</td>
<td>Un pic récent mérite un coup d'œil. Passez sur un point pour voir l'heure et le nombre</td>
</tr>
<tr>
<td><strong><code>Activity by hour</code></strong></td>
<td>Le nombre d'événements stockés, et une grille de 24 cases : une par heure, la plus ancienne en premier</td>
<td>Case grise : aucune alerte. Plus la case est rouge, plus l'heure a produit d'alertes</td>
</tr>
<tr>
<td><strong><code>Platform health</code></strong></td>
<td>PostgreSQL, Redis, OpenSearch</td>
<td>Barre <strong>verte haute</strong> : le service répond. Barre <strong>rouge basse</strong> : il est en panne. Barre <strong>grise</strong> : désactivé (normal en mode léger pour OpenSearch). Le titre passe de <code>All up</code> à <code>Degraded</code></td>
</tr>
<tr>
<td><strong><code>Recent incidents</code></strong></td>
<td>Les cinq derniers incidents, avec leur référence, l'ancienneté et la gravité</td>
<td>Cliquez pour ouvrir l'incident. <code>View all</code> ouvre la liste complète</td>
</tr>
</tbody>
</table>
<h2 id="manuel-overview--deuxieme-rangee">Deuxième rangée</h2>
<p><strong><code>Global risk</code></strong> : le score de 0 à 100 de l'ensemble de votre infrastructure, avec son niveau (<code>LOW</code>, <code>MEDIUM</code>, <code>HIGH</code>, <code>CRITICAL</code>).</p>
<ul>
<li>La <strong>barre</strong> passe du vert au rouge.</li>
<li>La <strong>jauge</strong> répète le score.</li>
<li><strong><code>How this score is built</code></strong> liste les contributions, par exemple « Highest open incident (94/100) +66 » et « Average of the 2 riskiest assets (54/100) +16 ». Si rien n'est ouvert, la carte indique « No open incident or risky asset ».</li>
</ul>
<p><strong><code>Alerts, last 24 hours</code></strong> (carte dégradée rouge et vert) : la même courbe en grand, avec le nombre d'alertes critiques encore ouvertes (<code>N critical open</code>).</p>
<h2 id="manuel-overview--modules"><code>Modules</code></h2>
<p>Huit tuiles pour aller directement à : <code>Alerts</code>, <code>Incidents</code>, <code>AI Detection</code>, <code>MITRE ATT&amp;CK</code>, <code>Infrastructure</code>, <code>Agents</code>, <code>Correlation</code>, <code>Log Management</code>.</p>

</tr>

<td><strong><code>Top ATT&amp;CK techniques</code></strong></td>

<h2 id="manuel-overview--quand-la-page-est-vide">Quand la page est vide</h2>
<p>Si le message <strong>« No data received yet »</strong> s'affiche, aucune source n'a encore envoyé d'événement. Deux options :</p>
<ul>
<li>connectez une source : <a href="#docs-agent-installation">installer un agent</a> ou <a href="#docs-integrations">brancher une intégration</a> ;</li>
<li>regardez le produit travailler avec la <a href="#docs-simulation">simulation</a>.</li>
</ul>
<h2 id="manuel-overview--routine-quotidienne-en-deux-minutes">Routine quotidienne en deux minutes</h2>
<ol>
<li>Regardez <code>Global risk</code> et la pastille <code>Critical</code>.</li>
<li>Ouvrez le premier incident de <code>Recent incidents</code>.</li>
<li>Lisez sa chronologie, puis traitez-le : <a href="#docs-alertes-incidents">Alertes et incidents</a>.</li>
<li>Vérifiez <code>Platform health</code> : tout doit être vert.</li>
<li>Si une règle crie trop, ajustez-la : <a href="#docs-detection-correlation">Détection et corrélation</a>.</li>
</ol><div class="pn"><a href="#docs-manuel-navigation"><small>Précédent</small>Naviguer dans la console</a><a class="next" href="#docs-manuel-soc"><small>Suivant</small>SOC : alertes, incidents, événements</a></div></article><article class="doc" id="doc-manuel-soc" data-slug="manuel-soc" data-title="SOC : alertes, incidents, événements" hidden><div class="crumb">Manuel du tableau de bord</div><h1>SOC : alertes, incidents, événements</h1><p style="margin-top:0">Les pages Alerts, Incidents, Events et Log Management, élément par élément.</p>
<h2 id="manuel-soc--alerts">Alerts</h2>
<p><em>« Detections raised by the rule engine, scored by the Risk Engine. Click a row to see why it scored what it did. »</em></p>
<p><strong>Filtres</strong> (au-dessus du tableau) : une liste de <strong>gravité</strong>, une liste de <strong>statut</strong> (<code>All statuses</code>) et un champ <code>Source IP</code>.</p>
<table>
<thead>
<tr>
<th>Colonne</th>
<th>Contenu</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Severity</code></td>
<td>Gravité de la règle</td>
</tr>
<tr>
<td><code>Alert</code></td>
<td>Nom lisible et identifiant de la règle (par exemple <code>SSH_BRUTE_FORCE</code>)</td>
</tr>
<tr>
<td><code>Source → Destination</code></td>
<td>Adresses et port</td>
</tr>
<tr>
<td><code>Asset</code></td>
<td>L'actif touché, s'il est connu</td>
</tr>
<tr>
<td><code>Engine</code></td>
<td>La source de la détection (<code>wazuh</code>, <code>mqtt-monitor</code>…)</td>
</tr>
<tr>
<td><code>ATT&amp;CK</code></td>
<td>La technique MITRE</td>
</tr>
<tr>
<td><code>Risk</code></td>
<td>Le score de 0 à 100 et son niveau</td>
</tr>
<tr>
<td><code>Status</code></td>
<td><code>New</code>, <code>Open</code>, <code>Review</code>, <code>Closed</code>, <code>False positive</code></td>
</tr>
<tr>
<td><code>Last seen</code></td>
<td>Dernière occurrence</td>
</tr>
</tbody>
</table>
<p>Cliquez une ligne : le détail montre <strong><code>Why this risk score</code></strong>, ligne par ligne (gravité, confiance, criticité de l'actif, zone, alertes voisines), les événements d'origine et les recommandations. Vous pouvez y changer le <strong>statut</strong>. Fermer une alerte fait retomber le risque de l'actif.</p>
<h2 id="manuel-soc--incidents">Incidents</h2>
<p><em>« Correlated alerts grouped into one investigation, with a risk score and a timeline. »</em></p>
<p>Tableau : <code>Reference</code> (INC-00001…), <code>Title</code>, <code>Severity</code>, <code>Risk</code>, <code>Alerts</code> (nombre d'alertes liées), <code>Status</code>, <code>Last activity</code>. Un filtre <code>Status</code> est disponible.</p>
<h3 id="manuel-soc--le-detail-d-un-incident">Le détail d'un incident</h3>
<table>
<thead>
<tr>
<th>Bloc</th>
<th>Contenu</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong><code>Summary</code></strong></td>
<td>Actifs touchés, IP sources et destinations, sources de détection, techniques MITRE</td>
</tr>
<tr>
<td><strong><code>Why this risk score</code></strong></td>
<td>Les contributions au score de l'incident</td>
</tr>
<tr>
<td>Liste des alertes</td>
<td><code>Alert</code>, <code>Severity</code>, <code>Source → destination</code>, <code>Asset</code>, <code>Risk</code>, <code>ATT&amp;CK</code>, <code>First seen</code></td>
</tr>
<tr>
<td><strong><code>Timeline and analyst notes</code></strong></td>

</tbody>
</table>
<p>Pour écrire une note : champ <code>Add an analyst note…</code> puis <code>Add note</code>. Pour avancer l'enquête : la liste <strong><code>Incident status</code></strong> (<code>NEW</code>, <code>INVESTIGATING</code>, <code>CONTAINED</code>, <code>RESOLVED</code>, <code>FALSE_POSITIVE</code>).</p>
<h2 id="manuel-soc--events">Events</h2>
<p><em>« Normalized events from every source, newest first. Retention applies (48 hours by default). »</em></p>
<p>Filtres : <code>Event type</code> (par exemple <code>auth_failure</code>), <code>Severity</code>, <code>Source IP</code>.
Colonnes : <code>Time</code>, <code>Severity</code>, <code>Type</code>, <code>Source</code>, <code>From → to</code>, <code>Proto</code>, <code>Message</code>.</p>
<p>C'est l'écran de contrôle des <strong>intégrations</strong> : si votre équipement envoie bien ses journaux, ses événements apparaissent ici avec leur <code>Source</code>.</p>
<h2 id="manuel-soc--log-management">Log Management</h2>
<p><em>« Every collected log, normalized into one format. The original log line is always kept and shown in the detail row. »</em></p>
<ul>
<li><strong>Recherche</strong> : le champ <code>Search message or original log</code> cherche dans le message <strong>et</strong> dans le journal original.</li>
<li><strong>Filtres</strong> : <code>Host</code>, <code>User</code>, <code>Severity</code>, <code>Source type</code> (par exemple <code>linux.auth</code>, <code>windows.eventlog</code>, <code>pfsense.filterlog</code>).</li>
<li><strong>Colonnes</strong> : <code>Time</code>, <code>Severity</code>, <code>Type</code>, <code>Source</code>, <code>Host</code>, <code>User</code>, <code>Message</code>.</li>
<li><strong>Ligne dépliée</strong> : le journal brut intact et les champs normalisés.</li>
<li><strong>Carte <code>Retention and storage</code></strong> (administrateurs) : la durée de conservation des événements, de l'historique d'inventaire et du journal d'audit, et le plafond de stockage. Bouton <code>Save</code>. Voir <a href="#docs-stockage-retention">Stockage et rétention</a>.</li>
</ul><div class="pn"><a href="#docs-manuel-overview"><small>Précédent</small>Overview (tableau de bord)</a><a class="next" href="#docs-manuel-parc"><small>Suivant</small>Parc : actifs, infrastructure, agents</a></div></article><article class="doc" id="doc-manuel-parc" data-slug="manuel-parc" data-title="Parc : actifs, infrastructure, agents" hidden><div class="crumb">Manuel du tableau de bord</div><h1>Parc : actifs, infrastructure, agents</h1><p style="margin-top:0">Les pages Assets, Infrastructure et Agents : déclarer, surveiller et déployer.</p>
<h2 id="manuel-parc--assets">Assets</h2>
<p>La liste des machines et équipements <strong>connus</strong> : c'est elle qui donne leur <strong>criticité</strong> et leur <strong>zone</strong> aux alertes.</p>
<p><strong>Recherche</strong> : <code>Search hostname or IP</code>. <strong>Filtres</strong> : <code>Type</code>, <code>Zone</code>, <code>Criticality</code>.
<strong>Colonnes</strong> : <code>Hostname</code>, <code>IP</code>, <code>OS</code>, <code>Type</code>, <code>Zone</code> (IT, OT, DMZ), <code>Criticality</code>, <code>Risk</code>, <code>Status</code>, <code>Last seen</code>.</p>
<h3 id="manuel-parc--ajouter-un-actif">Ajouter un actif</h3>
<p>Bouton <code>Add asset</code> (rôle autorisé), carte <code>New asset</code> :</p>
<table>
<thead>
<tr>
<th>Champ</th>
<th>Contenu</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Hostname</code></td>
<td>Nom de la machine</td>
</tr>
<tr>
<td><code>IP address</code></td>
<td>Adresse : c'est elle qui relie les événements à l'actif</td>
</tr>
<tr>
<td><code>MAC address</code></td>
<td>Optionnel (<code>AA:BB:CC:DD:EE:FF</code>)</td>
</tr>
<tr>
<td><code>Operating system</code></td>
<td>Optionnel</td>
</tr>
<tr>
<td><code>Type</code></td>
<td>Serveur, poste, pare-feu, automate…</td>
</tr>
<tr>
<td><code>Zone</code></td>
<td>IT, OT ou DMZ</td>
</tr>
<tr>
<td><code>Criticality</code></td>
<td>Importance de l'actif ; elle pèse sur le score de chaque alerte</td>
</tr>
</tbody>
</table>
<p><code>Create asset</code> enregistre. Déclarez à la main vos pare-feu, automates et équipements réseau ; les machines avec agent sont créées automatiquement.</p>
<h2 id="manuel-parc--infrastructure">Infrastructure</h2>
<p>Le parc <strong>vu par les agents</strong>.</p>
<ul>
<li><strong>Recherche</strong> <code>Host or IP</code>, filtre <code>Status</code>.</li>
<li><strong><code>Machines</code></strong> : <code>Host</code>, <code>System</code>, <code>CPU</code>, <code>Memory</code>, <code>Disk</code>, <code>Open ports</code>, <code>Software</code>, <code>Status</code>, <code>Last seen</code>.</li>
<li><strong><code>By operating system</code></strong> : la répartition du parc.</li>
<li><strong><code>Recent changes</code></strong> : ce qui a changé récemment (logiciel installé, port ouvert, service modifié, compte ajouté).</li>
</ul>
<p>Cliquez une machine : ses logiciels, services, ports en écoute, comptes, mises à jour en attente, et l'historique de ses changements. Voir <a href="#docs-inventaire">Inventaire</a>.</p>
<h2 id="manuel-parc--agents">Agents</h2>
<p><em>Le déploiement et l'état du parc d'agents.</em></p>
<h3 id="manuel-parc--agents-deployment-generer-la-commande-d-installation"><code>Agents Deployment</code> : générer la commande d'installation</h3>
<ol>
<li>Remplissez la carte : <strong><code>Label</code></strong> (par exemple « web servers »), <strong><code>Zone</code></strong>, <strong><code>Criticality</code></strong>, <strong><code>Machines</code></strong> (le nombre maximal de machines qui peuvent utiliser ce jeton).</li>
<li>Cliquez <strong><code>Generate token</code></strong>.</li>
<li>La commande d'installation s'affiche <strong>une seule fois</strong> (Linux et Windows), avec l'adresse de <strong>votre</strong> serveur et l'empreinte de son certificat. Copiez-la et lancez-la sur la machine.</li>
</ol>
<h3 id="manuel-parc--enrollment-tokens"><code>Enrollment tokens</code></h3>
<p><code>Token</code>, <code>Label</code>, <code>Uses</code>, <code>Expires</code>, <code>Status</code>, et <code>Revoke</code> pour annuler un jeton avant son expiration.</p>
<h3 id="manuel-parc--installed-agents"><code>Installed agents</code></h3>

<p>Voir <a href="#docs-agent-installation">Installer un agent</a> et <a href="#docs-agent-gestion">Gérer les agents</a>.</p><div class="pn"><a href="#docs-manuel-soc"><small>Précédent</small>SOC : alertes, incidents, événements</a><a class="next" href="#docs-manuel-analyse"><small>Suivant</small>Analyse : corrélation, IA, MITRE, santé</a></div></article><article class="doc" id="doc-manuel-analyse" data-slug="manuel-analyse" data-title="Analyse : corrélation, IA, MITRE, santé" hidden><div class="crumb">Manuel du tableau de bord</div><h1>Analyse : corrélation, IA, MITRE, santé</h1><p style="margin-top:0">Les pages Correlation, AI Detection, MITRE ATT&amp;CK et System Health.</p>
<h2 id="manuel-analyse--correlation">Correlation</h2>
<ul>
<li><strong><code>Detection rules</code></strong> : toutes les règles en vigueur. Colonnes : <code>Rule</code>, <code>Type</code> (match, threshold, distinct_count, sequence), <code>Severity</code>, <code>Window</code>, <code>Grouped by</code>, <code>MITRE</code>, <code>Fired 24 h</code> (déclenchements des 24 dernières heures), <code>Last</code>.</li>
<li><strong><code>Custom rules</code></strong> : un champ de texte où coller vos règles YAML, et le bouton <strong><code>Check rules</code></strong> qui vérifie la syntaxe <strong>sans rien appliquer</strong>. Pour les activer, voir <a href="#docs-detection-correlation">Détection et corrélation</a>.</li>
</ul>
<p>Une règle qui se déclenche beaucoup (<code>Fired 24 h</code>) sans intérêt est à relever ou à alléger.</p>
<h2 id="manuel-analyse--ai-detection">AI Detection</h2>
<p>L'IA apprend le comportement normal de chaque machine et signale les écarts. Voir <a href="#docs-ia">IA</a>.</p>
<table>
<thead>
<tr>
<th>Élément</th>
<th>Contenu</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Train model</code></td>
<td>Entraîne le modèle (administrateurs)</td>
</tr>
<tr>
<td><code>Analyse now</code></td>
<td>Lance une analyse immédiate (administrateurs)</td>
</tr>
<tr>
<td><strong><code>What it learned</code></strong></td>
<td>Le modèle actif et, par machine, ce qui est « normal » pour elle</td>
</tr>
<tr>
<td><strong><code>Score of each analysed window</code></strong></td>
<td>Le score de chaque fenêtre de 5 minutes ; celles au-dessus du seuil sont des anomalies</td>
</tr>
<tr>
<td><strong><code>Detected anomalies</code></strong></td>
<td>Les anomalies, avec l'<strong>explication</strong> de ce qui a changé et le lien <code>See the alert it raised</code></td>
</tr>
</tbody>
</table>
<p>Tant que le message <code>No model has been trained yet</code> est affiché, patientez : l'entraînement démarre seul après 24 heures de données réelles (ou utilisez la <a href="#docs-simulation">simulation</a>).</p>
<h2 id="manuel-analyse--mitre-att-ck">MITRE ATT&amp;CK</h2>
<p>La couverture de vos détections.</p>
<ul>
<li><strong><code>Coverage</code></strong> : la part des techniques couvertes par vos règles.</li>
<li>Tableau : <code>Tactic</code>, <code>Technique</code>, <code>ID</code>, <code>Covered by rules</code>, <code>Observed</code>, <code>Detections</code>, <code>Incidents</code>.</li>
<li>Les <strong>trous</strong> (techniques non couvertes) sont l'information utile : ils indiquent où écrire de nouvelles règles.</li>
</ul>

<p><strong>Astuce</strong> <code>Data sources</code> est le premier écran à ouvrir quand une intégration ne semble rien envoyer.</p>
</aside><div class="pn"><a href="#docs-manuel-parc"><small>Précédent</small>Parc : actifs, infrastructure, agents</a><a class="next" href="#docs-manuel-administration"><small>Suivant</small>Administration : utilisateurs, rôles, règles</a></div></article><article class="doc" id="doc-manuel-administration" data-slug="manuel-administration" data-title="Administration : utilisateurs, rôles, règles" hidden><div class="crumb">Manuel du tableau de bord</div><h1>Administration : utilisateurs, rôles, règles</h1><p style="margin-top:0">Les pages réservées aux administrateurs : Users, Roles, Rules, Integrations, Demo.</p>
<p>Ces pages n'apparaissent que pour le rôle <strong>ADMIN</strong>.</p>
<h2 id="manuel-administration--users">Users</h2>
<p><em>« Create accounts, assign a role, disable access or reset a password. »</em></p>
<p>Tableau : <code>Username</code>, <code>Name</code>, <code>E-mail</code>, <code>Role</code>, <code>Status</code>, <code>Last sign-in</code>. Bouton <code>Add user</code> : nom d'utilisateur (3 à 64 caractères : minuscules, chiffres, <code>.</code>, <code>_</code>, <code>-</code>), e-mail, nom, rôle, mot de passe (12 caractères minimum). Sur une ligne : changer le rôle, désactiver, réinitialiser le mot de passe. Le <strong>dernier administrateur actif</strong> ne peut pas être désactivé.</p>
<h2 id="manuel-administration--roles">Roles</h2>
<p>Tableau : <code>Role</code>, <code>Description</code>, <code>Permissions</code>, <code>Users</code>. Bouton <code>New role</code> : un nom (par exemple <code>AUDITOR</code>), une description et des permissions parmi <code>READ</code>, <code>WRITE</code>, <code>INVESTIGATE</code>, <code>RESPOND</code>, <code>ADMIN</code>. Les quatre rôles intégrés sont en lecture seule ; un rôle encore attribué ne peut pas être supprimé (<code>Delete</code>).</p>
<h2 id="manuel-administration--rules">Rules</h2>
<p><em>« Loaded from configs/rules/</em>.yaml when the service starts. »* Liste en lecture seule : <code>Rule</code>, <code>Type</code>, <code>Severity</code>, <code>Condition</code>, <code>ATT&amp;CK</code>, <code>Enabled</code>. Pour modifier, voir <a href="#docs-detection-correlation">Détection et corrélation</a>.</p>
<h2 id="manuel-administration--integrations">Integrations</h2>
<p>L'état des <strong>sources</strong> qui alimentent Controlix : <code>Source</code>, <code>Status</code>, <code>Location</code>, <code>Events</code>, <code>Errors</code>, <code>Dropped</code>, <code>Last event</code>. Page en lecture seule, rafraîchie toutes les 5 secondes. Une source est active tant que des événements arrivent.</p>
<h2 id="manuel-administration--security-solutions">Security Solutions</h2>
<p>La page où l'on <strong>ajoute, teste et gère</strong> Wazuh, Suricata, Snort, pfSense, FortiGate, Syslog et les sources JSON. C'est le cœur de la connexion à vos outils : voir le groupe <a href="#docs-integrations">Intégrations</a>.</p>
<h2 id="manuel-administration--demo">Demo</h2>
<p>La page de la <strong>simulation</strong> : voir <a href="#docs-simulation">Simulation et mode démo</a>.</p><div class="pn"><a href="#docs-manuel-analyse"><small>Précédent</small>Analyse : corrélation, IA, MITRE, santé</a><a class="next" href="#docs-integrations"><small>Suivant</small>Brancher vos outils (vue d&#x27;ensemble)</a></div></article><article class="doc" id="doc-integrations" data-slug="integrations" data-title="Brancher vos outils (vue d&#x27;ensemble)" hidden><div class="crumb">Intégrations</div><h1>Brancher vos outils (vue d&#x27;ensemble)</h1><p style="margin-top:0">Le principe, la page Security Solutions champ par champ, les statuts, la vérification et les règles de sécurité.</p>
<p>Controlix <strong>n'exige aucun outil externe</strong> : ses agents suffisent. Si vous avez déjà des capteurs ou des pare-feu, vous les branchez comme <strong>sources d'événements</strong> : Controlix lit leurs sorties, les normalise, les corrèle avec celles des agents et calcule le risque.</p>
<aside class="callout c-note">
<p><strong>Note</strong> Les outils tiers ne fournissent que des <strong>événements</strong>. <strong>Aucune commande n'est envoyée</strong> à vos équipements et aucun port n'est ouvert sur eux. Les alertes de plusieurs sources (agent, pare-feu, IDS) se retrouvent dans le même incident.</p>
</aside>

<h2 id="integrations--syslog-reception">Syslog : réception</h2>
<p>L'installeur ouvre la réception Syslog en <strong>UDP et TCP 514</strong>. Seuls sont acceptés les réseaux de <code>SYSLOG_ALLOWED_NETS</code> (réseaux privés par défaut) et les adresses des équipements déclarés. Voir <a href="#docs-configuration">Variables de configuration</a>.</p>
<aside class="callout c-attention">
<p><strong>Attention</strong> Syslog n'a ni authentification ni chiffrement ici : limitez le port 514 par le pare-feu du serveur aux adresses de vos équipements. Derrière un relais ou un NAT, l'adresse vue est celle du <strong>relais</strong> : déclarez celle-là.</p>
</aside>
<h2 id="integrations--securite-des-connexions">Sécurité des connexions</h2>
<ul>
<li>TLS vérifié par défaut ; redirections non suivies.</li>
<li><strong>Garde SSRF</strong> : loopback, link-local, multicast et réseau interne de Controlix sont refusés comme cible.</li>
<li>Identifiants <strong>chiffrés</strong> (Fernet), jamais renvoyés par l'API ni écrits dans les journaux.</li>
<li>La gestion des intégrations est <strong>réservée aux administrateurs</strong>.</li>
</ul>
<aside class="callout c-note">
<p><strong>Note</strong> Les correspondances de gravité et de champs suivent les formats documentés par chaque éditeur. Wazuh, FortiGate, pfSense et Snort n'ont pas pu être testés sur des produits réels : validez sur vos propres alertes et signalez tout écart.</p>
</aside><div class="pn"><a href="#docs-manuel-administration"><small>Précédent</small>Administration : utilisateurs, rôles, règles</a><a class="next" href="#docs-int-wazuh"><small>Suivant</small>Wazuh</a></div></article><article class="doc" id="doc-int-wazuh" data-slug="int-wazuh" data-title="Wazuh" hidden><div class="crumb">Intégrations</div><h1>Wazuh</h1><p style="margin-top:0">Lire les alertes de l&#x27;Indexer, l&#x27;état des agents du Manager, ou le fichier alerts.json.</p>
<p>Wazuh détecte ; Controlix <strong>normalise et corrèle</strong> ses alertes avec le reste. Trois connexions possibles, à combiner :</p>

<h2 id="int-wazuh--1-preparer-wazuh">1. Préparer Wazuh</h2>
<p>Créez un compte <strong>en lecture seule</strong> :</p>
<ul>
<li><strong>Indexer</strong> : un utilisateur autorisé à lire <code>wazuh-alerts-*</code> (pas de droit d'écriture).</li>
<li><strong>Manager API</strong> : un utilisateur API avec un rôle de lecture.</li>
</ul>
<p>Vérifiez que le serveur Controlix peut joindre le port concerné (pare-feu) :</p>
<pre><code class="language-bash">curl -k -u utilisateur:motdepasse https://IP_WAZUH:9200/_cat/indices/wazuh-alerts-*
</code></pre>

</tr>
<tr>
<td><code>Connection</code></td>
<td>Wazuh Indexer API (alerts)</td>
</tr>
<tr>
<td><code>Name</code></td>
<td>Wazuh production</td>
</tr>
<tr>
<td><code>Host or IP address</code> / <code>Port</code></td>
<td>Adresse de l'Indexer / <code>9200</code></td>
</tr>
<tr>
<td><code>Protocol</code></td>
<td><code>https</code></td>
</tr>
<tr>
<td><code>Indexer user</code>, <code>Password</code></td>
<td>Le compte en lecture seule</td>
</tr>
<tr>
<td><code>Index pattern</code></td>
<td><code>wazuh-alerts-*</code></td>
</tr>
<tr>
<td><code>Start from</code></td>
<td><code>now</code> (nouvelles alertes seulement) ou <code>beginning</code> (tout l'historique)</td>
</tr>
<tr>
<td><code>Poll interval (s)</code></td>
<td><code>5</code></td>
</tr>
<tr>
<td>TLS</td>
<td>Épinglez l'empreinte SHA-256 ou collez la CA si le certificat est auto-signé</td>
</tr>
</tbody>
</table>
<h3 id="int-wazuh--manager-api-etat-des-agents">Manager API (état des agents)</h3>
<p><code>Connection</code> : Wazuh Manager API, port <code>55000</code>, protocole <code>https</code>, <code>API user</code> et <code>Password</code>, <code>Poll interval (s)</code> <code>60</code>.</p>
<h3 id="int-wazuh--fichier-alerts-json">Fichier <code>alerts.json</code></h3>
<p>Pour un Wazuh installé sur le <strong>même serveur</strong> que Controlix :</p>
<ol>
<li>Dans <code>/opt/controlix/.env</code>, indiquez le dossier qui contient le fichier :
   <code>bash
   WAZUH_LOG_DIR=/var/ossec/logs/alerts</code></li>
<li>Si Wazuh protège le fichier, donnez au collecteur le bon <code>uid:gid</code> (<code>COLLECTOR_USER=999:999</code> par exemple).</li>
<li><code>cd /opt/controlix &amp;&amp; sudo docker compose up -d</code>.</li>
<li>Dans Controlix : <code>Connection</code> = alerts.json file, <code>Path of alerts.json</code> = <code>/data/wazuh/alerts.json</code>.</li>
</ol>
<h2 id="int-wazuh--3-tester-enregistrer-connecter">3. Tester, enregistrer, connecter</h2>
<p><code>Test connection</code> → <code>Save</code> → <code>Connect</code>. Le statut doit passer à <code>connected</code>.</p>
<h2 id="int-wazuh--4-verifier">4. Vérifier</h2>
<ul>
<li><strong>Events</strong> : des événements dont la source est Wazuh.</li>
<li>La gravité suit le niveau Wazuh : niveau ≥ 13 <code>critical</code>, ≥ 10 <code>high</code>, ≥ 7 <code>medium</code>, ≥ 4 <code>low</code>.</li>
<li><strong>System Health › Data sources</strong> : la source apparaît.</li>
</ul>

</table><div class="pn"><a href="#docs-integrations"><small>Précédent</small>Brancher vos outils (vue d&#x27;ensemble)</a><a class="next" href="#docs-int-suricata"><small>Suivant</small>Suricata</a></div></article><article class="doc" id="doc-int-suricata" data-slug="int-suricata" data-title="Suricata" hidden><div class="crumb">Intégrations</div><h1>Suricata</h1><p style="margin-top:0">Lire les alertes EVE JSON de Suricata par fichier, par liste Redis ou par Syslog.</p>
<p>Controlix lit les <strong>alertes EVE JSON</strong> de Suricata. Trois modes, du plus simple au plus souple :</p>
<table>
<thead>
<tr>
<th>Connexion</th>
<th>Quand l'utiliser</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>eve.json file</strong></td>
<td>Suricata est sur le <strong>même serveur</strong> que Controlix</td>
</tr>
<tr>
<td><strong>Suricata Redis output</strong></td>
<td>Suricata est ailleurs et pousse ses alertes dans une liste Redis que Controlix lit</td>
</tr>
<tr>
<td><strong>EVE over syslog</strong></td>
<td>Suricata est ailleurs et envoie en Syslog</td>
</tr>
</tbody>
</table>
<h2 id="int-suricata--fichier-eve-json-meme-serveur">Fichier <code>eve.json</code> (même serveur)</h2>
<ol>
<li>Dans <code>/opt/controlix/.env</code> :
   <code>bash
   SURICATA_LOG_DIR=/var/log/suricata</code></li>
<li><code>cd /opt/controlix &amp;&amp; sudo docker compose up -d</code> (le dossier est monté en lecture seule dans le collecteur).</li>
<li>Dans Controlix : <code>Solution</code> Suricata, <code>Connection</code> eve.json file, <code>Path of eve.json</code> = <code>/data/suricata/eve.json</code>.</li>
</ol>
<p>Par défaut, seules les <strong>nouvelles lignes</strong> sont lues (<code>TAIL_FROM_START=true</code> dans <code>.env</code> pour lire aussi l'existant).</p>
<h2 id="int-suricata--sortie-redis-suricata-distant">Sortie Redis (Suricata distant)</h2>
<p>Sur la machine Suricata, activez la sortie Redis dans <code>suricata.yaml</code> :</p>
<pre><code class="language-yaml">outputs:
  - eve-log:
      enabled: yes
      filetype: redis
      redis:
        server: 127.0.0.1
        port: 6379
        mode: list
        key: suricata
</code></pre>
<p>Controlix <strong>va lire</strong> cette liste : le Redis doit donc être joignable depuis le serveur Controlix (pare-feu, mot de passe obligatoire hors réseau de confiance).</p>
<table>
<thead>
<tr>
<th>Champ Controlix</th>
<th>Valeur</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Connection</code></td>
<td>Suricata Redis output</td>
</tr>
<tr>
<td><code>Host or IP address</code> / <code>Port</code></td>
<td>Le Redis de la machine Suricata / <code>6379</code></td>
</tr>
<tr>
<td><code>Protocol</code></td>
<td><code>tcp</code> (ou <code>tls</code>)</td>
</tr>
<tr>
<td><code>Redis password</code></td>
<td>Si le Redis en a un</td>
</tr>
<tr>
<td><code>List key</code></td>
<td><code>suricata</code></td>
</tr>
<tr>
<td><code>Read from</code></td>
<td><code>tail</code> (le plus ancien d'abord, pour <code>LPUSH</code>) ou <code>head</code></td>
</tr>
<tr>
<td><code>Database</code></td>
<td><code>0</code></td>
</tr>
</tbody>
</table>
<h2 id="int-suricata--eve-par-syslog">EVE par Syslog</h2>
<p>Sur la machine Suricata :</p>
<pre><code class="language-yaml">outputs:
  - eve-log:
      enabled: yes
      filetype: syslog
      identity: suricata
      facility: local5
      level: Info
</code></pre>
<p>Puis envoyez ce journal à Controlix avec rsyslog (<code>*.* @@IP_DE_CONTROLIX:514</code>). Dans Controlix : <code>Connection</code> EVE over syslog, <code>IP address of the device (its source address)</code> = l'IP de la machine Suricata, <code>Protocol</code> <code>tcp</code> ou <code>udp</code>.</p>
<h2 id="int-suricata--verifier">Vérifier</h2>
<ul>
<li>Gravité : alerte Suricata de gravité 1 → <code>high</code>, 2 → <code>medium</code>, 3 → <code>low</code>.</li>
<li><strong>Events</strong> : type <code>ids_alert</code>, avec signature, IP et ports.</li>
<li>Règle livrée utile : <code>IDS_HIGH_SEVERITY</code> ; les alertes IDS se corrèlent avec celles des agents dans les incidents.</li>
</ul>
<h2 id="int-suricata--problemes-frequents">Problèmes fréquents</h2>
<table>
<thead>
<tr>
<th>Symptôme</th>
<th>Cause</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>Fichier introuvable</td>
<td>Dossier non monté</td>
<td><code>SURICATA_LOG_DIR</code> puis <code>docker compose up -d</code></td>
</tr>
<tr>
<td>Permission refusée</td>
<td>Fichier protégé</td>
<td>Ajustez <code>COLLECTOR_USER</code> ou les droits du fichier</td>
</tr>
<tr>
<td>Redis : connexion refusée</td>
<td>Pare-feu / mot de passe</td>
<td>Testez <code>redis-cli -h IP -a MOTDEPASSE ping</code> depuis le serveur Controlix</td>
</tr>
<tr>
<td>Rien d'affiché</td>
<td>Suricata n'a pas d'alerte</td>
<td>Générez du trafic de test (règle ET/ local)</td>
</tr>
</tbody>
</table><div class="pn"><a href="#docs-int-wazuh"><small>Précédent</small>Wazuh</a><a class="next" href="#docs-int-snort"><small>Suivant</small>Snort</a></div></article><article class="doc" id="doc-int-snort" data-slug="int-snort" data-title="Snort" hidden><div class="crumb">Intégrations</div><h1>Snort</h1><p style="margin-top:0">Lire les alertes de Snort par fichier (alert_fast, alert_json) ou par Syslog.</p>
<p>Deux modes : <strong>fichier</strong> ou <strong>Syslog</strong>. Le Syslog est le plus simple dès que Snort n'est pas sur le même serveur.</p>
<h2 id="int-snort--syslog-recommande">Syslog (recommandé)</h2>
<p>Sur Snort, activez la sortie Syslog (<code>alert_syslog</code>) et envoyez le journal à Controlix :</p>
<pre><code class="language-text"># snort.lua
alert_syslog = { }

# /etc/rsyslog.d/controlix.conf
*.* @@IP_DE_CONTROLIX:514
</code></pre>
<p>Dans Controlix : <code>Solution</code> Snort, <code>Connection</code> Syslog, <code>IP address of the device (its source address)</code> = l'IP de la machine Snort, <code>Protocol</code> <code>tcp</code>, <code>Device name</code> au choix.</p>
<h2 id="int-snort--fichier-alert-fast-ou-alert-json">Fichier (<code>alert_fast</code> ou <code>alert_json</code>)</h2>
<p>Seuls deux dossiers sont montés dans le collecteur : <code>data/suricata</code> et <code>data/wazuh</code> (voir les variables <code>SURICATA_LOG_DIR</code> et <code>WAZUH_LOG_DIR</code>). Pour lire un fichier Snort, faites-le donc <strong>apparaître dans l'un d'eux</strong> :</p>
<pre><code class="language-bash"># Snort sur le même serveur : le fichier est copié ou lié dans le dossier monté
sudo ln -f /var/log/snort/alert_fast.txt /opt/controlix/data/suricata/snort-alert.txt
</code></pre>
<p>Dans Controlix : <code>Connection</code> alert file, <code>Path of the alert file</code> = <code>/data/suricata/snort-alert.txt</code>.</p>
<aside class="callout c-attention">
<p><strong>Attention</strong> Un lien symbolique ne traverse pas le montage du conteneur : utilisez un lien physique (<code>ln</code>) sur le même disque, ou une copie régulière.</p>
</aside>
<h2 id="int-snort--verifier">Vérifier</h2>
<p><strong>Events</strong> : événements d'alerte Snort avec signature, IP et ports ; ils se corrèlent avec les autres sources.</p>
<h2 id="int-snort--problemes-frequents">Problèmes fréquents</h2>
<table>
<thead>
<tr>
<th>Symptôme</th>
<th>Cause</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>Statut <code>waiting</code></td>
<td>Aucune alerte reçue</td>
<td>Générez du trafic qui déclenche une règle Snort</td>
</tr>
<tr>
<td>Rien ne vient en Syslog</td>
<td>Mauvaise adresse source déclarée, ou pare-feu</td>
<td>Déclarez l'IP <strong>vue</strong> par Controlix ; ouvrez 514</td>
</tr>
<tr>
<td>Fichier introuvable</td>
<td>Chemin hors des dossiers montés</td>
<td>Utilisez <code>/data/suricata/…</code> comme ci-dessus</td>
</tr>
</tbody>
</table><div class="pn"><a href="#docs-int-suricata"><small>Précédent</small>Suricata</a><a class="next" href="#docs-int-pfsense"><small>Suivant</small>pfSense</a></div></article><article class="doc" id="doc-int-pfsense" data-slug="int-pfsense" data-title="pfSense" hidden><div class="crumb">Intégrations</div><h1>pfSense</h1><p style="margin-top:0">Recevoir les journaux de pare-feu (filterlog) de pfSense en Syslog.</p>
<p>pfSense <strong>envoie</strong> ses journaux de pare-feu à Controlix en Syslog ; Controlix les analyse (<code>filterlog</code>) et détecte scans, refus répétés et trafic anormal.</p>
<h2 id="int-pfsense--1-configurer-pfsense">1. Configurer pfSense</h2>
<p>Interface pfSense : <strong>Status › System Logs › Settings › Remote Logging</strong> :</p>
<table>
<thead>
<tr>
<th>Réglage</th>
<th>Valeur</th>
</tr>
</thead>
<tbody>
<tr>
<td>Enable Remote Logging</td>
<td>coché</td>
</tr>
<tr>
<td>Remote log servers</td>
<td><code>IP_DE_CONTROLIX:514</code> (l'adresse de <strong>votre</strong> serveur)</td>
</tr>
<tr>
<td>Remote Syslog Contents</td>
<td>au minimum <strong>Firewall Events</strong> (ajoutez System Events pour les connexions à l'interface)</td>
</tr>
<tr>
<td>Protocole</td>
<td>UDP (par défaut) ou TCP</td>
</tr>
</tbody>
</table>
<p>Enregistrez. Dans les règles de pare-feu dont vous voulez la trace, cochez <strong>Log packets that are handled by this rule</strong>.</p>
<h2 id="int-pfsense--2-ouvrir-le-port-cote-controlix">2. Ouvrir le port côté Controlix</h2>
<p>Le serveur Controlix doit accepter UDP/TCP 514 depuis l'IP de pfSense (pare-feu du serveur). L'installeur a déjà ouvert la réception ; vérifiez <code>SYSLOG_ALLOWED_NETS</code> si pfSense est hors des réseaux privés.</p>
<h2 id="int-pfsense--3-declarer-dans-controlix">3. Déclarer dans Controlix</h2>
<table>
<thead>
<tr>
<th>Champ</th>
<th>Valeur</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Solution</code></td>
<td>pfSense</td>
</tr>
<tr>
<td><code>Connection</code></td>
<td>Syslog</td>
</tr>
<tr>
<td><code>Name</code></td>
<td>pfSense Siège</td>
</tr>
<tr>
<td><code>IP address of the device (its source address)</code></td>
<td>L'IP de pfSense <strong>telle que Controlix la voit</strong> (l'interface qui émet, souvent le LAN)</td>
</tr>
<tr>
<td><code>Port</code></td>
<td><code>514</code> (indicatif)</td>
</tr>
<tr>
<td><code>Protocol</code></td>
<td><code>udp</code> ou <code>tcp</code>, comme dans pfSense</td>
</tr>
<tr>
<td><code>Device name</code></td>
<td>Nom affiché si le message n'en contient pas</td>
</tr>

<p><code>Test connection</code> : il confirme que l'écouteur est actif et si des messages de cette adresse sont arrivés. Puis <code>Save</code> et <code>Connect</code>.</p>
<h2 id="int-pfsense--4-verifier">4. Vérifier</h2>
<ul>
<li><strong>Log Management</strong> : filtre <code>Source type</code> = <code>pfsense.filterlog</code> ; ouvrez une ligne pour voir le journal original.</li>
<li>Les paquets bloqués donnent des événements <code>fw_deny</code>.</li>
<li>Règle utile : <code>FIREWALL_DENY_BURST</code> (50 refus en 1 minute depuis une IP).</li>
<li><strong>Assets</strong> : déclarez le pare-feu avec sa criticité et sa zone.</li>
</ul>

</tr>
</tbody>
</table><div class="pn"><a href="#docs-int-snort"><small>Précédent</small>Snort</a><a class="next" href="#docs-int-fortigate"><small>Suivant</small>FortiGate</a></div></article><article class="doc" id="doc-int-fortigate" data-slug="int-fortigate" data-title="FortiGate" hidden><div class="crumb">Intégrations</div><h1>FortiGate</h1><p style="margin-top:0">Recevoir les journaux de trafic, de sécurité (IPS) et d&#x27;événements de FortiGate en Syslog.</p>
<p>FortiGate <strong>envoie</strong> ses journaux en Syslog ; Controlix lit le format par défaut (<code>clé=valeur</code>) pour le trafic, la sécurité (IPS) et les événements.</p>
<h2 id="int-fortigate--1-configurer-fortigate">1. Configurer FortiGate</h2>
<p>En ligne de commande (CLI) :</p>
<pre><code class="language-text">config log syslogd setting
    set status enable
    set server &quot;IP_DE_CONTROLIX&quot;
    set port 514
    set mode udp
end
</code></pre>
<p>Remplacez <code>IP_DE_CONTROLIX</code> par l'adresse de <strong>votre</strong> serveur. Utilisez <code>set mode reliable</code> pour du TCP. Laissez le format par défaut.</p>
<p>Pour journaliser le trafic, activez le <strong>log</strong> sur les politiques voulues (<em>Policy &amp; Objects › Firewall Policy › Log Allowed Traffic / Log Violation Traffic</em>).</p>

</table><div class="pn"><a href="#docs-int-pfsense"><small>Précédent</small>pfSense</a><a class="next" href="#docs-int-syslog"><small>Suivant</small>Syslog et équipements réseau</a></div></article><article class="doc" id="doc-int-syslog" data-slug="int-syslog" data-title="Syslog et équipements réseau" hidden><div class="crumb">Intégrations</div><h1>Syslog et équipements réseau</h1><p style="margin-top:0">Serveurs Linux, routeurs, commutateurs : tout ce qui sait envoyer du Syslog.</p>
<p>Trois entrées du catalogue, <strong>même mécanisme</strong> : l'appareil envoie du Syslog à Controlix, vous déclarez son adresse.</p>

<tr>
<th>Entrée</th>
<th>Pour</th>
</tr>
