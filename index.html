</table><div class="pn"><a href="#docs-integrations"><small>Previous</small>Connect your tools (overview)</a><a class="next" href="#docs-int-suricata"><small>Next</small>Suricata</a></div></article><article class="doc" id="doc-int-suricata" data-slug="int-suricata" data-title="Suricata" hidden><div class="crumb">Integrations</div><h1>Suricata</h1><p style="margin-top:0">Read Suricata EVE JSON alerts through a file, a Redis list or Syslog.</p>
<p>Controlix reads Suricata's <strong>EVE JSON alerts</strong>. Three modes, from the simplest to the most flexible:</p>
<table>
<thead>
<tr>
<th>Connection</th>
<th>When to use it</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>eve.json file</strong></td>
<td>Suricata is on the <strong>same server</strong> as Controlix</td>
</tr>
<tr>
<td><strong>Suricata Redis output</strong></td>
<td>Suricata is elsewhere and pushes its alerts into a Redis list that Controlix reads</td>
</tr>
<tr>
<td><strong>EVE over syslog</strong></td>
<td>Suricata is elsewhere and sends over Syslog</td>
</tr>
</tbody>
</table>
<h2 id="int-suricata--eve-json-file-same-server"><code>eve.json</code> file (same server)</h2>
<ol>
<li>In <code>/opt/controlix/.env</code>:
   <code>bash
   SURICATA_LOG_DIR=/var/log/suricata</code></li>
<li><code>cd /opt/controlix &amp;&amp; sudo docker compose up -d</code> (the folder is mounted read-only in the collector).</li>
<li>In Controlix: <code>Solution</code> Suricata, <code>Connection</code> eve.json file, <code>Path of eve.json</code> = <code>/data/suricata/eve.json</code>.</li>
</ol>
<p>By default, only <strong>new lines</strong> are read (<code>TAIL_FROM_START=true</code> in <code>.env</code> to also read existing content).</p>
<h2 id="int-suricata--redis-output-remote-suricata">Redis output (remote Suricata)</h2>
<p>On the Suricata machine, enable the Redis output in <code>suricata.yaml</code>:</p>
<pre><code class="language-yaml">outputs:
  - eve-log:
      enabled: yes
      filetype: redis
      redis:
        server: 127.0.0.1
        port: 6379
        mode: list
        key: suricata
</code></pre>
<p>Controlix <strong>reads</strong> this list: the Redis must therefore be reachable from the Controlix server (firewall, password required outside a trusted network).</p>
<table>
<thead>
<tr>
<th>Controlix field</th>
<th>Value</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Connection</code></td>
<td>Suricata Redis output</td>
</tr>
<tr>
<td><code>Host or IP address</code> / <code>Port</code></td>
<td>The Redis on the Suricata machine / <code>6379</code></td>
</tr>
<tr>
<td><code>Protocol</code></td>
<td><code>tcp</code> (or <code>tls</code>)</td>
</tr>
<tr>
<td><code>Redis password</code></td>
<td>If the Redis has one</td>
</tr>
<tr>
<td><code>List key</code></td>
<td><code>suricata</code></td>
</tr>
<tr>
<td><code>Read from</code></td>
<td><code>tail</code> (oldest first, for <code>LPUSH</code>) or <code>head</code></td>
</tr>
<tr>
<td><code>Database</code></td>
<td><code>0</code></td>
</tr>
</tbody>
</table>
<h2 id="int-suricata--eve-over-syslog">EVE over Syslog</h2>
<p>On the Suricata machine:</p>
<pre><code class="language-yaml">outputs:
  - eve-log:
      enabled: yes
      filetype: syslog
      identity: suricata
      facility: local5
      level: Info
</code></pre>
<p>Then send this log to Controlix with rsyslog (<code>*.* @@IP_DE_CONTROLIX:514</code>). In Controlix: <code>Connection</code> EVE over syslog, <code>IP address of the device (its source address)</code> = the IP of the Suricata machine, <code>Protocol</code> <code>tcp</code> or <code>udp</code>.</p>
<h2 id="int-suricata--verify">Verify</h2>
<ul>
<li>Severity: Suricata alert severity 1 → <code>high</code>, 2 → <code>medium</code>, 3 → <code>low</code>.</li>
<li><strong>Events</strong>: type <code>ids_alert</code>, with signature, IP and ports.</li>
<li>Useful bundled rule: <code>IDS_HIGH_SEVERITY</code>; IDS alerts are correlated with agent alerts in incidents.</li>
</ul>
<h2 id="int-suricata--common-problems">Common problems</h2>
<table>
<thead>
<tr>
<th>Symptom</th>
<th>Cause</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>File not found</td>
<td>Folder not mounted</td>
<td><code>SURICATA_LOG_DIR</code> then <code>docker compose up -d</code></td>
</tr>
<tr>
<td>Permission denied</td>
<td>Protected file</td>
<td>Adjust <code>COLLECTOR_USER</code> or the file permissions</td>
</tr>
<tr>
<td>Redis: connection refused</td>
<td>Firewall / password</td>
<td>Test <code>redis-cli -h IP -a MOTDEPASSE ping</code> from the Controlix server</td>
</tr>
<tr>
<td>Nothing displayed</td>
<td>Suricata has no alert</td>
<td>Generate test traffic (ET/ or local rule)</td>
</tr>
</tbody>
</table><div class="pn"><a href="#docs-int-wazuh"><small>Previous</small>Wazuh</a><a class="next" href="#docs-int-snort"><small>Next</small>Snort</a></div></article><article class="doc" id="doc-int-snort" data-slug="int-snort" data-title="Snort" hidden><div class="crumb">Integrations</div><h1>Snort</h1><p style="margin-top:0">Read Snort alerts through a file (alert_fast, alert_json) or Syslog.</p>
<p>Two modes: <strong>file</strong> or <strong>Syslog</strong>. Syslog is the simplest whenever Snort is not on the same server.</p>
<h2 id="int-snort--syslog-recommended">Syslog (recommended)</h2>
<p>On Snort, enable the Syslog output (<code>alert_syslog</code>) and send the log to Controlix:</p>
<pre><code class="language-text"># snort.lua
alert_syslog = { }

# /etc/rsyslog.d/controlix.conf
*.* @@IP_DE_CONTROLIX:514
</code></pre>
<p>In Controlix: <code>Solution</code> Snort, <code>Connection</code> Syslog, <code>IP address of the device (its source address)</code> = the IP of the Snort machine, <code>Protocol</code> <code>tcp</code>, <code>Device name</code> of your choice.</p>
<h2 id="int-snort--file-alert-fast-or-alert-json">File (<code>alert_fast</code> or <code>alert_json</code>)</h2>
<p>Only two folders are mounted in the collector: <code>data/suricata</code> and <code>data/wazuh</code> (see the <code>SURICATA_LOG_DIR</code> and <code>WAZUH_LOG_DIR</code> variables). To read a Snort file, you must therefore make it <strong>appear in one of them</strong>:</p>
<pre><code class="language-bash"># Snort on the same server: the file is copied or linked into the mounted folder
sudo ln -f /var/log/snort/alert_fast.txt /opt/controlix/data/suricata/snort-alert.txt
</code></pre>
<p>In Controlix: <code>Connection</code> alert file, <code>Path of the alert file</code> = <code>/data/suricata/snort-alert.txt</code>.</p>
<aside class="callout c-attention">
<p><strong>Warning</strong> A symbolic link does not cross the container mount: use a hard link (<code>ln</code>) on the same disk, or a regular copy.</p>
</aside>
<h2 id="int-snort--verify">Verify</h2>
<p><strong>Events</strong>: Snort alert events with signature, IP and ports; they are correlated with the other sources.</p>
<h2 id="int-snort--common-problems">Common problems</h2>
<table>
<thead>
<tr>
<th>Symptom</th>
<th>Cause</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>Status <code>waiting</code></td>
<td>No alert received</td>
<td>Generate traffic that triggers a Snort rule</td>
</tr>
<tr>
<td>Nothing arrives over Syslog</td>
<td>Wrong source address declared, or firewall</td>
<td>Declare the IP <strong>seen</strong> by Controlix; open 514</td>
</tr>
<tr>
<td>File not found</td>
<td>Path outside the mounted folders</td>
<td>Use <code>/data/suricata/…</code> as above</td>
</tr>
</tbody>
</table><div class="pn"><a href="#docs-int-suricata"><small>Previous</small>Suricata</a><a class="next" href="#docs-int-pfsense"><small>Next</small>pfSense</a></div></article><article class="doc" id="doc-int-pfsense" data-slug="int-pfsense" data-title="pfSense" hidden><div class="crumb">Integrations</div><h1>pfSense</h1><p style="margin-top:0">Receive pfSense firewall logs (filterlog) over Syslog.</p>
<p>pfSense <strong>sends</strong> its firewall logs to Controlix over Syslog; Controlix parses them (<code>filterlog</code>) and detects scans, repeated denials and abnormal traffic.</p>
<h2 id="int-pfsense--1-configure-pfsense">1. Configure pfSense</h2>
<p>pfSense interface: <strong>Status › System Logs › Settings › Remote Logging</strong>:</p>
<table>
<thead>
<tr>
<th>Setting</th>
<th>Value</th>
</tr>
</thead>
<tbody>
<tr>
<td>Enable Remote Logging</td>
<td>checked</td>
</tr>
<tr>
<td>Remote log servers</td>
<td><code>IP_DE_CONTROLIX:514</code> (the address of <strong>your</strong> server)</td>
</tr>
<tr>
<td>Remote Syslog Contents</td>
<td>at least <strong>Firewall Events</strong> (add System Events for interface logins)</td>
</tr>
<tr>
<td>Protocol</td>
<td>UDP (default) or TCP</td>
</tr>
</tbody>
</table>
<p>Save. On the firewall rules you want to trace, check <strong>Log packets that are handled by this rule</strong>.</p>
<h2 id="int-pfsense--2-open-the-port-on-the-controlix-side">2. Open the port on the Controlix side</h2>
<p>The Controlix server must accept UDP/TCP 514 from the pfSense IP (server firewall). The installer has already opened reception; check <code>SYSLOG_ALLOWED_NETS</code> if pfSense is outside the private networks.</p>
<h2 id="int-pfsense--3-declare-it-in-controlix">3. Declare it in Controlix</h2>
<table>
<thead>
<tr>
<th>Field</th>
<th>Value</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Solution</code></td>
<td>pfSense</td>
</tr>
<tr>
<td><code>Connection</code></td>
<td>Syslog</td>
</tr>
<tr>
<td><code>Name</code></td>
<td>pfSense HQ</td>
</tr>
<tr>
<td><code>IP address of the device (its source address)</code></td>
<td>The pfSense IP <strong>as Controlix sees it</strong> (the sending interface, often the LAN)</td>
</tr>
<tr>
<td><code>Port</code></td>
<td><code>514</code> (indicative)</td>
</tr>
<tr>
<td><code>Protocol</code></td>
<td><code>udp</code> or <code>tcp</code>, as in pfSense</td>
</tr>
<tr>
<td><code>Device name</code></td>
<td>Name displayed if the message does not contain one</td>
</tr>
</tbody>
</table>
<p><code>Test connection</code>: it confirms that the listener is active and whether messages from this address have arrived. Then <code>Save</code> and <code>Connect</code>.</p>
<h2 id="int-pfsense--4-verify">4. Verify</h2>
<ul>
<li><strong>Log Management</strong>: <code>Source type</code> filter = <code>pfsense.filterlog</code>; open a row to see the original log.</li>
<li>Blocked packets produce <code>fw_deny</code> events.</li>
<li>Useful rule: <code>FIREWALL_DENY_BURST</code> (50 denials in 1 minute from one IP).</li>
<li><strong>Assets</strong>: declare the firewall with its criticality and zone.</li>
</ul>
<h2 id="int-pfsense--common-problems">Common problems</h2>
<table>
<thead>
<tr>
<th>Symptom</th>
<th>Cause</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>Nothing arrives</td>
<td>Wrong IP declared</td>
<td>pfSense sends from the IP of the outgoing interface: declare that one</td>
</tr>
<tr>
<td>Nothing arrives (cloud / NAT)</td>
<td>Translated address</td>
<td>Declare the address seen by the server (<code>tcpdump -ni any port 514</code>)</td>
</tr>
<tr>
<td>Messages ignored</td>
<td>Network not allowed</td>
<td>Add the network to <code>SYSLOG_ALLOWED_NETS</code></td>
</tr>
<tr>
<td>Few events</td>
<td>Rules without logging</td>
<td>Check "Log packets" on the desired rules</td>
</tr>
</tbody>
</table><div class="pn"><a href="#docs-int-snort"><small>Previous</small>Snort</a><a class="next" href="#docs-int-fortigate"><small>Next</small>FortiGate</a></div></article><article class="doc" id="doc-int-fortigate" data-slug="int-fortigate" data-title="FortiGate" hidden><div class="crumb">Integrations</div><h1>FortiGate</h1><p style="margin-top:0">Receive FortiGate traffic, security (IPS) and event logs over Syslog.</p>
<p>FortiGate <strong>sends</strong> its logs over Syslog; Controlix reads the default format (<code>key=value</code>) for traffic, security (IPS) and events.</p>
<h2 id="int-fortigate--1-configure-fortigate">1. Configure FortiGate</h2>
<p>On the command line (CLI):</p>
<pre><code class="language-text">config log syslogd setting
    set status enable
    set server &quot;IP_DE_CONTROLIX&quot;
    set port 514
    set mode udp
end
</code></pre>
<p>Replace <code>IP_DE_CONTROLIX</code> with the address of <strong>your</strong> server. Use <code>set mode reliable</code> for TCP. Leave the default format.</p>
<p>To log traffic, enable <strong>log</strong> on the desired policies (<em>Policy &amp; Objects › Firewall Policy › Log Allowed Traffic / Log Violation Traffic</em>).</p>
<h2 id="int-fortigate--2-declare-it-in-controlix">2. Declare it in Controlix</h2>
<table>
<thead>
<tr>
<th>Field</th>
<th>Value</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Solution</code></td>
<td>FortiGate</td>
</tr>
<tr>
<td><code>Connection</code></td>
<td>Syslog</td>
</tr>
<tr>
<td><code>Name</code></td>
<td>FortiGate HQ</td>
</tr>
<tr>
<td><code>IP address of the device (its source address)</code></td>
<td>The FortiGate's <strong>sending</strong> IP (the interface that reaches Controlix)</td>
</tr>
<tr>
<td><code>Port</code> / <code>Protocol</code></td>
<td><code>514</code> / <code>udp</code> or <code>tcp</code></td>
</tr>
<tr>
<td><code>Device name</code></td>
<td>Displayed name</td>
</tr>
</tbody>
</table>
<p><code>Test connection</code> → <code>Save</code> → <code>Connect</code>.</p>
<h2 id="int-fortigate--3-verify">3. Verify</h2>
<ul>
<li><strong>Events</strong> / <strong>Log Management</strong>: FortiGate events; denied traffic produces <code>fw_deny</code> and IPS detections produce <code>ids_alert</code>.</li>
<li>Useful rule: <code>FIREWALL_DENY_BURST</code>.</li>
<li><strong>Assets</strong>: declare the FortiGate with its criticality.</li>
</ul>
<h2 id="int-fortigate--common-problems">Common problems</h2>
<table>
<thead>
<tr>
<th>Symptom</th>
<th>Cause</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>Nothing is displayed</td>
<td>Declared source IP is wrong</td>
<td>On FortiGate: <code>execute ping-options source</code> or check the outgoing interface</td>
</tr>
<tr>
<td>Nothing arrives</td>
<td>Port filtered</td>
<td>Open UDP/TCP 514 to the Controlix server</td>
</tr>
<tr>
<td>Missing fields</td>
<td>Log format changed</td>
<td>Go back to the default format (<code>set format default</code>)</td>
</tr>
</tbody>
</table><div class="pn"><a href="#docs-int-pfsense"><small>Previous</small>pfSense</a><a class="next" href="#docs-int-syslog"><small>Next</small>Syslog and network devices</a></div></article><article class="doc" id="doc-int-syslog" data-slug="int-syslog" data-title="Syslog and network devices" hidden><div class="crumb">Integrations</div><h1>Syslog and network devices</h1><p style="margin-top:0">Linux servers, routers, switches: anything that can send Syslog.</p>
<p>Three catalog entries, <strong>same mechanism</strong>: the device sends Syslog to Controlix, and you declare its address.</p>
<table>
<thead>
<tr>
<th>Entry</th>
<th>For</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Syslog source</strong></td>
<td>Any device or server that can send Syslog</td>
</tr>
<tr>
<td><strong>Linux server (syslog)</strong></td>
<td>A Linux server through <code>rsyslog</code></td>
</tr>
<tr>
<td><strong>Network device</strong></td>
<td>Routers, switches, appliances</td>
</tr>
</tbody>
</table>
<aside class="callout c-note">
<p><strong>Note</strong> For a Linux or Windows server, the <strong>Controlix agent</strong> is preferable: it adds inventory, file integrity and a lossless local queue. Use Syslog when the agent is not possible.</p>
</aside>
<h2 id="int-syslog--linux-server-with-rsyslog">Linux server with rsyslog</h2>
<pre><code class="language-text"># /etc/rsyslog.d/controlix.conf
*.* @@IP_DE_CONTROLIX:514        # TCP; a single @ for UDP
</code></pre>
<pre><code class="language-bash">sudo systemctl restart rsyslog
</code></pre>
<h2 id="int-syslog--network-device">Network device</h2>
<p>In its configuration, add a "remote Syslog server": address <code>IP_DE_CONTROLIX</code>, port <code>514</code>, UDP or TCP, level "informational" or higher.</p>
<h2 id="int-syslog--declare-it-in-controlix">Declare it in Controlix</h2>
<table>
<thead>
<tr>
<th>Field</th>
<th>Value</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Solution</code></td>
<td>Syslog source, Linux server or Network device</td>
</tr>
<tr>
<td><code>Connection</code></td>
<td>Syslog</td>
</tr>
<tr>
<td><code>Name</code></td>
<td>"Branch router", "Web server 1"…</td>
</tr>
<tr>
<td><code>IP address of the device (its source address)</code></td>
<td>The device's <strong>sending</strong> address</td>
</tr>
<tr>
<td><code>Port</code> / <code>Protocol</code></td>
<td><code>514</code> / <code>udp</code> or <code>tcp</code></td>
</tr>
<tr>
<td><code>Device name</code></td>
<td>Displayed when the message does not contain one</td>
</tr>
</tbody>
</table>
<h2 id="int-syslog--test-without-a-device">Test without a device</h2>
<p>From a machine on the network (address declared as the source):</p>
<pre><code class="language-bash">for i in $(seq 1 12); do
  echo &quot;&lt;38&gt;sshd[812]: Failed password for root from 192.168.1.45 port 4000$i ssh2&quot; \
    | nc -u -w1 IP_DE_CONTROLIX 514
done
</code></pre>
<p>12 SSH failures within a few seconds trigger the <code>SSH_BRUTE_FORCE</code> rule: an alert appears in <strong>Alerts</strong>.</p>
<h2 id="int-syslog--rules-to-remember">Rules to remember</h2>
<ul>
<li>Only the networks in <code>SYSLOG_ALLOWED_NETS</code> and declared devices are accepted.</li>
<li>Behind a NAT or a relay, declare the relay's address.</li>
<li>No authentication or TLS: filter port 514 with the firewall.</li>
</ul><div class="pn"><a href="#docs-int-fortigate"><small>Previous</small>FortiGate</a><a class="next" href="#docs-int-custom"><small>Next</small>Custom JSON source</a></div></article><article class="doc" id="doc-int-custom" data-slug="int-custom" data-title="Custom JSON source" hidden><div class="crumb">Integrations</div><h1>Custom JSON source</h1><p style="margin-top:0">Poll an HTTP(S) API that returns JSON, or read a JSON-lines file, without writing code.</p>
<p>For an application that exposes its events as JSON, or a file of JSON lines.</p>
<h2 id="int-custom--poll-an-http-s-api">Poll an HTTP(S) API</h2>
<p><code>Solution</code> Custom, <code>Connection</code> <strong>HTTP(S) JSON polling</strong> (<code>GET</code> request).</p>
<table>
<thead>
<tr>
<th>Field</th>
<th>Role</th>
<th>Example</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Host or IP address</code>, <code>Port</code>, <code>Protocol</code></td>
<td>Where to poll</td>
<td><code>api.mon-appli.local</code>, <code>443</code>, <code>https</code></td>
</tr>
<tr>
<td><code>Path</code></td>
<td>URL path</td>
<td><code>/api/v1/audit</code></td>
</tr>
<tr>
<td><code>Events array (dotted path)</code></td>
<td>Where the list of events is in the response; empty if the response is the list</td>
<td><code>data.items</code></td>
</tr>
<tr>
<td><code>Unique id field</code></td>
<td>Unique field so the same events are not read again</td>
<td><code>id</code></td>
</tr>
<tr>
<td><code>Query parameter for 'since'</code></td>
<td>Name of the parameter used to request only new items</td>
<td><code>since</code></td>
</tr>
<tr>
<td><code>Timestamp field</code></td>
<td>Timestamp field</td>
<td><code>timestamp</code></td>
</tr>
<tr>
<td><code>Poll interval (s)</code></td>
<td>Polling frequency</td>
<td><code>30</code></td>
</tr>
</tbody>
</table>
<h3 id="int-custom--authentication-one-mode-is-enough">Authentication (one mode is enough)</h3>
<table>
<thead>
<tr>
<th>Field</th>
<th>Mode</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Bearer token</code></td>
<td><code>Authorization: Bearer …</code></td>
</tr>
<tr>
<td><code>Basic user</code> + <code>Basic password</code></td>
<td>Basic authentication</td>
</tr>
<tr>
<td><code>Custom header name</code> + <code>Custom header value</code></td>
<td>A custom header (API key)</td>
</tr>
</tbody>
</table>
<p>The TLS fields (verification, SHA-256 fingerprint, CA) are set as for the other solutions.</p>
<h3 id="int-custom--example">Example</h3>
<p>The API returns:</p>
<pre><code class="language-json">{ &quot;data&quot;: { &quot;items&quot;: [
  { &quot;id&quot;: &quot;a1&quot;, &quot;timestamp&quot;: &quot;2026-11-07T10:02:11Z&quot;, &quot;user&quot;: &quot;alice&quot;, &quot;action&quot;: &quot;login_failed&quot;, &quot;src&quot;: &quot;10.0.0.8&quot; }
] } }
</code></pre>
<p>Settings: <code>Path</code> <code>/api/v1/audit</code>, <code>Events array</code> <code>data.items</code>, <code>Unique id field</code> <code>id</code>, <code>Timestamp field</code> <code>timestamp</code>.</p>
<h2 id="int-custom--read-a-json-lines-file">Read a JSON-lines file</h2>
<p><code>Connection</code> <strong>JSON-lines file</strong>, <code>Path of the file</code>: an absolute path <strong>in a mounted folder</strong> (<code>/data/suricata/…</code> or <code>/data/wazuh/…</code>, see <a href="#docs-int-snort">Snort</a> for the method). Each line of the file is a JSON object.</p>
<h2 id="int-custom--what-each-event-becomes">What each event becomes</h2>
<p>The event is normalized into the common schema, with the original JSON kept in the raw log: find it in <strong>Log Management</strong>. For precise rules on your fields, add a parser or a rule: <a href="#docs-collecte-normalisation">Architecture, collection and normalization</a>.</p>
<h2 id="int-custom--common-problems">Common problems</h2>
<table>
<thead>
<tr>
<th>Symptom</th>
<th>Cause</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>Status <code>error</code>, 401/403</td>
<td>Credentials</td>
<td>Check the token or the account</td>
</tr>
<tr>
<td>No events, status <code>waiting</code></td>
<td>Incorrect <code>Events array</code></td>
<td>Test with <code>curl</code> and compare the path it points to</td>
</tr>
<tr>
<td>The same events keep coming back</td>

<td>Specify a unique field</td>
</tr>
<tr>
<td>Certificate rejected</td>
<td>Self-signed</td>
<td>SHA-256 fingerprint or CA</td>
</tr>
</tbody>
</table><div class="pn"><a href="#docs-int-syslog"><small>Previous</small>Syslog and network devices</a><a class="next" href="#docs-alertes-incidents"><small>Next</small>Alerts and incidents</a></div></article><article class="doc" id="doc-alertes-incidents" data-slug="alertes-incidents" data-title="Alerts and incidents" hidden><div class="crumb">Operations</div><h1>Alerts and incidents</h1><p style="margin-top:0">Life cycle of an alert and an incident, statuses and investigation best practices.</p>
<p>An <strong>alert</strong> is a detection (rule or AI). An <strong>incident</strong> groups the alerts linked by the same source, the same target or the same user within a 30-minute window. An attacker does not trigger one alert, they trigger several: Controlix links them and says why it is serious.</p>
<h2 id="alertes-incidents--alert-statuses">Alert statuses</h2>
<p><code>NEW</code> → <code>OPEN</code> → <code>REVIEW</code> → <code>CLOSED</code>, or <code>FALSE_POSITIVE</code>. Closing an alert lowers the risk of the asset concerned.</p>
<h2 id="alertes-incidents--incident-statuses">Incident statuses</h2>
<p><code>NEW</code>, <code>INVESTIGATING</code>, <code>CONTAINED</code>, <code>RESOLVED</code>, <code>FALSE_POSITIVE</code>. A resolved incident no longer receives new alerts: a new attack opens a new incident.</p>
<h2 id="alertes-incidents--when-does-an-incident-open">When does an incident open?</h2>
<p>Only for a <strong>HIGH or CRITICAL</strong> risk, or for a detection of critical severity. An isolated low-risk alert stays an alert: this is intentional, so as not to drown the analyst.</p>
<table>
<thead>
<tr>
<th>Risk level</th>
<th>Score</th>
</tr>
</thead>
<tbody>
<tr>
<td>LOW</td>
<td>0 – 20</td>
</tr>
<tr>
<td>MEDIUM</td>
<td>21 – 40</td>
</tr>
<tr>
<td>HIGH</td>
<td>41 – 70</td>
</tr>
<tr>
<td>CRITICAL</td>
<td>71 – 100</td>
</tr>
</tbody>
</table>
<h2 id="alertes-incidents--read-an-alert">Read an alert</h2>
<ul>
<li><strong>Description</strong> and number of events.</li>
<li><strong>Why this risk score</strong>: severity, confidence, asset criticality, zone, neighboring alerts, pattern bonus, AI anomaly.</li>
<li><strong>Source events</strong>: one click leads to the original log.</li>
<li><strong>MITRE technique</strong> and the rule's recommendations.</li>
</ul>
<h2 id="alertes-incidents--read-an-incident">Read an incident</h2>
<ul>
<li><strong>Summary</strong>: affected assets, source and destination IPs, detection sources, MITRE techniques.</li>
<li><strong>Correlated alerts</strong>: the alerts that make it up, possibly from several sources.</li>
<li><strong>Timeline and analyst notes</strong>: timeline (attached alerts, status changes, recognized attack pattern) and your notes. Write down what you did: it is the memory of the investigation.</li>
</ul>
<h2 id="alertes-incidents--best-practices">Best practices</h2>
<ul>
<li>Handle CRITICAL incidents on critical assets first.</li>
<li>Note every action; change the status as you go.</li>
<li>If a rule mostly produces false positives, tune it rather than closing alerts over and over (<a href="#docs-detection-correlation">Detection and correlation</a>).</li>
<li>If a workstation is compromised: <strong>Agents › Revoke</strong> cuts its key immediately.</li>
</ul>
<aside class="callout c-note">
<p><strong>Note</strong> Controlix <strong>detects and alerts</strong>; it blocks nothing. Blocking (firewall, IPS) remains your responsibility.</p>
</aside><div class="pn"><a href="#docs-int-custom"><small>Previous</small>Custom JSON source</a><a class="next" href="#docs-sauvegarde-mise-a-jour"><small>Next</small>Backup and update</a></div></article><article class="doc" id="doc-sauvegarde-mise-a-jour" data-slug="sauvegarde-mise-a-jour" data-title="Backup and update" hidden><div class="crumb">Operations</div><h1>Backup and update</h1><p style="margin-top:0">Back up, restore, and update the server and agents without losing data.</p>
<h2 id="sauvegarde-mise-a-jour--back-up">Back up</h2>
<pre><code class="language-bash">cd /opt/controlix
sudo ./install.sh backup
</code></pre>
<p>The archive contains the PostgreSQL database, <code>.env</code>, the certificates and the configuration. If the stack is stopped, <code>backup</code> starts PostgreSQL only. OpenSearch events are not included (short retention by design).</p>
<p>Recommended daily backup (cron):</p>
<pre><code class="language-bash">0 3 * * * /opt/controlix/install.sh backup --yes
</code></pre>
<aside class="callout c-astuce">
<p><strong>Tip</strong> Keep a copy <strong>off the server</strong>. <code>.env</code> contains the <code>SECRETS_KEY</code> and <code>AGENT_SIGNING_KEY</code> keys: treat the archive as a secret.</p>
</aside>
<h2 id="sauvegarde-mise-a-jour--restore">Restore</h2>
<pre><code class="language-bash">sudo ./install.sh restore &lt;archive&gt;
</code></pre>
<p>Restores the database, configuration and certificates.</p>
<h2 id="sauvegarde-mise-a-jour--update-the-server">Update the server</h2>
<pre><code class="language-bash">curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo sh -s -- update
</code></pre>
<p>The command:</p>
<ol>
<li>downloads the latest archive and <strong>verifies its SHA-256 checksum</strong>;</li>
<li>makes an automatic <strong>backup</strong>;</li>
<li>pulls the new images, restarts the services and applies the database migrations;</li>
<li>runs the self-test.</li>
</ol>
<p><code>update</code> never modifies <code>.env</code> or your data. For a specific version: <code>update --version 1.0.1</code>. Check: <code>sudo /opt/controlix/install.sh status</code> shows all services healthy and <strong>System Health</strong> is green. If something goes wrong: <code>sudo /opt/controlix/install.sh restore backups/&lt;latest&gt;.tar.gz</code>.</p>
<h2 id="sauvegarde-mise-a-jour--update-the-agents">Update the agents</h2>
<p>Agents are updated through the server, with a <strong>signed</strong> binary (Ed25519):</p>
<ol>
<li>The server update publishes the new binaries and their manifest (the server signs them with your <code>AGENT_SIGNING_KEY</code>).</li>
<li><strong>Agents</strong>: send the <strong>Update</strong> command (one host or all).</li>
<li>The agent verifies the signature and fingerprint, replaces its executable and restarts; if this fails, it keeps the old version.</li>
</ol>
<h2 id="sauvegarde-mise-a-jour--best-practices">Best practices</h2>
<ul>
<li>Update the server first, then the agents.</li>
<li>Back up before every update.</li>
<li>Keep <code>AGENT_SIGNING_KEY</code> and <code>SECRETS_KEY</code>.</li>
<li>After a power outage: <code>systemctl start controlix</code>; the Redis queues (AOF) and the agents' buffers ensure recovery without loss.</li>
</ul><div class="pn"><a href="#docs-alertes-incidents"><small>Previous</small>Alerts and incidents</a><a class="next" href="#docs-depannage"><small>Next</small>Troubleshooting</a></div></article><article class="doc" id="doc-depannage" data-slug="depannage" data-title="Troubleshooting" hidden><div class="crumb">Operations</div><h1>Troubleshooting</h1><p style="margin-top:0">Common symptoms, probable causes and solutions.</p>
<p>First steps:</p>
<pre><code class="language-bash">./install.sh status
./install.sh self-test
docker compose logs --tail=100 backend      # worker, collector, postgres, redis, nginx, frontend
</code></pre>
<p>Logs are rotated automatically.</p>
<table>
<thead>
<tr>
<th>Symptom</th>
<th>Probable cause</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>The installer refuses to continue</td>
<td>Existing installation</td>
<td>Expected: confirm, a backup is made before any change. Use <code>update</code></td>
</tr>
<tr>
<td>"--host is required"</td>
<td>Server address not provided</td>
<td>Add <code>--host</code> with the IP or name of <strong>your</strong> server</td>
</tr>
<tr>
<td>Download fails (download server, image registry)</td>
<td>No outbound Internet access, proxy</td>
<td>Allow the domains of the install command and of the image registry; offline installation is not supported</td>
</tr>
<tr>
<td>"checksum": nothing is installed</td>
<td>Corrupted or intercepted archive</td>
<td>Run it again; if it persists, change network</td>
</tr>
<tr>
<td><code>backend</code> restarts in a loop</td>
<td>Incomplete <code>.env</code> or invalid <code>SECRETS_KEY</code></td>
<td><code>docker compose logs backend</code>. Only regenerate the keys on a new installation</td>
</tr>
<tr>
<td><code>password authentication failed for user controlix</code></td>
<td>PostgreSQL volume created with an old password</td>
<td>Align the password (<code>ALTER USER controlix PASSWORD '…'</code> with the one in <code>.env</code>) or, on an empty installation, <code>docker compose down -v</code></td>
</tr>
<tr>
<td>Untrusted certificate in the browser</td>
<td>Private CA not installed</td>
<td>Import <code>data/tls/ca.pem</code> or provide your own certificate</td>
</tr>
<tr>
<td>Agent: "token invalid"</td>
<td>Token expired, used, or quota reached</td>
<td>Create a new token</td>
</tr>
<tr>
<td>Agent: TLS / fingerprint error</td>
<td>Wrong address or different CA</td>
<td>The address in the command must be the one in the certificates; regenerate the command</td>
</tr>
<tr>
<td>Agent "offline"</td>
<td>Service stopped, network down, key revoked</td>
<td><code>systemctl status controlix-agent</code> / <code>Get-Service ControlixAgent</code>; the agent recovers on its own and resends its buffer</td>
</tr>
<tr>
<td>No Windows data</td>
<td>Insufficient rights for the Security log</td>
<td>The service must run as <code>LocalSystem</code></td>
</tr>
<tr>
<td>Delayed events, 429</td>
<td>Ingestion queue saturated</td>
<td>System Health; nothing is lost; add CPU or a worker</td>
</tr>
<tr>
<td>Disk filling up</td>
<td>Retention too long</td>
<td>Log Management › Retention</td>
</tr>
<tr>
<td>Integration: certificate error</td>
<td>CA unknown to the collector</td>
<td>Paste the CA or the SHA-256 fingerprint</td>
</tr>
<tr>
<td>Integration: target refused</td>
<td>SSRF guard</td>
<td>Use the device's real address; adjust <code>INTERNAL_SUBNET</code></td>
</tr>
<tr>
<td>Integration: "SECRETS_KEY missing"</td>
<td>Key absent</td>
<td>Set it in <code>.env</code>, restart</td>
</tr>
<tr>
<td>Syslog: nothing appears</td>
<td>Firewall or address not allowed</td>
<td>Open UDP/TCP 514; declare the device or add its network to <code>SYSLOG_ALLOWED_NETS</code>; check NAT</td>
</tr>
<tr>
<td>Custom rule has no effect</td>
<td>Worker not restarted or invalid rule</td>
<td>Validate in Correlation, then <code>docker compose restart worker</code></td>
</tr>
<tr>
<td>Alert without an incident</td>
<td>Only HIGH/CRITICAL open an incident</td>
<td>Adjust the rule's severity</td>
</tr>
<tr>
<td><code>install.sh install</code>: "database dump failed"</td>
<td>Stack stopped</td>
<td>Fixed: the backup starts PostgreSQL alone, or switches to "configuration only" mode during installation</td>
</tr>
<tr>
<td><code>self-test</code>: "dashboard is served" fails, or <strong>502</strong> error after an update</td>
<td>nginx kept the old address of a recreated container</td>
<td><code>docker compose restart nginx</code>. Fixed in the installer: nginx is restarted automatically after <code>install</code>, <code>update</code> and <code>restore</code></td>
</tr>
<tr>
<td><code>self-test</code>: "an unknown enrollment token is refused"</td>
<td>Old <code>install.sh</code>: fake token too short (the server answers 422 instead of 401)</td>
<td>Use installer version 1.0.1 or later</td>
</tr>
<tr>
<td><code>docker compose restart</code> or <code>up</code>: "required variable … is missing"</td>
<td>Command run outside the installation folder, or <code>.env</code> missing</td>
<td>Change to the installation folder (the one that contains <code>.env</code>)</td>
</tr>
</tbody>
</table>
<h2 id="depannage--for-support">For support</h2>
<p>Provide <code>./install.sh status</code>, <code>docker compose ps</code> and the latest logs, <strong>without</strong> the <code>.env</code> file.</p><div class="pn"><a href="#docs-sauvegarde-mise-a-jour"><small>Previous</small>Backup and update</a><a class="next" href="#docs-utilisateurs-roles"><small>Next</small>Users and roles</a></div></article><article class="doc" id="doc-utilisateurs-roles" data-slug="utilisateurs-roles" data-title="Users and roles" hidden><div class="crumb">Administration</div><h1>Users and roles</h1><p style="margin-top:0">Accounts, sign-in with username or email, built-in roles and custom roles.</p>
<h2 id="utilisateurs-roles--first-administrator">First administrator</h2>
<p>It is created <strong>at installation</strong>: the installer asks for a username, email and password (12 characters minimum). None of this is written to <code>.env</code>. To add one afterwards:</p>
<pre><code class="language-bash">sudo ./scripts/create-admin.sh
</code></pre>
<h2 id="utilisateurs-roles--sign-in">Sign in</h2>
<p>With the <strong>username or email</strong> and the password. After 5 failed attempts within one minute, sign-in is briefly suspended: this is a protection, not an outage. The session is a 15-minute access token renewed by an HttpOnly cookie (7 days).</p>
<h2 id="utilisateurs-roles--built-in-roles">Built-in roles</h2>
<table>
<thead>
<tr>
<th>Role</th>
<th>Can do</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>VIEWER</code></td>
<td>View everything, no action buttons</td>
</tr>
<tr>
<td><code>SOC_ANALYST</code></td>
<td>+ change the status of alerts and incidents, notes, create assets</td>
</tr>
<tr>
<td><code>SECURITY_MANAGER</code></td>
<td>Same as the analyst, plus response actions</td>
</tr>
<tr>
<td><code>ADMIN</code></td>
<td>Everything: users, roles, agents, integrations, rules, retention</td>
</tr>
</tbody>
</table>
<h2 id="utilisateurs-roles--custom-roles">Custom roles</h2>
<p>An administrator can create their own roles in <strong>Settings › Roles</strong>: a name (lowercase letters, digits, <code>_</code>) and a set of <strong>permissions</strong> among <code>READ</code>, <code>WRITE</code>, <code>INVESTIGATE</code>, <code>RESPOND</code>, <code>ADMIN</code>. Built-in roles can be neither modified nor deleted; a custom role still assigned to a user cannot be deleted.</p>
<h2 id="utilisateurs-roles--create-and-edit-an-account">Create and edit an account</h2>
<p><strong>Settings › Users › Create</strong>: username (<code>a-z</code>, <code>0-9</code>, <code>.</code>, <code>_</code>, <code>-</code>, 3 to 64 characters), email, password, role. You can change the role, disable an account or reset its password.</p>
<aside class="callout c-attention">
<p><strong>Warning</strong> The last active administrator can be neither demoted nor disabled: the platform refuses the action so that you never lose access.</p>
</aside>
<h2 id="utilisateurs-roles--the-server-decides">The server decides</h2>
<p>Forbidden buttons are hidden, <strong>and</strong> the server refuses the action even if it is attempted directly (HTTP 403, recorded in the audit log).</p><div class="pn"><a href="#docs-depannage"><small>Previous</small>Troubleshooting</a><a class="next" href="#docs-securite"><small>Next</small>Platform security</a></div></article><article class="doc" id="doc-securite" data-slug="securite" data-title="Platform security" hidden><div class="crumb">Administration</div><h1>Platform security</h1><p style="margin-top:0">Security model of the server, agents and integrations, secret rotation, known limitations.</p>
<p>Principles: least privilege, defense in depth, no plaintext secrets, no arbitrary execution.</p>
<h2 id="securite--server">Server</h2>
<ul>
<li>Only <strong>nginx</strong> is published (HTTPS 443, redirect from 80, allowlisted syslog). The database, Redis, worker, collector and API are reachable only on the internal Docker network.</li>
<li>TLS everywhere; private CA or supplied certificate; security headers, rate limiting, <code>X-Forwarded-For</code> rewritten by nginx.</li>
<li><strong>Argon2id</strong> passwords, short-lived JWT + HttpOnly/Secure refresh cookie, RBAC, <strong>audit log</strong> of sensitive actions.</li>
<li>Secrets generated at installation (<code>.env</code> with mode 0600), never in the image or the repository.</li>
</ul>
<h2 id="securite--agents">Agents</h2>
<table>
<thead>
<tr>
<th>Mechanism</th>
<th>Detail</th>
</tr>
</thead>
<tbody>
<tr>
<td>Enrollment</td>
<td>Short-lived <code>cxe_</code> token, limited use, consumed atomically, never written to the agent's disk</td>
</tr>
<tr>
<td>Authentication</td>
<td><code>cxa_</code> key unique to each host, stored hashed (SHA-256), configuration file with mode 0600, immediate revocation</td>
</tr>
<tr>
<td>Transport</td>
<td>HTTPS with pinned CA (fingerprints verified)</td>
</tr>
<tr>
<td>Actions</td>
<td>Only <code>restart</code>, <code>collect_inventory</code>, <code>update</code>; any other command is refused (422) on the server side <strong>and</strong> ignored by the agent. <strong>No remote shell</strong></td>
</tr>
<tr>
<td>Updates</td>
<td>Manifest and binaries signed with <strong>Ed25519</strong>, verified before replacement</td>
</tr>
<tr>
<td>Robustness</td>
<td>Bounded disk buffer, deduplication, CPU/RAM limits, <code>NoNewPrivileges</code> and <code>ProtectSystem=full</code></td>
</tr>
</tbody>
</table>
<h2 id="securite--external-integrations">External integrations</h2>
<p>Encrypted credentials (Fernet/MultiFernet), never returned or logged; TLS verified by default; SSRF guard; no commands sent to third-party tools; management restricted to <code>ADMIN</code>.</p>
<h2 id="securite--rotation-and-incident">Rotation and incident</h2>
<table>
<thead>
<tr>
<th>Situation</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr>
<td>Rotating <code>SECRETS_KEY</code></td>
<td>Add the new key <strong>first</strong> (MultiFernet), keep the old one while you re-save</td>
</tr>
<tr>
<td>Compromised host</td>
<td><strong>Agents › Revoke</strong></td>
</tr>
<tr>
<td>Server certificate to renew</td>
<td><code>sh scripts/gen-tls.sh --renew &lt;names&gt;</code> (same key, agents keep working), then <code>docker compose restart nginx</code></td>
</tr>
<tr>
<td>Leaked signing key</td>
<td>Regenerate it, rebuild and redistribute the agents</td>
</tr>
</tbody>
</table>
<aside class="callout c-attention">
<p><strong>Warning</strong> Losing <code>SECRETS_KEY</code> forces you to re-enter the integration credentials; losing <code>AGENT_SIGNING_KEY</code> forces you to re-enroll the agents. Back them up.</p>
</aside>
<h2 id="securite--known-limitations">Known limitations</h2>
<ul>
<li>The Linux agent runs as <strong>root</strong> (required to read <code>auth.log</code> and journald). It is <strong>not an EDR</strong>: no blocking, no memory inspection.</li>
<li>No vulnerability (CVE) reporting.</li>
<li>Integration permissions are not granular (administrators only).</li>
<li>No TLS on Syslog.</li>
</ul>
<p>To report a vulnerability: contact the platform administrator; do not publish details before it is fixed.</p><div class="pn"><a href="#docs-utilisateurs-roles"><small>Previous</small>Users and roles</a><a class="next" href="#docs-reference-api"><small>Next</small>API reference</a></div></article><article class="doc" id="doc-reference-api" data-slug="reference-api" data-title="API reference" hidden><div class="crumb">Reference</div><h1>API reference</h1><p style="margin-top:0">Management API and agent API: authentication, routes, pagination, errors.</p>
<p>Interactive OpenAPI documentation: <code>/api/docs</code> if <code>DOCS_ENABLED=true</code> (disabled in production by default). All <code>/api/v1/*</code> routes require authentication, except <code>health</code>, <code>ready</code> and <code>auth/login</code>.</p>
<h2 id="reference-api--authentication">Authentication</h2>
<pre><code class="language-bash">curl -sk https://SERVEUR/api/v1/auth/login \
  -H 'Content-Type: application/json' \
  -d '{&quot;identifier&quot;:&quot;admin&quot;,&quot;password&quot;:&quot;********&quot;}'
# → {&quot;access_token&quot;:&quot;…&quot;, …} + HttpOnly refresh cookie

curl -sk https://SERVEUR/api/v1/events?limit=10 -H &quot;Authorization: Bearer $TOKEN&quot;
</code></pre>
<p>Other routes: <code>POST /auth/refresh</code>, <code>POST /auth/logout</code>, <code>GET /auth/me</code> (also returns the effective <strong>permissions</strong>).</p>
<h2 id="reference-api--management-api-api-v1">Management API (<code>/api/v1</code>)</h2>
<table>
<thead>
<tr>
<th>Area</th>
<th>Main routes</th>
</tr>
</thead>
<tbody>
<tr>
<td>Events</td>
<td><code>GET /events</code> — filters <code>origin, severity, event_type, source_ip, hostname, agent_id, source_type, username, process_name, q, since, until, limit, offset</code></td>
</tr>
<tr>
<td>Alerts / incidents</td>
<td><code>GET /alerts</code>, <code>GET/PATCH /alerts/{id}</code>, <code>GET/POST /incidents</code>, <code>GET/PATCH /incidents/{id}</code>, <code>POST /incidents/{id}/notes</code></td>
</tr>
<tr>
<td>Agents</td>
<td><code>GET /agents</code>, <code>GET /agents/summary</code>, <code>GET/DELETE /agents/{id}</code>, <code>POST /agents/{id}/revoke</code>, <code>POST /agents/{id}/commands</code>, <code>GET /agents/{id}/commands</code>, <code>GET/PUT /agents/config</code></td>
</tr>
<tr>
<td>Tokens</td>
<td><code>GET/POST /agents/tokens</code> (the token appears <strong>only once</strong> in the POST response, with the installation commands), <code>DELETE /agents/tokens/{id}</code></td>
</tr>
<tr>
<td>Infrastructure</td>
<td><code>GET /infrastructure/overview</code>, <code>…/machines</code>, <code>…/machines/{id}</code>, <code>…/machines/{id}/inventory/{software\|services\|processes\|ports\|users}</code>, <code>…/machines/{id}/changes</code></td>
</tr>
<tr>
<td>Correlation</td>
<td><code>GET /correlation/rules</code>, <code>GET /correlation/stats</code>, <code>POST /correlation/rules/validate</code></td>
</tr>
<tr>
<td>Health / retention</td>
<td><code>GET /system/health</code>, <code>GET/PUT /system/retention</code></td>
</tr>
<tr>
<td>Security Solutions</td>
<td><code>GET /integrations/solutions/catalog</code>, <code>GET/POST /integrations/solutions</code>, <code>PATCH/DELETE …/{id}</code>, <code>POST …/{id}/connect</code>, <code>…/disconnect</code>, <code>…/{id}/test</code>, <code>POST …/test</code></td>
</tr>
<tr>
<td>Users / roles</td>
<td><code>/users</code>, <code>/roles</code></td>
</tr>
<tr>
<td>Other</td>
<td><code>/assets</code>, <code>/dashboard</code>, <code>/risk</code>, <code>/mitre</code>, <code>/rules</code>, <code>/ai/*</code>, <code>/response/*</code>, <code>/notifications</code>, <code>/demo/*</code></td>
</tr>
</tbody>
</table>
<p>Agent commands accept only <code>restart</code>, <code>collect_inventory</code> and <code>update</code>.</p>
<h2 id="reference-api--pagination-and-errors">Pagination and errors</h2>
<p>Paginated responses: <code>{"items": […], "total": n, "limit": n, "offset": n}</code>. Errors: <code>{"detail": "…"}</code> — <code>422</code> validation, <code>401</code>, <code>403</code>, <code>404</code>, <code>409</code>, <code>429</code> (with <code>Retry-After</code>).</p>
<p>Integration credentials are <strong>never</strong> returned: the response only indicates which fields are set (<code>credentials_set</code>). For a <code>PATCH</code>, credential fields that are sent replace the existing ones, an empty string removes the field, and absent fields are kept.</p>
<h2 id="reference-api--agent-api-agent">Agent API (<code>/agent</code>)</h2>
<table>
<thead>
<tr>
<th>Route</th>
<th>Auth</th>
<th>Role</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>POST /agent/v1/enroll</code></td>
<td><code>cxe_</code> token in the body</td>
<td>Enrollment → <code>agent_id</code>, <code>agent_key</code>, public signing key, configuration</td>
</tr>
<tr>
<td><code>POST /agent/v1/events</code></td>
<td><code>X-Agent-Id</code> + <code>Bearer cxa_</code></td>
<td>NDJSON gzip, ≤ 2000 events, ≤ 2 MB compressed / 5 MB uncompressed; <code>X-Agent-Epoch</code>; response <code>{accepted, duplicates, rejected, last_seq}</code>; 429/503 = backpressure</td>
</tr>
<tr>
<td><code>POST /agent/v1/heartbeat</code></td>
<td>same</td>
<td>Health and buffer; returns configuration and commands</td>
</tr>
<tr>
<td><code>POST /agent/v1/inventory</code></td>
<td>same</td>
<td>Inventory by category</td>
</tr>
<tr>
<td><code>GET /agent/v1/manifest</code></td>
<td>same</td>
<td>Ed25519-signed manifest</td>
</tr>
<tr>
<td><code>GET /agent/v1/download/{os}-{arch}</code></td>
<td>same</td>
<td>Binary</td>
</tr>
<tr>
<td><code>GET /agent/install.sh</code>, <code>/agent/install.ps1</code>, <code>/agent/ca.pem</code>, <code>/agent/manifest.json</code>, <code>/agent/download/{os}-{arch}</code></td>
<td>public</td>
<td>Installation (no secret in these files)</td>
</tr>
</tbody>
</table>
<p>The protocol is backward compatible within a major version (<code>/agent/v1</code>). The full contract (JSON formats, guarantees) is provided by the vendor on request.</p>
<h2 id="reference-api--syslog">Syslog</h2>
<p>UDP/TCP 514 (5514 in the container), restricted to <code>SYSLOG_ALLOWED_NETS</code> and to declared devices.</p><div class="pn"><a href="#docs-securite"><small>Previous</small>Platform security</a><a class="next" href="#docs-configuration"><small>Next</small>Configuration variables</a></div></article><article class="doc" id="doc-configuration" data-slug="configuration" data-title="Configuration variables" hidden><div class="crumb">Reference</div><h1>Configuration variables</h1><p style="margin-top:0">The .env variables and the configs/ files you need to know.</p>
<p>Everything is set in <strong><code>.env</code></strong> and in <strong><code>configs/</code></strong>. After changing <code>.env</code>: <code>docker compose up -d</code>. After changing <code>configs/</code>: <code>docker compose restart backend worker</code>.</p>
<aside class="callout c-note">
<p><strong>Note</strong> The administrator account is <strong>not</strong> in <code>.env</code>: it is requested at installation.</p>
</aside>

</thead>

<p><code>AI_MIN_BASELINE_HOURS</code> (24), <code>AI_BASELINE_HOURS</code> (168), <code>AI_RETRAIN_HOURS</code> (24), <code>AI_INTERVAL_SECONDS</code> (60), <code>AI_Z_THRESHOLD</code> (4), <code>AI_Z_STRONG</code> (6). See <a href="#docs-ia">Anomaly detection (AI)</a>.</p>

</table>
<p>For risk: raise <code>ot_zone</code> and <code>asset_criticality.CRITICAL</code> if your PLCs are what matters; lower <code>severity.high</code> if isolated alerts are too severe. The total stays capped at 100 and each contribution stays displayed. <code>asset_risk_half_life_hours</code> sets the decay (12 h by default, <code>0</code> disables it). The 0-20 / 21-40 / 41-70 / 71-100 levels are fixed.</p><div class="pn"><a href="#docs-reference-api"><small>Previous</small>API reference</a><a class="next" href="#docs-dimensionnement"><small>Next</small>Sizing and performance</a></div></article><article class="doc" id="doc-dimensionnement" data-slug="dimensionnement" data-title="Sizing and performance" hidden><div class="crumb">Reference</div><h1>Sizing and performance</h1><p style="margin-top:0">Resources to plan for, light or full mode, and measured results.</p>
<h2 id="dimensionnement--hardware">Hardware</h2>
<table>
<thead>
<tr>
<th>Fleet</th>
<th>Recommended mode</th>
<th>Indicative resources</th>
</tr>
</thead>
<tbody>
<tr>
<td>A few machines, testing</td>
<td>Light (without OpenSearch)</td>
<td>2 vCPU, less than 6 GB of RAM</td>
</tr>
<tr>
<td>Tens to hundreds of machines</td>
<td>Full</td>
<td>4 vCPU or more, 8 GB or more, disk depending on retention</td>
</tr>
</tbody>
</table>
<p>The installer chooses light mode below 6 GB of RAM; <code>--light</code> forces it. The default container memory limits are: PostgreSQL 512 MB, Redis 192 MB, Backend 512 MB, AI 768 MB, Worker 384 MB, Collector 128 MB, Frontend 256 MB, nginx 64 MB, OpenSearch 1 GB (full mode). They are set in <code>.env</code>.</p>
<h2 id="dimensionnement--measurements">Measurements</h2>
<p>Test environment: 2 vCPU, PostgreSQL + Redis + API + worker on the same machine, without OpenSearch, load generator on the same machine.</p>
<table>
<thead>
<tr>
<th>Test</th>
<th>Result</th>
</tr>
</thead>
<tbody>
<tr>
<td>Maximum throughput (10 agents, batches of 500)</td>
<td>1,437 events/s accepted, 940/s processed end to end, <strong>0 lost</strong>, 429 backpressure triggered without errors</td>
</tr>
<tr>
<td>Sustained throughput of 500 ev/s</td>
<td>474 ev/s, queue empty, request latency p50 30 ms / p95 155 ms, average CPU 24%, RAM 368 MB</td>
</tr>
<tr>
<td>Latency of a single event (send → stored)</td>
<td>p50 111 ms, p95 125 ms</td>
</tr>
<tr>
<td>Hard kill (<code>kill -9</code>) of the worker under load</td>
<td>18,000 accepted → 18,000 stored, 0 lost, 0 duplicates</td>
</tr>
<tr>
<td>End-to-end scenario with a real agent</td>
<td>30 checks passed, including a server outage (200 events buffered then delivered)</td>
</tr>
</tbody>
</table>
<p>The bottleneck is the worker (one core, ≈ 950 ev/s), which is on the order of 80 million events per day. Beyond that, add workers (the Redis consumer group distributes the load among them); this case was not measured.</p>
<aside class="callout c-note">
<p><strong>Note</strong> These figures come from tests on a small machine, not from a customer deployment. Measure with <code>scripts/load-native.py</code> on your own hardware.</p>
</aside>
<h2 id="dimensionnement--when-the-queue-grows">When the queue grows</h2>
<p><strong>System Health › ingestion queue</strong>: above the threshold, the API answers 429/503 with <code>Retry-After</code>, agents keep their buffer and nothing is lost. Add CPU to the worker, or a second worker, or reduce the noisy sources.</p><div class="pn"><a href="#docs-configuration"><small>Previous</small>Configuration variables</a><a class="next" href="#docs-faq-limites"><small>Next</small>FAQ and limits</a></div></article><article class="doc" id="doc-faq-limites" data-slug="faq-limites" data-title="FAQ and limits" hidden><div class="crumb">Reference</div><h1>FAQ and limits</h1><p style="margin-top:0">Short answers, and what is not covered or has not been tested.</p>
<h2 id="faq-limites--frequently-asked-questions">Frequently asked questions</h2>
<p><strong>Does Controlix replace Wazuh or Suricata?</strong>
No. It reads their output, correlates it with itself and with its own agents, and adds risk, incidents and AI.</p>
<p><strong>Is it an EDR?</strong>
No. It detects and alerts; it does not block and does not inspect memory.</p>
<p><strong>Does my data leave my network?</strong>
No: the AI and all processing are local. Integrations only query the devices you declare.</p>
<p><strong>What happens if the server is unreachable?</strong>
Agents keep a bounded disk buffer and resend everything when it returns, without duplicates.</p>
<p><strong>Can I write my own rules?</strong>
Yes, in YAML: see <a href="#docs-detection-correlation">Detection and correlation</a>. Parsers too.</p>
<p><strong>Which languages?</strong>
The console is in English. This website and its documentation are available in French and English (FR/EN button at the top of the page).</p>
<p><strong>How many machines?</strong> See <a href="#docs-dimensionnement">Sizing and performance</a>: the measurements are on a small server.</p>
<h2 id="faq-limites--stated-limits">Stated limits</h2>
<ul>
<li><strong>Full installation</strong>: each component was tested separately (API, detection, interface, agent, installer, release archive), but the complete path from the website (downloading the images then starting up) has not been replayed end to end by the vendor on a clean server. Run <code>sudo /opt/controlix/install.sh self-test</code> after installation and report any discrepancy.</li>
<li><strong>Source code</strong>: not distributed. The images are pulled from a registry; the content of the containers is not intended to be modified.</li>
<li><strong>Windows agent</strong>: compiles, passes <code>go vet</code> and the unit tests, but <strong>has not been run on a real Windows machine</strong>.</li>
<li><strong>Third-party products</strong>: Wazuh, FortiGate, pfSense, Snort were not available; the connectors were tested against local protocol servers and lines in the documented format. Verify on your own data.</li>
<li>No <strong>CVE</strong> matching, no Windows Event Forwarding, no Syslog over TLS.</li>
<li>Integration permissions are not granular (administrators only).</li>
<li>Two rules (firewall change, agent offline) have no MITRE mapping.</li>
<li>The measured bottleneck is a single worker; multi-worker scaling has not been measured.</li>
</ul><div class="pn"><a href="#docs-dimensionnement"><small>Previous</small>Sizing and performance</a><a class="next" href="#docs-glossaire"><small>Next</small>Glossary</a></div></article><article class="doc" id="doc-glossaire" data-slug="glossaire" data-title="Glossary" hidden><div class="crumb">Reference</div><h1>Glossary</h1><p style="margin-top:0">The terms used in Controlix.</p>
<table>
<thead>
<tr>
<th>Term</th>
<th>Definition</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Agent</strong></td>
<td>Go program installed on a host, which collects logs and inventory</td>
</tr>
<tr>
<td><strong>Alert</strong></td>
<td>Detection produced by a rule or by the AI</td>
</tr>
<tr>
<td><strong>Anomaly</strong></td>
<td>Behavior far from the normal learned for a machine</td>
</tr>
<tr>
<td><strong>Asset</strong></td>
<td>Known machine or device, with a zone and criticality</td>
</tr>
<tr>
<td><strong>Backpressure</strong></td>
<td>429/503 response that asks the agent to slow down; it keeps its buffer</td>
</tr>
<tr>
<td><strong>Buffer</strong></td>
<td>The agent's disk queue that prevents any loss while offline</td>
</tr>
<tr>
<td><strong>Correlation</strong></td>
<td>Grouping of alerts related in time, by source, target or user</td>
</tr>
<tr>
<td><strong><code>cxa_</code> / <code>cxe_</code></strong></td>
<td>Prefixes of agent keys and enrollment tokens</td>
</tr>
<tr>
<td><strong>Dead-letter</strong></td>
<td>Discard queue for invalid events</td>
</tr>
<tr>
<td><strong>Enrollment</strong></td>
<td>First connection of an agent with a limited-use token</td>
</tr>
<tr>
<td><strong>Incident</strong></td>
<td>Group of correlated alerts to investigate</td>
</tr>
<tr>
<td><strong>Isolation Forest</strong></td>
<td>Unsupervised algorithm used for the AI</td>
</tr>
<tr>
<td><strong>Light mode</strong></td>
<td>Installation without OpenSearch, events in PostgreSQL</td>
</tr>
<tr>
<td><strong>MITRE ATT&amp;CK</strong></td>
<td>Public catalog of attack tactics and techniques</td>
</tr>
<tr>
<td><strong>Normalization</strong></td>
<td>Conversion of every log to a common schema, raw log kept</td>
</tr>
<tr>
<td><strong>Pattern</strong></td>
<td>Sequence of rules that names an incident</td>
</tr>
<tr>
<td><strong>Retention</strong></td>
<td>How long events, history and audit are kept</td>
</tr>
<tr>
<td><strong>Risk score</strong></td>
<td>Score from 0 to 100 with the detail of each contribution</td>
</tr>
<tr>
<td><strong>SSRF</strong></td>
<td>Abuse of the server to reach internal addresses; blocked for integrations</td>
</tr>
<tr>
<td><strong>Window</strong></td>
<td>Period over which a rule counts or orders events</td>
</tr>
<tr>
<td><strong>Zone</strong></td>
<td>Asset segment: IT, OT or DMZ</td>
</tr>
</tbody>
</table><div class="pn"><a href="#docs-faq-limites"><small>Previous</small>FAQ and limits</a></div></article></div>

<script>
(function(){
var app=document.getElementById('app'),root=document.documentElement,S={};
var STR={
  fr:{copy:'Copier',copied:'Copié',selected:'Sélectionné',toc:'Sur cette page',none:'Aucun résultat.',suffix:' · Controlix AI'},
  en:{copy:'Copy',copied:'Copied',selected:'Selected',toc:'On this page',none:'No results.',suffix:' · Controlix AI'}
};
function t(fn){try{return fn()}catch(e){return null}}
/* theme (applies to the page, survives language changes) */
var saved=t(function(){return localStorage.getItem('controlix-site-theme')});
if(saved==='light'||saved==='dark')root.setAttribute('data-theme',saved);
/* language: saved choice, else the browser language (English if it starts with "en", otherwise French) */
var lang=t(function(){return localStorage.getItem('controlix-site-lang')});
if(lang!=='fr'&&lang!=='en')lang=((navigator.language||'fr').toLowerCase().indexOf('en')===0)?'en':'fr';

function show(){
  if(!S.home)return;
  var h=(location.hash||'').replace('#','');
  document.body.classList.remove('menu-open');
  if(h.indexOf('docs-')===0){
    var slug=h.slice(5),a=S.bySlug[slug]||S.bySlug['introduction'];
    S.home.hidden=true;S.docs.hidden=false;
    S.arts.forEach(function(x){x.hidden=x!==a});
    S.app.querySelectorAll('#navlist a').forEach(function(l){l.classList.toggle('on',l.dataset.slug===a.dataset.slug)});
    document.title=a.dataset.title+STR[S.lang].suffix;
    buildToc(a);window.scrollTo(0,0);
  }else{
    S.docs.hidden=true;S.home.hidden=false;document.title='Controlix AI';
    if(h!=='accueil'&&h)t(function(){var e=document.getElementById(h);if(e)e.scrollIntoView()});else window.scrollTo(0,0);
  }
}
function buildToc(a){
  var toc=S.toc;toc.innerHTML='';var hs=a.querySelectorAll('h2');
  if(!hs.length){return}
  var h5=document.createElement('h5');h5.textContent=STR[S.lang].toc;toc.appendChild(h5);
  hs.forEach(function(h){var l=document.createElement('a');l.textContent=h.textContent;l.href='#docs-'+a.dataset.slug;
    l.addEventListener('click',function(e){e.preventDefault();h.scrollIntoView({behavior:'smooth'})});toc.appendChild(l);l._h=h});
}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}

function mount(l){
  S.lang=l;root.lang=l;
  app.innerHTML='';app.appendChild(document.getElementById('tpl-'+l).content.cloneNode(true));
  var $=function(id){return app.querySelector('#'+id)};
  S.app=app;S.home=$('home');S.docs=$('docsview');S.toc=$('toc');
  S.arts=[].slice.call(app.querySelectorAll('article.doc'));S.bySlug={};S.arts.forEach(function(a){S.bySlug[a.dataset.slug]=a});
  var s=STR[l];
  $('theme').addEventListener('click',function(){
    var cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    var nx=cur==='dark'?'light':'dark';root.setAttribute('data-theme',nx);
    t(function(){localStorage.setItem('controlix-site-theme',nx)});
  });
  app.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){
    var nl=b.dataset.lang;if(nl===S.lang)return;t(function(){localStorage.setItem('controlix-site-lang',nl)});
    mount(nl);
  })});
  app.querySelectorAll('pre').forEach(function(p){
    var b=document.createElement('button');b.className='copy';b.type='button';b.textContent=s.copy;
    b.addEventListener('click',function(){
      var txt=p.querySelector('code').innerText;
      function done(){b.textContent=s.copied;setTimeout(function(){b.textContent=s.copy},1400)}
      function fallback(){var r=document.createRange();r.selectNodeContents(p.querySelector('code'));var g=getSelection();g.removeAllRanges();g.addRange(r);b.textContent=s.selected}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback)}else fallback();
    });
    p.appendChild(b);
  });
  app.querySelectorAll('.doc table').forEach(function(tb){var w=document.createElement('div');w.className='tw';tb.parentNode.insertBefore(w,tb);w.appendChild(tb)});
  app.querySelectorAll('[data-scroll]').forEach(function(b){b.addEventListener('click',function(){
    var go=function(){var e=document.getElementById(b.dataset.scroll);if(e)e.scrollIntoView({behavior:'smooth'})};
    if(S.home.hidden){location.hash='#accueil';setTimeout(go,60)}else go();
  })});
  app.querySelector('[data-home]').addEventListener('click',function(){if(!S.home.hidden)window.scrollTo({top:0,behavior:'smooth'})});
  $('menu-btn').addEventListener('click',function(){
    if(S.docs.hidden){location.hash='#docs-introduction'}
    document.body.classList.toggle('menu-open');
  });
  $('scrim').addEventListener('click',function(){document.body.classList.remove('menu-open')});
  /* search */
  var q=$('q'),res=$('results'),nav=$('navlist');
  var idx=S.arts.map(function(a){return{slug:a.dataset.slug,title:a.dataset.title,text:a.textContent.replace(/\s+/g,' ')}});
  S.q=q;
  q.addEventListener('input',function(){
    var v=norm(q.value.trim());
    if(v.length<2){res.hidden=true;nav.hidden=false;return}
    var terms=v.split(/\s+/),out=[];
    idx.forEach(function(d){
      var tt=norm(d.title),tx=norm(d.text),sc=0,ok=true;
      terms.forEach(function(w){var inT=tt.indexOf(w)>=0,inX=tx.indexOf(w);if(!inT&&inX<0)ok=false;sc+=(inT?5:0)+(inX>=0?1:0)});
      if(!ok)return;
      var p=tx.indexOf(terms[0]),snip=p>=0?d.text.slice(Math.max(0,p-40),p+90):d.text.slice(0,110);
      out.push({d:d,sc:sc,snip:(p>40?'…':'')+snip+'…'});
    });
    out.sort(function(a,b){return b.sc-a.sc});
    res.innerHTML='';nav.hidden=true;res.hidden=false;
    if(!out.length){var li=document.createElement('li');li.innerHTML='<small style="padding:8px 10px">'+s.none+'</small>';res.appendChild(li);return}
    out.slice(0,8).forEach(function(o){
      var li=document.createElement('li'),a=document.createElement('a'),sm=document.createElement('small');
      a.href='#docs-'+o.d.slug;a.textContent=o.d.title;sm.textContent=o.snip;a.appendChild(sm);
      a.addEventListener('click',function(){q.value='';res.hidden=true;nav.hidden=false});li.appendChild(a);res.appendChild(li);
    });
  });
  show();
}
window.addEventListener('hashchange',show);
window.addEventListener('scroll',function(){
  var toc=S.toc;if(!toc)return;var links=toc.querySelectorAll('a');if(!links.length)return;var cur=null;
  links.forEach(function(l){if(l._h&&l._h.getBoundingClientRect().top<120)cur=l});
  links.forEach(function(l){l.classList.toggle('on',l===cur)});
},{passive:true});
document.addEventListener('keydown',function(e){
  if(e.key==='/'&&S.docs&&!/input|textarea/i.test((e.target.tagName||''))&&!S.docs.hidden){e.preventDefault();S.q.focus()}
});
mount(lang);
})();
</script>
