<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Controlix AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Enterprise product-site look (Elastic / Splunk / Wazuh): sticky header, dark hero band over a light page,
   spaced sections, product mock, terminal install block, multi-column footer.
   Docs = tree on the left, article, outline on the right. Light by default, dark on request or by system setting. */
:root{
  color-scheme:light;
  --bg:0 0% 100%; --surface:0 0% 100%; --raised:220 22% 97%; --line:220 16% 88%;
  --text:222 40% 12%; --muted:220 12% 38%; --accent:152 72% 28%; --accent2:356 74% 46%;
  --onaccent:0 0% 100%; --ok:152 62% 27%; --crit:0 74% 44%; --high:22 92% 38%; --med:38 92% 31%; --low:208 82% 36%;
  --code:222 30% 96%; --hero:222 47% 8%;
  --font-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-display:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:222 36% 7%; --surface:222 30% 10%; --raised:222 28% 13%; --line:222 22% 21%;
  --text:214 30% 94%; --muted:216 14% 68%; --accent:152 62% 46%; --accent2:356 84% 62%;
  --onaccent:222 47% 6%; --ok:152 60% 50%; --crit:0 82% 63%; --high:24 94% 58%; --med:44 94% 56%; --low:208 86% 66%;
  --code:222 36% 6%; --hero:222 47% 6%;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:222 36% 7%; --surface:222 30% 10%; --raised:222 28% 13%; --line:222 22% 21%;
  --text:214 30% 94%; --muted:216 14% 68%; --accent:152 62% 46%; --accent2:356 84% 62%;
  --onaccent:222 47% 6%; --ok:152 60% 50%; --crit:0 82% 63%; --high:24 94% 58%; --med:44 94% 56%; --low:208 86% 66%;
  --code:222 36% 6%; --hero:222 47% 6%;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:hsl(var(--bg));color:hsl(var(--text));font:400 16px/1.65 var(--font-body);-webkit-font-smoothing:antialiased;padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:hsl(var(--bg))}
a{color:hsl(var(--accent));text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid hsl(var(--accent));outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.02em}
code,pre,kbd{font-family:var(--font-mono)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:hsl(var(--bg)/.92);backdrop-filter:blur(12px);border-bottom:1px solid hsl(var(--line))}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font:800 19px var(--font-display);color:hsl(var(--text));letter-spacing:-.02em}
.brand:hover{text-decoration:none}
.brand svg{width:26px;height:30px}
.nav{display:flex;gap:2px;margin-left:10px;flex:1;min-width:0}
.nav a,.nav button{background:none;border:0;color:hsl(var(--text));font:500 14.5px var(--font-body);padding:9px 12px;border-radius:8px;cursor:pointer;opacity:.82}
.nav a:hover,.nav button:hover{opacity:1;background:hsl(var(--raised));text-decoration:none}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid hsl(var(--line));background:hsl(var(--surface));color:hsl(var(--text));cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{border-color:hsl(var(--accent))}
.iconbtn svg{width:18px;height:18px}
.seg{display:inline-flex;border:1px solid hsl(var(--line));border-radius:9px;overflow:hidden;background:hsl(var(--surface))}
.seg button{border:0;background:none;color:hsl(var(--muted));font:600 12px var(--font-mono);letter-spacing:.04em;padding:0 11px;height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:hsl(var(--text));color:hsl(var(--bg))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:9px;padding:12px 20px;font:600 15px var(--font-body);border:1px solid hsl(var(--line));background:hsl(var(--surface));color:hsl(var(--text));cursor:pointer;letter-spacing:-.005em}
.btn:hover{text-decoration:none;border-color:hsl(var(--accent))}
.btn.primary{background:hsl(var(--accent));color:hsl(var(--onaccent));border-color:hsl(var(--accent))}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:9px 14px;font-size:14px}
#menu-btn{display:none}
/* hero band: always dark, like the big security vendors */
.herob{background:hsl(var(--hero));color:#eef2f8;position:relative;overflow:hidden;
  --text:210 30% 96%;--muted:214 18% 74%;--surface:222 30% 12%;--raised:222 28% 16%;--line:222 22% 26%;--code:222 40% 7%;--bg:222 47% 8%;
  --accent:152 62% 48%;--onaccent:222 47% 6%;--crit:0 82% 64%;--high:24 94% 58%;--med:44 94% 56%;--low:208 86% 68%}
.herob::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 420px at 85% 0,hsl(356 84% 60%/.18),transparent 60%),radial-gradient(800px 460px at 0 100%,hsl(152 62% 46%/.16),transparent 60%);pointer-events:none}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:56px;align-items:center;padding-block:84px 76px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--accent))}
.eyebrow::before{content:"";width:22px;height:2px;background:currentColor;border-radius:2px}
.hero h1{font-size:clamp(38px,5.2vw,62px);font-weight:800;letter-spacing:-.035em;margin:16px 0 22px;color:#fff}
.hero h1 em{font-style:normal;color:hsl(var(--accent))}
.hero p.lead{font-size:19px;line-height:1.6;color:hsl(var(--muted));max-width:52ch;margin:0 0 32px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.herob .btn{background:transparent;border-color:hsl(0 0% 100%/.28);color:#fff}
.herob .btn:hover{border-color:#fff}
.herob .btn.primary{background:hsl(var(--accent));border-color:hsl(var(--accent));color:hsl(222 47% 6%)}
.hero small.meta{display:block;margin-top:22px;color:hsl(var(--muted));font:400 13px var(--font-mono)}
/* product mock */
.mock{background:hsl(var(--surface));border:1px solid hsl(var(--line));border-radius:14px;box-shadow:0 40px 80px -30px #000c;overflow:hidden;min-width:0;font-size:14px}
.mock-bar{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid hsl(var(--line));background:hsl(var(--raised))}
.mock-bar i{width:10px;height:10px;border-radius:50%;background:hsl(var(--line))}
.mock-bar i:nth-child(1){background:#ef5a5a}.mock-bar i:nth-child(2){background:#f2b84b}.mock-bar i:nth-child(3){background:#3fbf7f}
.mock-bar span{margin-left:8px;font:500 12px var(--font-mono);color:hsl(var(--muted))}
.mock-body{display:grid;grid-template-columns:44px minmax(0,1fr)}
.mock-side{border-right:1px solid hsl(var(--line));padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.mock-side b{width:22px;height:22px;border-radius:7px;background:hsl(var(--raised))}
.mock-side b:first-child{background:hsl(var(--accent))}
.mock-main{padding:14px 16px;min-width:0}
.mock-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pill{font:600 11px var(--font-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.pill.crit{color:hsl(var(--crit))}.pill.high{color:hsl(var(--high))}.pill.med{color:hsl(var(--med))}.pill.low{color:hsl(var(--low))}.pill.ok{color:hsl(var(--ok))}
.mock-chart{height:70px;margin-bottom:12px;border-radius:8px;background:hsl(var(--raised)/.6);padding:8px 10px}
.mock-chart svg{width:100%;height:100%;display:block}
.inc{border:1px solid hsl(var(--line));border-radius:10px;overflow:hidden;background:hsl(var(--bg)/.4)}
.inc-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid hsl(var(--line));flex-wrap:wrap}
.inc-head h3{font-size:15px;flex:1;min-width:120px;letter-spacing:-.01em;color:hsl(var(--text))}
.score{font:800 28px var(--font-display);color:hsl(var(--crit));line-height:1}
.score small{font:500 11px var(--font-mono);color:hsl(var(--muted))}
.tl{list-style:none;margin:0;padding:4px 14px 8px}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-bottom:1px dashed hsl(var(--line));align-items:start}
.tl li:last-child{border:0}
.tl .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:currentColor}
.tl b{display:block;font-weight:600;font-size:13.5px}
.tl span.d{display:block;color:hsl(var(--muted));font-size:12px}
.tl code{font-size:11px;color:hsl(var(--muted));white-space:nowrap}
.inc-foot{padding:8px 14px;border-top:1px solid hsl(var(--line));font:400 11px var(--font-mono);color:hsl(var(--muted))}
/* works-with strip */
.works{border-bottom:1px solid hsl(var(--line));background:hsl(var(--raised))}
.works .wrap{display:flex;align-items:center;gap:14px 28px;flex-wrap:wrap;padding-block:20px}
.works span.l{font:600 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--muted))}
.works b{font:700 16px var(--font-display);color:hsl(var(--text));opacity:.72;letter-spacing:-.01em}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid hsl(var(--line))}
.stats div{padding:34px 24px 30px 0}
.stats div+div{padding-left:24px;border-left:1px solid hsl(var(--line))}
.stats strong{display:block;font:800 40px var(--font-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:hsl(var(--accent))}
.stats span{color:hsl(var(--muted));font-size:14.5px}
.note-line{font:400 12px var(--font-mono);color:hsl(var(--muted));margin:12px 0 0}
/* sections */
section.band{padding-block:84px}
section.band.alt{background:hsl(var(--raised));border-block:1px solid hsl(var(--line))}
.band .eyebrow{color:hsl(var(--accent))}
.band h2{font-size:clamp(28px,3.6vw,42px);font-weight:800;letter-spacing:-.03em;margin:14px 0 16px}
.band p.sub{color:hsl(var(--muted));max-width:64ch;margin:0 0 40px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{display:flex;flex-direction:column;background:hsl(var(--surface));border:1px solid hsl(var(--line));border-radius:12px;padding:24px;color:inherit;min-width:0}
a.card:hover{text-decoration:none;border-color:hsl(var(--accent));box-shadow:0 12px 30px -18px hsl(var(--accent)/.55);transform:translateY(-2px);transition:transform .15s,border-color .15s,box-shadow .15s}
.card .ci{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:hsl(var(--accent)/.12);color:hsl(var(--accent));margin-bottom:16px}
.card h3{font-size:18px;margin-bottom:8px;letter-spacing:-.015em}
.card p{margin:0;color:hsl(var(--muted));font-size:15px;flex:1}
.card .go{display:inline-block;margin-top:16px;font:600 13.5px var(--font-body);color:hsl(var(--accent))}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid hsl(var(--line));border-radius:12px;overflow:hidden;background:hsl(var(--surface))}
.flow>div{position:relative;padding:22px 20px;border-right:1px solid hsl(var(--line))}
.flow>div:last-child{border-right:0}
.flow h4{font-size:16px;margin-bottom:6px}
.flow p{margin:0;color:hsl(var(--muted));font-size:14px;line-height:1.5}
.flow .k{font:600 11px var(--font-mono);color:hsl(var(--accent));letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:10px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:56px;align-items:center}
.split ul{margin:0;padding-left:20px;color:hsl(var(--muted))}
.split li{margin:8px 0}
.split li b{color:hsl(var(--text));font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.chips li{border:1px solid hsl(var(--line));background:hsl(var(--surface));border-radius:999px;padding:6px 14px;font-size:14px}
.chips.mono li{font-family:var(--font-mono);font-size:13px}
/* terminal */
.term{border:1px solid hsl(222 22% 22%);border-radius:12px;overflow:hidden;background:hsl(222 40% 6%);box-shadow:0 24px 50px -28px #0009;min-width:0}
.term-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:hsl(222 30% 11%);border-bottom:1px solid hsl(222 22% 20%)}
.term-bar i{width:10px;height:10px;border-radius:50%;background:#3a4558}
.term-bar span{margin-left:8px;font:500 12px var(--font-mono);color:#8b97ab}
.term pre{margin:0;border:0;border-radius:0;background:transparent;color:#e6edf6;padding:20px 20px;font-size:13.5px}
.term pre .copy{background:hsl(222 30% 14%);border-color:hsl(222 22% 26%);color:#9fb0c6}
.install{display:grid;gap:18px;max-width:880px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:8px;counter-reset:st}
.steps>div{counter-increment:st;border-top:2px solid hsl(var(--accent));padding-top:14px}
.steps>div::before{content:"0" counter(st);display:block;font:600 12px var(--font-mono);color:hsl(var(--accent));margin-bottom:6px}
.steps h4{font-size:16px;margin-bottom:4px}
.steps p{margin:0;color:hsl(var(--muted));font-size:14.5px}
.callout-home{border:1px solid hsl(var(--high)/.5);border-left:4px solid hsl(var(--high));border-radius:10px;padding:14px 18px;background:hsl(var(--high)/.08);font-size:15px}
.finalcta{margin-top:0;border-radius:16px;padding:48px;background:hsl(var(--hero));color:#fff;display:flex;gap:28px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:relative;overflow:hidden;
  --muted:214 18% 74%;--accent:152 62% 48%;--onaccent:222 47% 6%;--line:222 22% 26%;--surface:222 30% 12%;--text:210 30% 96%}
.finalcta::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 260px at 100% 0,hsl(356 84% 60%/.2),transparent 60%),radial-gradient(500px 260px at 0 100%,hsl(152 62% 46%/.18),transparent 60%)}
.finalcta>*{position:relative}
.finalcta h2{font-size:30px;margin:0 0 8px;color:#fff}
.finalcta p{margin:0;color:hsl(var(--muted))}
.finalcta .btn{background:transparent;border-color:hsl(0 0% 100%/.3);color:#fff}
.finalcta .btn.primary{background:hsl(var(--accent));border-color:hsl(var(--accent));color:hsl(222 47% 6%)}
/* footer */
footer.foot{border-top:1px solid hsl(var(--line));background:hsl(var(--raised));margin-top:84px}
.foot .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;padding-block:48px 32px}
.foot h5{font:600 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--muted));margin:0 0 12px}
.foot ul{list-style:none;margin:0;padding:0}
.foot li{margin:7px 0;font-size:14.5px}
.foot li a{color:hsl(var(--text));opacity:.85}
.foot p{color:hsl(var(--muted));font-size:14px;margin:10px 0 0;max-width:36ch}
.foot .base{border-top:1px solid hsl(var(--line));padding-block:18px 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:hsl(var(--muted));font-size:13px}
/* code */
pre{position:relative;background:hsl(var(--code));border:1px solid hsl(var(--line));border-radius:10px;padding:16px 18px;overflow-x:auto;font-size:13px;line-height:1.65;margin:16px 0;max-width:100%}
pre code{font-size:inherit;white-space:pre}
:not(pre)>code{background:hsl(var(--raised));border:1px solid hsl(var(--line));border-radius:5px;padding:1px 6px;font-size:.88em}
.copy{position:absolute;top:8px;right:8px;font:500 11px var(--font-mono);background:hsl(var(--surface));color:hsl(var(--muted));border:1px solid hsl(var(--line));border-radius:6px;padding:3px 8px;cursor:pointer}
.copy:hover{color:hsl(var(--text));border-color:hsl(var(--accent))}
/* docs */
.docs{display:grid;grid-template-columns:272px minmax(0,1fr) 210px;gap:44px;align-items:start;padding-block:32px 56px}
.side{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));max-height:calc(100vh - 100px);overflow:auto;padding-right:8px;font-size:14px}
.search{width:100%;background:hsl(var(--raised));border:1px solid hsl(var(--line));color:hsl(var(--text));border-radius:9px;padding:10px 12px;font:400 14px var(--font-body)}
.search::placeholder{color:hsl(var(--muted))}
.results{margin:8px 0 0;padding:0;list-style:none}
.results a{display:block;padding:8px 10px;border-radius:8px;color:hsl(var(--text))}
.results a:hover{background:hsl(var(--raised));text-decoration:none}
.results small{display:block;color:hsl(var(--muted));font-size:12.5px;line-height:1.4}
.side h5{font:700 11.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--text));margin:24px 0 6px;padding-left:10px}
.side ul{list-style:none;margin:0;padding:0}
.side li a{display:block;padding:6px 10px;border-radius:7px;color:hsl(var(--muted));border-left:2px solid transparent}
.side li a:hover{color:hsl(var(--text));background:hsl(var(--raised));text-decoration:none}
.side li a.on{color:hsl(var(--accent));background:hsl(var(--accent)/.1);border-left-color:hsl(var(--accent));font-weight:600}
.doc{min-width:0;max-width:780px}
.doc .crumb{font:500 13px var(--font-body);color:hsl(var(--muted));margin-bottom:12px}
.doc .crumb::before{content:"Docs  /  ";opacity:.7}
html[lang="fr"] .doc .crumb::before{content:"Docs  /  "}
.doc h1{font-size:clamp(32px,4vw,44px);font-weight:800;letter-spacing:-.03em;margin:0 0 14px}
.doc>h1+p{font-size:18px;color:hsl(var(--muted))}
.doc h2{font-size:27px;margin:48px 0 12px;scroll-margin-top:90px;padding-top:8px;letter-spacing:-.025em}
.doc h3{font-size:20px;margin:32px 0 8px;scroll-margin-top:90px}
.doc p,.doc li{max-width:70ch}
.doc ul,.doc ol{padding-left:22px}
.doc li{margin:4px 0}
.tw{overflow-x:auto;margin:18px 0;border:1px solid hsl(var(--line));border-radius:10px;max-width:100%}
.doc table{border-collapse:collapse;width:100%;font-size:14px;min-width:480px}
.doc th{text-align:left;font:600 12px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:hsl(var(--muted));background:hsl(var(--raised));padding:11px 14px;border-bottom:1px solid hsl(var(--line));white-space:nowrap}
.doc td{padding:10px 14px;border-bottom:1px solid hsl(var(--line)/.7);vertical-align:top}
.doc tr:last-child td{border-bottom:0}
.doc td code{white-space:nowrap}
aside.callout{border:1px solid hsl(var(--c)/.4);border-left:4px solid hsl(var(--c));border-radius:10px;padding:13px 18px;margin:20px 0;background:hsl(var(--c)/.07);--c:var(--low)}
aside.callout p{margin:0}
aside.callout.c-attention{--c:var(--high)}
aside.callout.c-astuce{--c:var(--ok)}
aside.callout strong:first-child{color:hsl(var(--c))}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:60px}
.pn a{border:1px solid hsl(var(--line));border-radius:10px;padding:14px 18px;background:hsl(var(--surface));color:hsl(var(--text));font-weight:600}
.pn a:hover{text-decoration:none;border-color:hsl(var(--accent))}
.pn small{display:block;font:500 12px var(--font-body);color:hsl(var(--muted));font-weight:500}
.pn a.next{text-align:right;grid-column:2}
.toc{position:sticky;top:calc(88px + env(safe-area-inset-top,0px));font-size:13px}
.toc h5{font:700 11.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--text));margin:0 0 10px}

      <div class="eyebrow">SIEM / SOC autonome</div>

      <p class="lead">Controlix AI collecte les journaux et l'inventaire de vos machines, relie les détections entre elles et vous dit par où commencer. Un seul serveur, une seule commande d'installation avec l'adresse de votre serveur, aucun outil externe obligatoire.</p>
      <div class="cta"><a class="btn primary" href="#docs-installation-serveur">Installer Controlix</a><a class="btn" href="#docs-introduction">Lire la documentation</a></div>
      <small class="meta">Linux · Docker · agents Go pour Linux et Windows</small>
    </div>

  <section class="band" id="fonctions"><div class="wrap">
    <div class="eyebrow">Ce que fait Controlix</div>
    <h2>Chaque alerte vient avec son explication</h2>
    <p class="sub">Le score de risque montre ses calculs, l'IA dit ce qui a changé sur la machine, et chaque événement garde son journal d'origine.</p>
    <div class="grid">
      <a class="card" href="#docs-agent-installation"><span class="ci"><svg class="ico"><use href="#i-server"/></svg></span><h3>Agents Go, Linux et Windows</h3><p>Un binaire, une commande copiée depuis le tableau de bord. Tampon disque : rien n'est perdu si le serveur est injoignable.</p><span class="go">Installer un agent →</span></a>
      <a class="card" href="#docs-collecte-normalisation"><span class="ci"><svg class="ico"><use href="#i-layers"/></svg></span><h3>Normalisation sans perte</h3><p>Tous les formats vers un même schéma, avec le journal brut conservé. Ajoutez un format en YAML.</p><span class="go">Voir le schéma →</span></a>
      <a class="card" href="#docs-detection-correlation"><span class="ci"><svg class="ico"><use href="#i-shield"/></svg></span><h3>Règles, séquences, MITRE</h3><p>Seuils, valeurs distinctes et séquences ordonnées. Les alertes de plusieurs sources se retrouvent dans le même incident.</p><span class="go">Écrire une règle →</span></a>
      <a class="card" href="#docs-ia"><span class="ci"><svg class="ico"><use href="#i-cpu"/></svg></span><h3>IA locale par machine</h3><p>Apprend le comportement normal de chaque machine et explique l'écart. Aucun GPU, aucune donnée ne sort.</p><span class="go">Comprendre l'IA →</span></a>
      <a class="card" href="#docs-inventaire"><span class="ci"><svg class="ico"><use href="#i-list"/></svg></span><h3>Inventaire et changements</h3><p>Logiciels, services, ports, comptes. « Qu'est-ce qui a changé sur ce serveur depuis hier ? »</p><span class="go">Voir l'inventaire →</span></a>
      <a class="card" href="#docs-integrations"><span class="ci"><svg class="ico"><use href="#i-plug"/></svg></span><h3>Intégrations optionnelles</h3><p>Wazuh, Suricata, Snort, pfSense, FortiGate, Syslog. Lecture seule : aucune commande envoyée.</p><span class="go">Brancher une source →</span></a>
      <a class="card" href="#docs-utilisateurs-roles"><span class="ci"><svg class="ico"><use href="#i-users"/></svg></span><h3>Rôles et audit</h3><p>Quatre rôles intégrés, des rôles personnalisés, connexion par nom ou e-mail, journal d'audit.</p><span class="go">Gérer les accès →</span></a>

    </div>
  </div></section>

  <section class="band alt" id="flux"><div class="wrap">
    <div class="eyebrow">Fonctionnement</div>
    <h2>Du journal brut à l'incident</h2>
    <p class="sub">Un événement accusé est déjà publié dans une file durable : un arrêt brutal ne le perd pas, un rejeu ne le duplique pas.</p>
    <div class="flow">
      <div><span class="k">Sources</span><h4>Agents et capteurs</h4><p>Linux, Windows, Syslog, Wazuh, Suricata, fichiers.</p></div>
      <div><span class="k">File</span><h4>Redis Streams</h4><p>Durable, accusés, reprise après panne, contre-pression.</p></div>
      <div><span class="k">Schéma</span><h4>Normalisation</h4><p>Un format commun, enrichi par l'inventaire.</p></div>
      <div><span class="k">Détection</span><h4>Règles + IA</h4><p>Séquences, seuils, anomalies, score de risque.</p></div>
      <div><span class="k">Console</span><h4>Alertes et incidents</h4><p>Regroupés, expliqués, notés par l'analyste.</p></div>
    </div>
  </div></section>

  <section class="band" id="agents"><div class="wrap split">
    <div>
      <div class="eyebrow">Déploiement</div>
      <h2>Un agent en une ligne</h2>
      <p class="sub" style="margin-bottom:16px">Le tableau de bord génère la commande avec un jeton à usage limité et l'empreinte du certificat. Le script vérifie la CA et la somme du binaire avant d'installer le service.</p>
      <ul>
        <li><b>Jeton</b> d'enrôlement à durée courte, consommé une seule fois.</li>
        <li><b>Clé d'agent</b> propre à chaque poste, révocable immédiatement.</li>
        <li><b>Mises à jour</b> signées, vérifiées avant remplacement.</li>
        <li>Actions limitées à <code>restart</code>, <code>collect_inventory</code>, <code>update</code>.</li>
      </ul>
    </div>
    <div>
      <div class="term"><div class="term-bar"><i></i><i></i><i></i><span>agent</span></div>
<pre><code>curl -fsSL -k --pinnedpubkey 'sha256//&lt;empreinte&gt;' \
  https://203.0.113.10/agent/install.sh \
  | sudo sh -s -- --server https://203.0.113.10 \
      --token cxe_&lt;jeton&gt; --ca-sha256 &lt;empreinte-CA&gt;</code></pre></div>
      <p class="note-line">Forme abrégée, avec l'adresse de votre serveur. Copiez la commande complète affichée dans Agents › Agents Deployment.</p>
    </div>
  </div></section>

  <section class="band alt" id="installer"><div class="wrap">
    <div class="eyebrow">Démarrer</div>
    <h2>Une commande, avec l'adresse de votre serveur</h2>
    <p class="sub">Controlix s'installe <strong>uniquement</strong> avec cet installeur : pas de dépôt à cloner, pas de compilation. Il contrôle la machine, installe Docker si besoin, télécharge les images, génère les secrets et le certificat, puis vous demande le nom d'utilisateur, l'e-mail et le mot de passe de l'administrateur.</p>
    <div class="install">
      <div class="term"><div class="term-bar"><i></i><i></i><i></i><span>serveur Linux · root</span></div>
<pre><code>curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo sh -s -- install --host 203.0.113.10</code></pre></div>
      <div class="callout-home" role="note"><strong>Remplacez <code>203.0.113.10</code> par l'adresse de VOTRE serveur</strong>, son IP ou son nom DNS, telle que vos navigateurs et vos agents la joindront. Le certificat HTTPS est émis pour cette adresse précise ; avec une autre, la connexion est refusée. Serveur dans le cloud : donnez son IP <em>publique</em>.</div>
      <div class="steps">
        <div><h4>Lancer la commande</h4><p>Sur un serveur Linux, avec l'adresse de ce serveur.</p></div>
        <div><h4>Créer l'administrateur</h4><p>Nom, e-mail et mot de passe de 12 caractères minimum.</p></div>
        <div><h4>Ouvrir la console</h4><p>https://votre-adresse, puis acceptez la CA privée.</p></div>
      </div>
      <ul class="chips"><li>Linux x86_64 ou arm64</li><li>2 Go de RAM minimum, mode léger sous 6 Go</li><li>Ports 80 et 443 (514 pour le Syslog)</li><li>Mises à jour : <code>… | sudo sh -s -- update</code></li><li>Le code source n'est pas distribué</li></ul>
    </div>
  </div></section>

  <div id="articles"><article class="doc" id="doc-introduction" data-slug="introduction" data-title="Introduction" hidden><div class="crumb">Démarrer</div><h1>Introduction</h1><p style="margin-top:0">Ce qu&#x27;est Controlix AI, à qui il s&#x27;adresse et ce qu&#x27;il fait (et ne fait pas).</p>
<p><strong>Controlix AI</strong> est une plateforme SIEM/SOC <strong>autonome</strong> : elle collecte les journaux et l'inventaire de vos machines, les met dans un format commun, repère les comportements dangereux, et vous présente alertes et incidents dans un tableau de bord. Tout tourne sur <strong>un seul serveur Linux</strong>, installé avec <strong>une seule commande</strong>, sans code source à manipuler.</p>
<p>Elle n'a besoin d'aucun outil externe. Wazuh, Suricata, Snort, pfSense ou FortiGate peuvent s'y brancher comme <strong>sources d'événements optionnelles</strong>, mais rien ne dépend d'eux.</p>
<h2 id="introduction--a-qui-s-adresse-t-elle">À qui s'adresse-t-elle</h2>
<ul>
<li>Aux équipes qui veulent un <strong>SOC opérationnel sans monter une architecture multi-serveurs</strong> (collecte, stockage, moteur de détection, interface).</li>
<li>Aux administrateurs qui gèrent un <strong>parc mixte Linux et Windows</strong> et veulent voir en un endroit les connexions, les changements et l'état des machines.</li>
<li>Aux environnements où l'on veut <strong>garder les données chez soi</strong> : tout est calculé localement, y compris la détection d'anomalies.</li>
</ul>
<h2 id="introduction--ce-que-controlix-fait">Ce que Controlix fait</h2>
<table>
<thead>
<tr>
<th>Besoin</th>
<th>Réponse</th>
</tr>
</thead>
<tbody>
<tr>
<td>Collecter</td>
<td>Agents Linux et Windows, réception Syslog, lecture de fichiers, connecteurs vers des outils existants</td>
</tr>
<tr>
<td>Comprendre</td>
<td>Normalisation de tous les journaux dans <strong>un seul schéma</strong>, journal original toujours conservé</td>
</tr>
<tr>
<td>Détecter</td>
<td>28 règles livrées (seuils, valeurs distinctes, séquences), cartographiées <strong>MITRE ATT&amp;CK</strong>, plus une détection d'anomalies par apprentissage</td>
</tr>
<tr>
<td>Corréler</td>
<td>Alertes de plusieurs sources regroupées par IP, machine ou utilisateur en <strong>incidents</strong> expliqués</td>
</tr>
<tr>
<td>Inventorier</td>
<td>Matériel, système, logiciels, services, ports, comptes, mises à jour, avec <strong>historique des changements</strong></td>
</tr>
<tr>
<td>Administrer</td>
<td>Utilisateurs, rôles personnalisés, audit, rétention, sauvegardes, mises à jour d'agents signées</td>
</tr>
</tbody>
</table>
<h2 id="introduction--ce-que-controlix-ne-fait-pas">Ce que Controlix ne fait pas</h2>
<aside class="callout c-attention">
<p><strong>Attention</strong> Controlix <strong>détecte et alerte</strong>, il ne bloque rien. Ce n'est pas un EDR : pas de hooks noyau, pas d'inspection mémoire, pas de quarantaine automatique.</p>
</aside>
<ul>
<li>Il ne remplace pas un pare-feu ni un IPS : il vous dit quoi bloquer.</li>
<li>Il ne cherche pas les CVE dans les logiciels installés : l'inventaire donne la liste et le nombre de mises à jour en attente.</li>
<li>Windows Event Forwarding n'est pas pris en charge : on installe l'agent sur chaque machine.</li>
</ul>
<p>La page <a href="#docs-faq-limites">Limites connues</a> donne la liste complète, sans détour.</p>
<h2 id="introduction--par-ou-commencer">Par où commencer</h2>
<ol>
<li><a href="#docs-distribution">Comment Controlix est distribué</a> : un installeur, des images, pas de code source.</li>
<li><a href="#docs-installation-serveur">Installer le serveur</a> : une commande <strong>avec l'adresse de votre serveur</strong>, vos identifiants sont demandés.</li>
<li><a href="#docs-premiere-connexion">Se connecter et créer des utilisateurs</a>.</li>
<li><a href="#docs-agent-installation">Installer un premier agent</a> depuis le tableau de bord.</li>
<li>Regarder les événements arriver dans <strong>Log Management</strong>, puis l'inventaire dans <strong>Infrastructure</strong>.</li>
<li>Sans infrastructure sous la main : <a href="#docs-simulation">la simulation</a> joue de vraies attaques pour la démonstration.</li>
<li>Brancher vos outils existants : <a href="#docs-integrations">Intégrations</a>.</li>
</ol><div class="pn"><span></span><a class="next" href="#docs-concepts"><small>Suivant</small>Concepts clés</a></div></article><article class="doc" id="doc-concepts" data-slug="concepts" data-title="Concepts clés" hidden><div class="crumb">Démarrer</div><h1>Concepts clés</h1><p style="margin-top:0">Le vocabulaire de la plateforme : agent, événement, règle, alerte, incident, actif.</p>
<p>Le chemin d'une information, du poste surveillé à l'incident :</p>
<pre><code>journal brut ─► événement normalisé ─► règle ─► alerte ─► incident
   (agent)        (un schéma)         (détection)         (corrélation)
</code></pre>
<table>
<thead>
<tr>
<th>Terme</th>
<th>Définition</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Agent</strong></td>
<td>Petit programme installé sur une machine Linux ou Windows. Il envoie journaux et inventaire et n'accepte que trois actions prédéfinies.</td>
</tr>
<tr>
<td><strong>Événement</strong></td>
<td>Une ligne de journal convertie dans le schéma commun (<code>NormalizedEvent</code>). Le texte original reste accessible (<code>raw_log</code>).</td>
</tr>
<tr>
<td><strong>Actif (asset)</strong></td>
<td>Une machine ou un équipement connu : adresse, zone (IT, OT, DMZ), criticité. Les machines enrôlées par un agent deviennent des actifs automatiquement.</td>
</tr>
<tr>
<td><strong>Règle</strong></td>
<td>Une condition de détection écrite en YAML : un événement, un seuil dans une fenêtre de temps, un nombre de valeurs distinctes, ou une séquence.</td>
</tr>
<tr>
<td><strong>Alerte</strong></td>
<td>Le résultat d'une règle qui se déclenche : gravité, confiance, technique MITRE, explication et recommandations.</td>
</tr>
<tr>
<td><strong>Score de risque</strong></td>
<td>De 0 à 100, calculé à partir de la gravité, de la criticité de l'actif, de la zone et des alertes voisines. Chaque point est justifié à l'écran.</td>
</tr>
<tr>
<td><strong>Incident</strong></td>
<td>Regroupement d'alertes liées (même source, même cible, même fenêtre). Il s'ouvre quand le risque est HIGH ou CRITICAL, ou quand une détection est critique.</td>
</tr>
<tr>
<td><strong>Origine</strong></td>
<td><code>real</code> ou <code>simulated</code> : les données de démonstration ne se mélangent jamais aux vraies.</td>
</tr>
</tbody>
</table>
<h2 id="concepts--niveaux-de-risque">Niveaux de risque</h2>
<table>
<thead>
<tr>
<th>Score</th>
<th>Niveau</th>
</tr>
</thead>
<tbody>
<tr>
<td>0 – 20</td>
<td>LOW</td>
</tr>
<tr>
<td>21 – 40</td>
<td>MEDIUM</td>
</tr>
<tr>
<td>41 – 70</td>
<td>HIGH</td>
</tr>
<tr>
<td>71 – 100</td>
<td>CRITICAL</td>
</tr>
</tbody>
</table>
<p>Une force brute isolée à faible risque crée une <strong>alerte</strong> sans ouvrir d'incident. Si la même source se connecte ensuite avec succès, la règle de séquence se déclenche en <strong>critique</strong> et l'incident s'ouvre.</p>
<h2 id="concepts--le-serveur">Le serveur</h2>
<p>Un seul serveur héberge : le point d'entrée HTTPS (nginx), l'API, un worker de traitement, le collecteur (Syslog, fichiers, connecteurs), PostgreSQL, Redis, le service d'IA et l'interface web. OpenSearch est <strong>optionnel</strong>. Voir <a href="#docs-collecte-normalisation">Architecture</a> pour le détail du flux.</p><div class="pn"><a href="#docs-introduction"><small>Précédent</small>Introduction</a><a class="next" href="#docs-distribution"><small>Suivant</small>Comment Controlix est distribué</a></div></article><article class="doc" id="doc-distribution" data-slug="distribution" data-title="Comment Controlix est distribué" hidden><div class="crumb">Démarrer</div><h1>Comment Controlix est distribué</h1><p style="margin-top:0">Un installeur, des images Docker, aucun code source à déployer : ce que vous recevez et ce qui est installé.</p>
<p>Controlix AI s'installe <strong>uniquement avec la commande d'installation</strong> de ce site. Vous n'avez pas de dépôt de code à cloner, pas de compilation, pas de dépendances à installer à la main.</p>
<h2 id="distribution--ce-qui-est-livre">Ce qui est livré</h2>
<table>
<thead>
<tr>
<th>Élément</th>
<th>Rôle</th>
<th>Où il se trouve</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Installeur</strong></td>
<td>Un script qui contrôle le serveur, installe Docker si besoin, génère secrets et certificats, démarre la plateforme</td>
<td><code>https://controlix-ten.vercel.app/install.sh</code></td>
</tr>
<tr>
<td><strong>Images Docker</strong></td>
<td>L'API, le moteur de détection, l'IA, le collecteur et l'interface, prêts à l'emploi</td>
<td>Registre d'images de l'éditeur</td>
</tr>
<tr>
<td><strong>Archive de configuration</strong></td>
<td>Le fichier Compose, les règles de détection modifiables, les analyseurs, les scripts de certificats, les agents Linux et Windows déjà compilés</td>
<td>Serveur de téléchargement de l'éditeur (celui de la commande d'installation)</td>
</tr>
</tbody>
</table>
<p>Le <strong>code source du produit n'est pas distribué</strong> : il ne se trouve ni dans l'archive, ni sur votre serveur.</p>
<h2 id="distribution--ce-qui-est-installe-chez-vous">Ce qui est installé chez vous</h2>
<p>Dans <code>/opt/controlix</code> (modifiable avec <code>--dir</code>) :</p>
<pre><code class="language-text">/opt/controlix
├── docker-compose.yml     les services (à ne pas modifier)
├── .env                   vos secrets et réglages (accès 600, jamais partagé)
├── configs/               règles de détection, analyseurs, pondérations du risque (modifiables)
├── data/tls/              l'autorité de certification privée et le certificat du serveur
├── agent/dist/            les agents Linux et Windows, servis à vos machines
├── backups/               vos sauvegardes
└── install.sh             status, backup, restore, update, self-test, uninstall
</code></pre>
<p>Les données (base, files, modèle IA) sont dans des volumes Docker, sur votre serveur. Aucune donnée n'est envoyée à l'éditeur.</p>
<h2 id="distribution--integrite">Intégrité</h2>
<ul>
<li>L'archive est téléchargée avec sa <strong>somme SHA-256</strong>, vérifiée <strong>avant</strong> toute installation. Si elle ne correspond pas, rien n'est installé.</li>
<li>Les images sont tirées par <strong>numéro de version</strong> : <code>./install.sh update</code> installe une version précise et réversible grâce à la sauvegarde faite avant.</li>
<li>Les agents sont <strong>signés Ed25519</strong> par votre propre clé, générée à l'installation (voir <a href="#docs-securite">Sécurité</a>).</li>
</ul>
<h2 id="distribution--versions-et-mises-a-jour">Versions et mises à jour</h2>
<p>La commande d'installation installe la <strong>dernière version</strong>. Pour une version précise : ajoutez <code>--version 1.0.0</code>. Les mises à jour se font avec la même commande et <code>update</code>, après une sauvegarde automatique : voir <a href="#docs-sauvegarde-mise-a-jour">Sauvegarde et mise à jour</a>.</p>
<h2 id="distribution--registre-prive">Registre privé</h2>
<p>Si l'éditeur vous fournit un accès privé aux images, ajoutez votre identifiant et exportez le jeton :</p>
<pre><code class="language-bash">export CONTROLIX_REGISTRY_TOKEN='&lt;jeton fourni&gt;'
curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo -E sh -s -- install --host 203.0.113.10 --registry-user mon-compte
</code></pre>
<aside class="callout c-note">
<p><strong>Note</strong> Le serveur doit pouvoir joindre Internet pendant l'installation et les mises à jour (le serveur de téléchargement de la commande d'installation, le registre d'images, Docker Hub). Une installation hors ligne n'est pas prise en charge dans cette version.</p>
</aside><div class="pn"><a href="#docs-concepts"><small>Précédent</small>Concepts clés</a><a class="next" href="#docs-installation-serveur"><small>Suivant</small>Installer le serveur</a></div></article><article class="doc" id="doc-installation-serveur" data-slug="installation-serveur" data-title="Installer le serveur" hidden><div class="crumb">Démarrer</div><h1>Installer le serveur</h1><p style="margin-top:0">La commande unique, l&#x27;adresse (IP ou nom) à indiquer, les options, et ce que fait l&#x27;installeur pas à pas.</p>
<p>L'installation tient en <strong>une commande</strong>, à lancer sur le serveur Linux qui hébergera Controlix.</p>
<h2 id="installation-serveur--avant-de-commencer">Avant de commencer</h2>
<table>
<thead>
<tr>
<th>Élément</th>
<th>Exigence</th>
</tr>
</thead>
<tbody>
<tr>
<td>Système</td>
<td>Linux 64 bits (x86_64 ou arm64) : Ubuntu 22.04/24.04 ou Debian 12 conseillés</td>
</tr>
<tr>
<td>Droits</td>
<td><code>root</code> (ou <code>sudo</code>)</td>
</tr>
<tr>
<td>Mémoire</td>
<td>2 Go minimum ; <strong>mode léger</strong> automatique sous 6 Go</td>
</tr>
<tr>
<td>Disque</td>
<td>10 Go libres minimum</td>
</tr>
<tr>
<td>Ports libres</td>
<td><strong>80</strong> et <strong>443</strong> ; <strong>514</strong> (UDP/TCP) si vous recevez du Syslog</td>
</tr>
<tr>
<td>Réseau</td>
<td>Accès Internet sortant pendant l'installation (serveur de téléchargement de la commande d'installation, registre d'images, Docker Hub)</td>
</tr>
<tr>
<td>Outils</td>
<td><code>curl</code>, <code>tar</code>, <code>openssl</code> (Docker est installé par l'installeur s'il manque)</td>
</tr>
</tbody>
</table>
<h2 id="installation-serveur--l-adresse-de-votre-serveur-l-option-host">L'adresse de votre serveur : l'option <code>--host</code></h2>
<aside class="callout c-attention">
<p><strong>Attention</strong> Controlix s'installe <strong>avec l'adresse de VOTRE serveur</strong>. Remplacez <code>203.0.113.10</code> ci-dessous par l'adresse IP (ou le nom DNS) de la machine <strong>telle que vos navigateurs et vos agents la joindront</strong>. Ce n'est pas une valeur d'exemple à garder.</p>
</aside>
<p>Le certificat HTTPS est émis <strong>pour cette adresse précise</strong>, et chaque agent y est lié. Si vous donnez une autre adresse que celle utilisée ensuite, le navigateur ou l'agent refusera la connexion.</p>
<table>
<thead>
<tr>
<th>Votre situation</th>
<th>Quelle adresse donner</th>
</tr>
</thead>
<tbody>
<tr>
<td>Serveur dans votre réseau local</td>
<td>Son <strong>IP privée</strong> (<code>ip -4 addr</code> ou <code>hostname -I</code>), par exemple <code>192.168.1.20</code></td>
</tr>
<tr>
<td>Serveur cloud (OVH, AWS, Azure, Hetzner…)</td>
<td>Son <strong>IP publique</strong>, ou un <strong>nom DNS</strong> qui pointe dessus. L'IP publique n'est souvent pas visible dans la machine : <strong>donnez-la explicitement</strong></td>
</tr>
<tr>
<td>Vous avez un nom (<code>203.0.113.10</code>)</td>
<td>Le nom, avec un enregistrement DNS qui pointe vers le serveur</td>
</tr>
<tr>
<td>Test sur la même machine</td>
<td><code>localhost</code> (aucun agent distant ne pourra s'y connecter)</td>
</tr>
</tbody>
</table>
<p>Préférez un <strong>nom DNS</strong> si l'adresse IP peut changer.</p>
<h2 id="installation-serveur--la-commande">La commande</h2>
<pre><code class="language-bash">curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo sh -s -- install --host 203.0.113.10
</code></pre>
<p>Si vous omettez <code>--host</code>, l'installeur vous <strong>demande</strong> l'adresse et propose celle qu'il a détectée. Sans terminal (script automatisé), il refuse de continuer : il ne devine jamais l'adresse à votre place.</p>
<h3 id="installation-serveur--options">Options</h3>
<table>
<thead>
<tr>
<th>Option</th>
<th>Effet</th>
</tr>
</thead>

<tr>
<td><code>--host ADRESSE</code></td>
<td>IP ou nom DNS du serveur (<strong>à adapter</strong>)</td>

<tr>
<td><code>--dir DOSSIER</code></td>

</tr>
<tr>
<td><code>--light</code></td>
<td>Force le mode léger (sans OpenSearch)</td>
</tr>
<tr>

<tr>

<h2 id="installation-serveur--ce-que-fait-l-installeur">Ce que fait l'installeur</h2>
<ol>
<li><strong>Contrôle</strong> le serveur : architecture, mémoire, disque, ports 80/443 libres.</li>
<li><strong>Télécharge</strong> l'archive de configuration et <strong>vérifie sa somme SHA-256</strong>.</li>
<li><strong>Installe Docker</strong> s'il est absent.</li>
<li><strong>Génère</strong> les secrets (<code>.env</code>, accès 600) et une <strong>autorité de certification privée</strong> avec le certificat pour votre adresse.</li>
<li><strong>Télécharge les images</strong> et démarre les services ; attend qu'ils soient en bonne santé.</li>
<li>Vous demande le <strong>nom d'utilisateur, l'e-mail et le mot de passe</strong> de l'administrateur (12 caractères minimum). Rien de cela n'est écrit dans <code>.env</code>.</li>
<li>Installe un service système (démarrage automatique) et lance un <strong>auto-test</strong>.</li>
</ol>
<p>Compter 3 à 10 minutes selon la connexion.</p>
<h2 id="installation-serveur--apres-l-installation">Après l'installation</h2>
<ol>
<li><strong>Ouvrez le pare-feu</strong> du serveur (et le groupe de sécurité si vous êtes dans le cloud) :</li>
</ol>
<table>
<thead>
<tr>
<th>Port</th>
<th>Sens</th>
<th>Pour</th>
</tr>
</thead>
<tbody>
<tr>
<td>443 TCP</td>
<td>entrant</td>
<td>Interface web et agents</td>
</tr>
<tr>
<td>80 TCP</td>
<td>entrant</td>
<td>Redirection vers HTTPS</td>
</tr>
<tr>
<td>514 UDP/TCP</td>
<td>entrant depuis vos équipements</td>
<td>Syslog (pfSense, FortiGate…)</td>
</tr>
</tbody>
</table>
<ol>
<li>Ouvrez <code>https://203.0.113.10</code> (votre adresse). Le navigateur avertit que le certificat vient d'une autorité privée : importez <code>data/tls/ca.pem</code> dans votre navigateur ou votre système, ou, pour un simple essai, acceptez l'exception.</li>
<li>Connectez-vous avec l'administrateur créé : voir <a href="#docs-premiere-connexion">Première connexion</a>.</li>
<li>Ajoutez votre première machine : <a href="#docs-agent-installation">Installer un agent</a>.</li>
</ol>
<pre><code class="language-bash">sudo /opt/controlix/install.sh status      # état des services
sudo /opt/controlix/install.sh self-test   # contrôle de bout en bout
</code></pre>
<h2 id="installation-serveur--changer-d-adresse-plus-tard">Changer d'adresse plus tard</h2>
<p>Si l'IP ou le nom change :</p>
<pre><code class="language-bash">cd /opt/controlix
sudo sh scripts/gen-tls.sh --renew NOUVELLE_ADRESSE localhost 127.0.0.1
sudo sed -i 's#^PUBLIC_URL=.*#PUBLIC_URL=https://NOUVELLE_ADRESSE#; s#^CORS_ORIGINS=.*#CORS_ORIGINS=https://NOUVELLE_ADRESSE#' .env
sudo docker compose up -d
</code></pre>
<p>La clé de l'autorité reste la même : les agents déjà installés gardent leur confiance. Ils pointent toutefois vers l'ancienne adresse : <strong>réinstallez-les</strong> avec la nouvelle commande de déploiement (Agents › Agents Deployment).</p>
<h2 id="installation-serveur--desinstaller">Désinstaller</h2>
<pre><code class="language-bash">sudo /opt/controlix/install.sh uninstall           # arrête, conserve les données
sudo /opt/controlix/install.sh uninstall --purge   # supprime aussi les données (sauvegarde d'abord)
</code></pre>
<aside class="callout c-astuce">
<p><strong>Astuce</strong> Une installation existante n'est jamais écrasée sans confirmation et sans sauvegarde. Relancer la commande sur un serveur déjà installé est sans danger.</p>
</aside><div class="pn"><a href="#docs-distribution"><small>Précédent</small>Comment Controlix est distribué</a><a class="next" href="#docs-premiere-connexion"><small>Suivant</small>Première connexion</a></div></article><article class="doc" id="doc-premiere-connexion" data-slug="premiere-connexion" data-title="Première connexion" hidden><div class="crumb">Démarrer</div><h1>Première connexion</h1><p style="margin-top:0">Se connecter, découvrir l&#x27;interface, créer ses premiers utilisateurs.</p>
<h2 id="premiere-connexion--se-connecter">Se connecter</h2>
<p>La page de connexion accepte votre <strong>nom d'utilisateur</strong> ou votre <strong>e-mail</strong>, avec le mot de passe choisi à l'installation. La session dure 7 jours tant que vous restez actif ; un jeton d'accès de 15 minutes est renouvelé automatiquement. Après 5 tentatives ratées en une minute, la connexion est suspendue brièvement : c'est une protection, pas une panne.</p>
<p>Le bouton soleil/lune en haut à droite alterne entre <strong>mode clair</strong> et <strong>mode nuit</strong>. Le choix est mémorisé.</p>

<h2 id="premiere-connexion--donnees-reelles-ou-simulees">Données réelles ou simulées</h2>
<p>Un sélecteur <strong>Real data / Simulated</strong> apparaît en haut. Le mode simulé montre des données de démonstration pour découvrir l'interface ; un bandeau jaune le rappelle. Les deux mondes ne se mélangent jamais.</p>
<h2 id="premiere-connexion--creer-des-utilisateurs">Créer des utilisateurs</h2>
<p><strong>Administration › Users › Add user</strong> : nom d'utilisateur, e-mail, nom complet, mot de passe (12 caractères minimum) et rôle. Le bouton <strong>Edit</strong> permet de changer le rôle, désactiver le compte ou réinitialiser le mot de passe. Voir <a href="#docs-utilisateurs-roles">Utilisateurs et rôles</a>.</p>
<h2 id="premiere-connexion--premiers-pas-conseilles">Premiers pas conseillés</h2>
<ol>
<li>Créez un compte par personne ; ne partagez pas le compte administrateur.</li>
<li><a href="#docs-agent-installation">Installez un premier agent</a> sur une machine de test.</li>
<li>Ouvrez <strong>Infrastructure</strong> : l'inventaire apparaît en quelques minutes.</li>
<li>Ouvrez <strong>Log Management</strong> et filtrez sur le nom de la machine.</li>
<li>Réglez la rétention selon votre espace disque.</li>
</ol><div class="pn"><a href="#docs-installation-serveur"><small>Précédent</small>Installer le serveur</a><a class="next" href="#docs-simulation"><small>Suivant</small>Simulation et mode démo</a></div></article><article class="doc" id="doc-simulation" data-slug="simulation" data-title="Simulation et mode démo" hidden><div class="crumb">Démarrer</div><h1>Simulation et mode démo</h1><p style="margin-top:0">Générer de vraies attaques simulées pour voir toute la chaîne de détection, sans aucune infrastructure.</p>
<p>Controlix contient un <strong>mode démo</strong> : il fabrique des attaques réalistes et les fait traverser <strong>le vrai moteur</strong> (normalisation, règles, corrélation, risque, incident, IA). Vous voyez le produit travailler sans installer un seul agent, ni brancher un seul équipement.</p>
<p>Il sert à <strong>découvrir</strong> le produit, à <strong>former</strong> une équipe, à <strong>présenter</strong> une démonstration, et à <strong>vérifier</strong> qu'une règle personnalisée réagit.</p>
<h2 id="simulation--separation-stricte">Séparation stricte</h2>
<p>Les données simulées sont <strong>marquées</strong> et ne se mélangent <strong>jamais</strong> avec les données réelles :</p>
<ul>
<li>un sélecteur <strong>Real data / Simulated</strong> en haut de la console choisit le monde affiché ;</li>
<li>un bandeau jaune « Simulated data — Demo Mode » rappelle que rien ne vient de votre infrastructure ;</li>
<li>un bouton <strong>Delete simulated data</strong> supprime tout le simulé ; les données réelles ne sont jamais touchées.</li>
</ul>
<h2 id="simulation--activer-la-simulation">Activer la simulation</h2>
<p>La simulation est <strong>désactivée par défaut</strong>. Deux façons de l'activer :</p>
<pre><code class="language-bash"># à l'installation
curl -fsSL https://controlix-ten.vercel.app/install.sh | sudo sh -s -- install --host 203.0.113.10 --demo

# ou plus tard
sudo sed -i 's/^DEMO_MODE_ENABLED=.*/DEMO_MODE_ENABLED=true/' /opt/controlix/.env
cd /opt/controlix &amp;&amp; sudo docker compose up -d
</code></pre>
<p>Le menu <strong>Administration › Demo</strong> apparaît (administrateurs uniquement).</p>
<aside class="callout c-attention">
<p><strong>Attention</strong> Désactivez la simulation sur un serveur de production réel : remettez <code>DEMO_MODE_ENABLED=false</code> et relancez <code>docker compose up -d</code>.</p>
</aside>
<h2 id="simulation--utiliser-la-page-demo-etape-par-etape">Utiliser la page Demo, étape par étape</h2>
<h3 id="simulation--1-create-the-simulated-environment">1 · Create the simulated environment</h3>
<p>Le bouton <strong>Seed assets</strong> crée <strong>10 actifs simulés</strong> : serveurs, un pare-feu, un poste SCADA, des automates (PLC) et des objets connectés, répartis dans les zones IT et OT.</p>
<h3 id="simulation--2-launch-an-attack-scenario">2 · Launch an attack scenario</h3>
<p>Choisissez un scénario dans la liste <strong>Scenario</strong>, puis <strong>Run scenario</strong>. La console bascule sur les données simulées.</p>

</tr>

<td><code>port_scan</code></td>

</tr>
<tr>

</tr>
<tr>

<td>Trafic MQTT inhabituel</td>
</tr>
<tr>
<td><code>malware_detection</code></td>
<td>Détection d'un logiciel malveillant</td>
</tr>

<p>Allez ensuite dans <strong>Alerts</strong> et <strong>Incidents</strong> avec le sélecteur sur <em>Simulated</em>.</p>
<h3 id="simulation--3-live-traffic">3 · Live traffic</h3>
<p><strong>Start live traffic</strong> lance du trafic de fond et <strong>une attaque aléatoire toutes les 2 minutes environ</strong>, pratique pour une démonstration qui reste vivante. <strong>Stop live traffic</strong> l'arrête.</p>
<h3 id="simulation--4-ai-anomaly-detection">4 · AI anomaly detection</h3>
<p>L'IA doit voir le comportement normal avant de repérer l'anormal. Suivez les quatre boutons <strong>dans l'ordre</strong>, puis ouvrez <strong>AI Detection</strong> :</p>
<ol>
<li><strong>Generate normal traffic</strong> : 6 heures de trafic normal ;</li>
<li><strong>Train the model</strong> : entraînement du modèle ;</li>
<li><strong>Simulate the anomaly</strong> : un automate (PLC-03) contacte des dizaines d'hôtes inconnus et inonde MQTT ;</li>
<li><strong>Analyse now</strong> : l'IA signale l'écart <strong>et explique ce qui a changé</strong>.</li>
</ol>
<h2 id="simulation--demonstration-de-dix-minutes">Démonstration de dix minutes</h2>
<ol>
<li>Activez la simulation, <strong>Seed assets</strong>, <strong>Run scenario</strong> <code>ssh_compromise</code>.</li>
<li><strong>Overview</strong> : le risque global monte, un incident critique apparaît.</li>
<li>Ouvrez l'incident : la chronologie montre les quatre alertes et le motif reconnu ; « Why this risk score » détaille le score.</li>
<li><strong>MITRE ATT&amp;CK</strong> : les techniques observées s'allument.</li>
<li>Enchaînez avec l'étape 4 pour montrer l'IA.</li>
<li>Terminez par <strong>Delete simulated data</strong>.</li>
</ol>
<aside class="callout c-note">
<p><strong>Note</strong> La simulation envoie des événements <strong>déjà formatés</strong> au moteur : elle prouve que la détection fonctionne, pas que vos propres équipements sont bien branchés. Pour cela, utilisez les pages <a href="#docs-integrations">Intégrations</a>.</p>
</aside><div class="pn"><a href="#docs-premiere-connexion"><small>Précédent</small>Première connexion</a><a class="next" href="#docs-agent-installation"><small>Suivant</small>Installer un agent</a></div></article><article class="doc" id="doc-agent-installation" data-slug="agent-installation" data-title="Installer un agent" hidden><div class="crumb">Agents</div><h1>Installer un agent</h1><p style="margin-top:0">Une commande par machine, générée depuis le tableau de bord. Linux et Windows.</p>
<p>Le tableau de bord génère une <strong>commande personnalisée</strong> contenant un jeton à usage limité. Vous la collez sur la machine, et l'agent s'installe, s'enrôle et démarre. Le jeton n'est jamais enregistré sur la machine et ne sert qu'une fois (ou le nombre de fois que vous avez fixé).</p>
<h2 id="agent-installation--etape-1-generer-le-jeton">Étape 1 : générer le jeton</h2>
<ol>
<li>Ouvrez <strong>Agents › Agents Deployment</strong>.</li>
<li>Renseignez le formulaire, puis cliquez sur <strong>Generate token</strong>.</li>
<li>Copiez la commande <strong>Linux</strong> ou <strong>Windows</strong> : le jeton <code>cxe_…</code> n'est affiché <strong>qu'une fois</strong> ; le serveur n'en garde que l'empreinte.</li>
</ol>
<table>
<thead>
<tr>
<th>Champ</th>
<th>Signification</th>
</tr>
</thead>
<tbody>
<tr>
<td>Label</td>
<td>Nom libre pour retrouver le jeton (« Serveurs web », « Parc Paris »)</td>
</tr>
<tr>
<td>Validité</td>
<td>De 1 h à 720 h (30 jours)</td>
</tr>
<tr>
<td>Usages</td>
<td>Nombre de machines pouvant s'enrôler avec ce jeton, de 1 à 1000</td>
</tr>
<tr>
<td>Zone</td>
<td><code>IT</code>, <code>OT</code> ou <code>DMZ</code> : zone attribuée aux machines enrôlées</td>
</tr>
<tr>
<td>Criticité</td>
<td><code>LOW</code>, <code>MEDIUM</code>, <code>HIGH</code> ou <code>CRITICAL</code> : valeur par défaut des machines</td>
</tr>
</tbody>
</table>
<p>Un jeton expiré, épuisé ou révoqué reçoit toujours la même réponse (401), sans indication sur la cause.</p>
<h2 id="agent-installation--etape-2a-machine-linux">Étape 2a : machine Linux</h2>
<p>Collez la commande dans un terminal <strong>root</strong> (ou avec <code>sudo</code>) :</p>
<pre><code class="language-bash">curl -fsSL -k --pinnedpubkey 'sha256//&lt;empreinte&gt;' \
  https://203.0.113.10/agent/install.sh \
  | sudo sh -s -- --server https://203.0.113.10 \
      --token cxe_&lt;jeton&gt; --ca-sha256 &lt;empreinte-CA&gt;
</code></pre>
<p>Le script récupère la CA du serveur et <strong>vérifie son empreinte</strong>, télécharge le binaire et <strong>vérifie sa somme SHA-256 contre le manifeste</strong>, enrôle la machine, puis installe et démarre le service <code>controlix-agent</code> (systemd). Architectures : <code>amd64</code> et <code>arm64</code>.</p>
<p>Le <code>-k</code> de <code>curl</code> ne sert qu'à l'amorçage : la clé publique du serveur est épinglée avec <code>--pinnedpubkey</code>. Ensuite l'agent ne fait confiance <strong>qu'à la CA de Controlix</strong> (ni CA système, ni contournement).</p>
<p>Le service s'exécute en <strong>root</strong>, ce qui est nécessaire pour lire <code>/var/log/auth.log</code>, journald et surveiller les fichiers sensibles. Il est borné : <code>NoNewPrivileges</code>, <code>ProtectSystem=full</code>, <code>MemoryMax</code>, <code>CPUQuota=30%</code> et redémarrage automatique.</p>
<h2 id="agent-installation--etape-2b-machine-windows">Étape 2b : machine Windows</h2>
<p>Ouvrez <strong>PowerShell en tant qu'administrateur</strong> et collez la commande Windows du tableau de bord (une seule ligne). Elle valide le certificat du serveur par son empreinte, télécharge <code>install.ps1</code>, puis installe le service <code>ControlixAgent</code> (démarrage automatique différé, redémarrage automatique en cas d'échec).</p>
<pre><code class="language-powershell">powershell -NoProfile -ExecutionPolicy Bypass -Command &quot;
  [Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12;
  iwr -UseBasicParsing https://203.0.113.10/agent/install.ps1 `
      -OutFile $env:TEMP\controlix-install.ps1;
  &amp; $env:TEMP\controlix-install.ps1 -Server https://203.0.113.10 `
      -Token cxe_&lt;jeton&gt; -CaSha256 &lt;empreinte-CA&gt;&quot;
</code></pre>
<aside class="callout c-note">
<p><strong>Note</strong> Forme abrégée et répartie sur plusieurs lignes pour la lecture. <strong>Copiez la commande complète affichée par le tableau de bord</strong> : elle tient sur une seule ligne et contient déjà l'empreinte du certificat.</p>
</aside>
<p>Journaux lus : <strong>Security</strong>, <strong>System</strong> et <strong>Application</strong> (liste d'identifiants d'événements configurable). Ajoutez <code>-EnableAudit</code> pour activer la stratégie d'audit nécessaire à certains événements de sécurité.</p>
<aside class="callout c-attention">
<p><strong>Attention</strong> L'agent Windows est compilé et testé sur des échantillons de sortie réels, mais n'a pas encore été exécuté sur un Windows réel pendant le développement. Déployez d'abord sur <strong>une machine pilote</strong> et vérifiez les étapes ci-dessous.</p>
</aside>
<h2 id="agent-installation--etape-3-verifier">Étape 3 : vérifier</h2>
<ol>
<li>Dans <strong>Agents</strong>, la machine apparaît en quelques secondes avec l'état <code>online</code>, sa version et sa dernière activité.</li>
<li>Dans <strong>Infrastructure</strong>, elle s'affiche avec son matériel, ses logiciels, services, ports et comptes (l'inventaire complet arrive en quelques minutes).</li>
<li>Dans <strong>Log Management</strong>, filtrez sur le nom d'hôte : les événements apparaissent avec le journal original.</li>
</ol>
<p>Sur la machine :</p>
<pre><code class="language-bash">controlix-agent status        # identifiants + connectivité (code retour 0 si OK)
controlix-agent collect-now   # envoie un inventaire complet tout de suite
systemctl status controlix-agent        # Linux
Get-Service ControlixAgent              # Windows (PowerShell)
</code></pre>
<h2 id="agent-installation--deployer-sur-beaucoup-de-machines">Déployer sur beaucoup de machines</h2>
<p>Générez <strong>un jeton avec N usages</strong> et une validité adaptée, puis exécutez la même commande depuis votre outil de déploiement (Ansible, GPO, Intune, script SSH). Chaque machine obtient sa <strong>propre clé d'agent</strong> ; le jeton ne sert qu'à l'enrôlement.</p>
<h2 id="agent-installation--installation-manuelle">Installation manuelle</h2>
<pre><code class="language-bash">CONTROLIX_TOKEN=cxe_&lt;jeton&gt; controlix-agent enroll \
  --server https://203.0.113.10 --ca-file ca.pem --ca-sha256 &lt;empreinte-CA&gt;
controlix-agent service install &amp;&amp; controlix-agent service start
</code></pre>
<h2 id="agent-installation--emplacements-sur-la-machine">Emplacements sur la machine</h2>
<table>
<thead>
<tr>
<th></th>
<th>Linux</th>
<th>Windows</th>
</tr>
</thead>

<tr>
<td>Configuration (accès restreint)</td>

<td><code>%ProgramData%\Controlix\Agent\state\</code></td>
</tr>
<tr>
<td>Journal de l'agent</td>

<h2 id="agent-installation--desinstaller">Désinstaller</h2>
<pre><code class="language-bash">sudo sh agent/install/uninstall.sh --purge        # Linux
.\uninstall.ps1                                   # Windows (PowerShell administrateur)
</code></pre>
<p>Révoquez ensuite l'agent dans <strong>Agents › Revoke</strong> pour que sa clé soit refusée définitivement.</p><div class="pn"><a href="#docs-simulation"><small>Précédent</small>Simulation et mode démo</a><a class="next" href="#docs-agent-configuration"><small>Suivant</small>Configurer les agents</a></div></article><article class="doc" id="doc-agent-configuration" data-slug="agent-configuration" data-title="Configurer les agents" hidden><div class="crumb">Agents</div><h1>Configurer les agents</h1><p style="margin-top:0">Réglages centralisés sur le serveur : fréquences, collecteurs, journaux, tampon.</p>
<p>La configuration est <strong>centralisée sur le serveur</strong> : elle est envoyée à tous les agents lors de leur prochain battement (30 s par défaut), sans réinstallation. Chaque valeur reçue est <strong>bornée</strong> par l'agent : une mauvaise valeur ne peut pas le dégrader. Les clés inconnues sont refusées par le serveur (422) et ignorées par l'agent.</p>

<h2 id="agent-configuration--modifier-la-configuration">Modifier la configuration</h2>
<p>La configuration se modifie par l'API d'administration. Les clés absentes gardent leur valeur par défaut. Exemple : suivre le journal d'une application, agrandir le tampon et ne surveiller aucun processus.</p>
<pre><code class="language-bash">SERVER=https://203.0.113.10
TOKEN=$(curl -s --cacert data/tls/ca.pem -H 'Content-Type: application/json' \
  -d '{&quot;identifier&quot;:&quot;soc.admin&quot;,&quot;password&quot;:&quot;&lt;mot-de-passe&gt;&quot;}' $SERVER/api/v1/auth/login \
  | sed -n 's/.*&quot;access_token&quot;:&quot;\([^&quot;]*\)&quot;.*/\1/p')

curl -s --cacert data/tls/ca.pem -X PUT $SERVER/api/v1/agents/config \
  -H &quot;Authorization: Bearer $TOKEN&quot; -H 'Content-Type: application/json' -d '{
    &quot;config&quot;: {
      &quot;buffer_max_mb&quot;: 1024,
      &quot;collectors&quot;: {&quot;process&quot;: &quot;off&quot;},
      &quot;extra_logs&quot;: [{&quot;path&quot;: &quot;/var/log/nginx/error.log&quot;, &quot;src&quot;: &quot;nginx&quot;}]
    }
  }'
</code></pre>
<p>La réponse indique le nouveau numéro de version ; <code>GET /api/v1/agents/config</code> affiche la configuration en vigueur.</p>
<aside class="callout c-astuce">
<p><strong>Astuce</strong> Gardez les valeurs par défaut pour démarrer. Agrandissez <code>buffer_max_mb</code> pour des sites à connexion instable, ajoutez <code>extra_logs</code> pour vos applications, et passez <code>collectors.process</code> à <code>off</code> sur des machines très chargées.</p>
</aside>
